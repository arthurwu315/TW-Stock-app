    // =========================================================================
    // 2. 雙軌即時 API 行情獲取
    // =========================================================================
    function autoAdjustCorporateActions(klines) {
      if (!klines || klines.length < 2) return klines;
      const adjusted = klines.map(k => ({ ...k }));
      for (let i = adjusted.length - 1; i > 0; i--) {
        const prevClose = adjusted[i - 1].close;
        const curOpen = adjusted[i].open;
        if (prevClose <= 0 || curOpen <= 0) continue;
        const gap = (curOpen - prevClose) / prevClose;
        if (gap < -0.105 || gap > 0.105) {
          const factor = curOpen / prevClose;
          for (let j = 0; j < i; j++) {
            adjusted[j].open = parseFloat((adjusted[j].open * factor).toFixed(2));
            adjusted[j].high = parseFloat((adjusted[j].high * factor).toFixed(2));
            adjusted[j].low = parseFloat((adjusted[j].low * factor).toFixed(2));
            adjusted[j].close = parseFloat((adjusted[j].close * factor).toFixed(2));
            if (adjusted[j].volume && factor > 0) {
              adjusted[j].volume = Math.round(adjusted[j].volume / factor);
            }
          }
        }
      }
      return adjusted;
    }

      if (!forceRefresh) {
        try {
          const cache = localStorage.getItem(cacheKey);
          if (cache) {
            const parsed = JSON.parse(cache);
            if (parsed && (Date.now() - parsed.timestamp < 3600 * 1000) && parsed.data?.length >= 10) {
              return parsed.data;
            }
          }
        } catch (e) {}
      }

      let directUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startStr}`;
      const savedToken = localStorage.getItem('finmind_api_token') || '';
      if (savedToken) directUrl += `&token=${encodeURIComponent(savedToken)}`;

      const endpoints = [
        directUrl,
        `https://corsproxy.io/?url=${encodeURIComponent(directUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`
      ];

      for (let url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const json = await res.json();
          const list = json.data || [];
          if (list.length >= 10) {
            const rawCandles = list
              .filter(d => d.date && d.close > 0 && d.max > 0 && d.min > 0)
              .map(d => ({
                time: d.date,
                open: d.open || d.close,
                high: d.max,
                low: d.min,
                close: d.close,
                volume: d.Trading_Volume || d.volume || 0
              }));
            const finalKlines = autoAdjustCorporateActions(rawCandles);
            try {
              localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: finalKlines }));
            } catch (e) {}
            return finalKlines;
          }
        } catch (err) {}
      }
      throw new Error(`台股 ${code} 連線異常`);
    }

    async function fetchBinanceKlines(symbol, interval = '1h', limit = 220) {
      const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Binance API HTTP ${res.status}`);
      const data = await res.json();
      return data.map(item => ({
        time: Math.floor(item[0] / 1000),
        open: parseFloat(item[1]),
        high: parseFloat(item[2]),
        low: parseFloat(item[3]),
        close: parseFloat(item[4]),
        volume: parseFloat(item[5])
      }));
    }

    async function loadAssetKlines(code, forceRefresh = false) {
      if (currentMarket === 'CRYPTO') {
        return await fetchBinanceKlines(code, currentTimeframe, 220);
      } else {
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 730);
        const startStr = startDate.toISOString().split('T')[0];
        return await fetchTWKlines(code, startStr, forceRefresh);
      }
    }

    // =========================================================================
    // 3. 全自動多空趨勢定性與雙向翻箱引擎 (關鍵突破升級！)
    // =========================================================================
    function analyzeBidirectionalStructure(klines, code = '') {
      if (!klines || klines.length < 25) return;
      const isCrypto = (currentMarket === 'CRYPTO');
      const isFinancial = !isCrypto && (code.startsWith('28') || code.startsWith('58') || code.startsWith('60'));
      const len = klines.length;
      const curPrice = klines[len - 1].close;

      // 1. 計算均線矩陣
      const ma10 = klines.slice(-10).reduce((s, k) => s + k.close, 0) / 10;
      const ma20 = klines.slice(-20).reduce((s, k) => s + k.close, 0) / 20;
      const ma60 = len >= 60 ? (klines.slice(-60).reduce((s, k) => s + k.close, 0) / 60) : ma20;

      // 2. 波動度與乖離率
      let trSum14 = 0;
      const atrPeriod = Math.min(14, len - 1);
      for (let i = len - atrPeriod; i < len; i++) {
        trSum14 += Math.max(klines[i].high - klines[i].low, Math.abs(klines[i].high - klines[i - 1].close), Math.abs(klines[i].low - klines[i - 1].close));
      }
      const atr14 = Math.max(curPrice * 0.003, trSum14 / atrPeriod);
      const atrPct = (atr14 / curPrice) * 100;
      const bias20 = ((curPrice - ma20) / ma20) * 100;
      const bias60 = ((curPrice - ma60) / ma60) * 100;

      // 3. 長線宏觀定性 (Macro Regime Detection)
      let macroRegime = 'NEUTRAL';
      let regimeDesc = '';
      if (curPrice >= ma60 && ma20 >= ma60 * 0.99) {
        macroRegime = 'BULL';
        regimeDesc = '🟢 多頭主升浪 (生命線之上)';
      } else if (curPrice < ma60 && ma20 < ma60) {
        macroRegime = 'BEAR';
        regimeDesc = '🔴 空頭下行浪 (生命線之下)';
      } else {
        macroRegime = 'NEUTRAL';
        regimeDesc = '🟡 均線糾結·多空爭奪區';
      }

      // 4. 短線幾何微型箱體識別 (Micro Box)
      const lookback = (isCrypto && (currentTimeframe === '1h' || currentTimeframe === '15m'))
        ? Math.min(28, len)
        : (isCrypto ? Math.min(45, len) : Math.min(80, len));

      const recentSlice = klines.slice(-lookback);
      const maxBody = Math.max(...recentSlice.map(k => Math.max(k.open, k.close)));
      const minBody = Math.min(...recentSlice.map(k => Math.min(k.open, k.close)));
      const peakHigh = Math.max(...recentSlice.map(k => k.high));
      const troughLow = Math.min(...recentSlice.map(k => k.low));

      const effectiveHigh = (peakHigh > maxBody * 1.04) ? (maxBody * 1.015) : peakHigh;
      const effectiveLow = (troughLow < minBody * 0.96) ? (minBody * 0.985) : troughLow;

      let boxH = effectiveHigh - effectiveLow;
      const maxCapRatio = isCrypto ? (currentTimeframe === '1h' ? 0.05 : 0.09) : (isFinancial ? 0.07 : 0.14);
      const minBoxRatio = isCrypto ? 0.018 : 0.035;
      boxH = Math.max(curPrice * minBoxRatio, Math.min(boxH, curPrice * maxCapRatio));

      // 5. 動態多空方向決策 (Direction Decision)
      let direction = 'LONG';
      let entry = 0;
      let stop = 0;
      let t1 = 0;
      let t2 = 0;
      let type = '';
      let rationale = '';
      let priority = 1;

      // 判斷是否為「真跌破空頭翻箱」
      const isBreakingDown = (curPrice <= effectiveLow * 1.008);
      const isBreakingUp = (curPrice >= effectiveHigh * 0.992);

      if (macroRegime === 'BEAR') {
        // 【空頭市場規則】：禁止順勢追多，只允許破位放空或超跌極限短打
        if (bias20 < -8.0 && curPrice <= effectiveLow * 0.98) {
          // 長空短超跌
          direction = 'LONG';
          type = '⚡ 負乖離過大·超跌搶反彈';
          entry = curPrice;
          stop = curPrice - 1.0 * atr14;
          t1 = Math.min(effectiveLow, ma20);
          t2 = ma20;
          rationale = `長線處於 60MA 之下，但 20MA 負乖離達 ${bias20.toFixed(1)}%！出現短線超賣；僅允許以 1.0×ATR 小額博弈反彈至 20MA，嚴禁波段長抱！`;
          priority = 2;
        } else if (isBreakingDown) {
          // 標準空頭翻箱 (向下等幅對稱測幅)
          direction = 'SHORT';
          type = isCrypto ? '📉 破位下殺·亞當反向翻箱' : '📉 破位下殺·融券放空/避險';
          entry = effectiveLow;
          stop = effectiveLow + 1.2 * atr14; // 收回箱體上方即停損
          t1 = effectiveLow - boxH;          // 向下翻出 1 倍箱高
          t2 = t1 - boxH;                    // 向下翻出 2 倍箱高
          rationale = `生命線空頭排列，且 1H 實體正式收破箱底座 $${formatPrice(effectiveLow)}！支撐轉為強壓力，啟動亞當反向下翻測幅，T1 下看 $${formatPrice(t1)}`;
          priority = 5;
        } else {
          // 破位後反抽壓力位受阻空
          direction = 'SHORT';
          type = '⚠️ 弱勢反抽·阻力承壓空';
          entry = Math.min(curPrice, effectiveHigh);
          stop = entry + 1.2 * atr14;
          t1 = effectiveLow;
          t2 = effectiveLow - boxH;
          rationale = `長線空方掌控，短線反抽至均線 ($${formatPrice(ma20)}) 遇阻；逢高掛單佈局空單，停損設於壓力上方`;
          priority = 4;
        }
      } else {
        // 【多頭或中性震盪市場規則】：順勢向上翻箱做多
        direction = 'LONG';
        if (bias20 > (isCrypto ? 6.5 : 4.5) && isBreakingUp) {
          type = '⚠️ 短線暴衝·防插針拉回';
          const safePullback = Math.max(ma10, effectiveHigh * 0.985);
          entry = safePullback;
          stop = Math.max(effectiveLow, entry - 1.2 * atr14);
          t1 = effectiveHigh + boxH;
          t2 = t1 + boxH;
          rationale = `短線暴衝正乖離達 ${bias20.toFixed(1)}%！無密集底座支撐，拒絕追高，預約於 10MA ($${formatPrice(entry)}) 回踩接單`;
          priority = 3;
        } else if (isBreakingUp) {
          type = '🚀 頸線突破·亞當向上翻倍';
          entry = effectiveHigh;
          stop = effectiveHigh - 1.2 * atr14;
          t1 = effectiveHigh + boxH;
          t2 = t1 + boxH;
          rationale = `均線多頭發散，放量站穩水平頸線 $${formatPrice(effectiveHigh)}！以 1.2×ATR 設防洗停損，向上對稱翻出首波目標 $${formatPrice(t1)}`;
          priority = 5;
        } else if (curPrice <= effectiveLow * 1.02) {
          type = '🛡️ 底座止跌·極限低吸';
          entry = effectiveLow + 0.3 * atr14;
          stop = effectiveLow - 0.7 * atr14;
          t1 = effectiveHigh;
          t2 = effectiveHigh + boxH;
          rationale = `回測多頭密集底座 $${formatPrice(effectiveLow)}，盈虧比極佳，停損嚴格守破底`;
          priority = 4;
        } else {
          type = '📈 順勢均線·回踩佈局';
          entry = Math.max(ma20, curPrice - 0.4 * atr14);
          stop = Math.min(effectiveLow, entry - 1.2 * atr14);
          t1 = effectiveHigh + boxH;
          t2 = t1 + boxH;
          rationale = `處於 20 均線上方順勢運行，於 20MA ($${formatPrice(ma20)}) 附近限價掛單承接`;
          priority = 3;
        }
      }

      // 6. 風險與盈虧比計算 (支援雙向)
      let risk, reward;
      if (direction === 'SHORT') {
        risk = Math.max(curPrice * 0.003, stop - entry);
        reward = Math.max(curPrice * 0.003, entry - t1);
      } else {
        risk = Math.max(curPrice * 0.003, entry - stop);
        reward = Math.max(curPrice * 0.003, t1 - entry);
      }
      const rr = parseFloat((reward / risk).toFixed(1));

      currentStructure = {
        currentPrice: curPrice,
        direction,
        macroRegime,
        regimeDesc,
        macroLow: effectiveLow,
        macroHigh: effectiveHigh,
        localLow: minBody,
        localHigh: maxBody,
        boxH,
        t1,
        t2,
        strategyType: type,
        suggestedEntry: entry,
        suggestedStop: stop,
        rrRatio: rr,
        rationale
      };
    }

    function initChart() {
      const box = document.getElementById('chart-box');
      chart = LightweightCharts.createChart(box, {
        width: box.clientWidth,
        height: box.clientHeight || 340,
        layout: {
          background: { color: 'transparent' },
          textColor: '#8e8e93',
          fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif'
        },
        grid: {
          vertLines: { color: 'rgba(255, 255, 255, 0.04)' },
          horzLines: { color: 'rgba(255, 255, 255, 0.04)' }
        },
        rightPriceScale: {
          borderColor: 'rgba(255, 255, 255, 0.1)',
          autoScale: true,
          scaleMargins: { top: 0.14, bottom: 0.14 }
        },
        timeScale: {
          borderColor: 'rgba(255, 255, 255, 0.1)',
          timeVisible: true,
          secondsVisible: false
        },
        handleScroll: {
          mouseWheel: true,
          pressedMouseMove: true,
          horzTouchDrag: true,
          vertTouchDrag: true
        },
        handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#30d158',
        downColor: '#ff453a',
        borderVisible: false,
        wickUpColor: '#30d158',
        wickDownColor: '#ff453a',
        autoscaleInfoProvider: (original) => {
          const res = original();
          if (!res || !res.priceRange) return res;

          let minP = res.priceRange.minValue;
          let maxP = res.priceRange.maxValue;

          if (currentViewMode === 'FOCUS') {
            if (currentStructure.suggestedStop > 0) {
              minP = Math.min(minP, currentStructure.suggestedStop * 0.996);
              maxP = Math.max(maxP, currentStructure.suggestedStop * 1.004);
            }
            if (currentStructure.suggestedEntry > 0) {
              minP = Math.min(minP, currentStructure.suggestedEntry * 0.996);
              maxP = Math.max(maxP, currentStructure.suggestedEntry * 1.004);
            }
            return { priceRange: { minValue: minP * 0.995, maxValue: maxP * 1.005 }, margins: res.margins };
          } else if (currentViewMode === 'T1') {
            if (currentStructure.t1 > 0) {
              minP = Math.min(minP, currentStructure.t1 * 0.99);
              maxP = Math.max(maxP, currentStructure.t1 * 1.01);
            }
            return { priceRange: { minValue: minP, maxValue: maxP }, margins: res.margins };
          } else if (currentViewMode === 'MACRO') {
            if (currentStructure.t2 > 0) {
              minP = Math.min(minP, currentStructure.t2 * 0.985);
              maxP = Math.max(maxP, currentStructure.t2 * 1.015);
            }
            return { priceRange: { minValue: minP, maxValue: maxP }, margins: res.margins };
          }
          return res;
        }
      });

      const resizeObserver = new ResizeObserver(entries => {
        if (!entries || entries.length === 0) return;
        const { width, height } = entries[0].contentRect;
        if (chart && width > 0 && height > 0 && !isChartHidden && currentDashboardMode !== 'VALUE') {
          chart.applyOptions({ width, height });
        }
      });
      resizeObserver.observe(box);
    }

    function formatPrice(p) {
      if (p === undefined || p === null || isNaN(p)) return '0.00';
      if (p >= 1000) return p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (p >= 1) return p.toFixed(3);
      if (p >= 0.01) return p.toFixed(4);
      return p.toFixed(6);
    }

    function clearPriceLines() {
      activePriceLines.forEach(l => candleSeries.removePriceLine(l));
      activePriceLines = [];
      avgCostLine = null;
    }

    function addLine(price, color, title, lineStyle = 2, lineWidth = 2) {
      if (!price || isNaN(price) || price <= 0) return null;
      const l = candleSeries.createPriceLine({
        price: parseFloat(price), color, lineWidth, lineStyle, title
      });
      activePriceLines.push(l);
      return l;
    }

      }
    }

    function aggregateTWKlines(dailyData, type) {
      if (type === 'D') return dailyData;
      const groups = {};
      dailyData.forEach(bar => {
        let key = '';
        const d = new Date(bar.time);
        if (type === 'W') {
          const day = d.getDay() || 7;
          d.setDate(d.getDate() - day + 1);
          key = d.toISOString().split('T')[0];
        } else if (type === 'M') {
          key = `${bar.time.slice(0, 7)}-01`;
        }
        if (!groups[key]) {
          groups[key] = { time: key, open: bar.open, high: bar.high, low: bar.low, close: bar.close };
        } else {
          groups[key].high = Math.max(groups[key].high, bar.high);
          groups[key].low = Math.min(groups[key].low, bar.low);
          groups[key].close = bar.close;
        }
      });
      return Object.values(groups).sort((a, b) => a.time.localeCompare(b.time));
    }

      const entry = currentStructure.suggestedEntry;
      const stop = currentStructure.suggestedStop;
      const t1 = currentStructure.t1;

    function removeBatch(batchId) {
      const isCrypto = (currentMarket === 'CRYPTO');
      const profiles = isCrypto ? cryptoProfiles : twProfiles;

      profile.batches = profile.batches.filter(b => b.id !== batchId);

    function updateBatchRow(batchId, field, val) {
      const isCrypto = (currentMarket === 'CRYPTO');
      const profiles = isCrypto ? cryptoProfiles : twProfiles;
      const profile = profiles[currentCode];
      if (!profile || !profile.batches) return;
      const target = profile.batches.find(b => b.id === batchId);
      if (!target) return;
      target[field] = (field === 'side') ? val : (parseFloat(val) || 0);
      saveProfiles();
      recalcPortfolioAggregates();
    }

    function recalcPortfolioAggregates() {
      const isCrypto = (currentMarket === 'CRYPTO');
      const profiles = isCrypto ? cryptoProfiles : twProfiles;
      const profile = profiles[currentCode];
      const batches = profile.batches || [];
      const curPrice = currentStructure.currentPrice;

      let totalShares = 0;
      let totalCostSum = 0;
      let totalNetPnl = 0;

      batches.forEach(b => {
        const c = parseFloat(b.cost) || 0;
        const s = parseFloat(b.shares) || 0;
        const isShort = (b.side === 'SHORT');
        totalShares += s;
        totalCostSum += (c * s);

        const rowPnl = isShort ? ((c - curPrice) * s) : ((curPrice - c) * s);
        totalNetPnl += rowPnl;

        const pnlLabel = document.getElementById(`batch-pnl-${b.id}`);
        if (pnlLabel) {
          pnlLabel.innerText = `${rowPnl >= 0 ? '+' : ''}${isCrypto ? rowPnl.toFixed(2) + ' U' : Math.round(rowPnl).toLocaleString()}`;
          pnlLabel.className = `font-mono text-xs font-black block ${rowPnl >= 0 ? 'text-apple-green' : 'text-apple-red'}`;
        }
      });

      const avgCost = totalShares > 0 ? (totalCostSum / totalShares) : 0;
      const totalPnlPct = (totalCostSum > 0) ? ((totalNetPnl / totalCostSum) * 100).toFixed(2) : 0;

      const statCost = document.getElementById('stat-avg-cost');
      const statShares = document.getElementById('stat-total-shares');
      const pnlLabel = document.getElementById('port-pnl-label');
      const statusPill = document.getElementById('port-status-pill');

      if (statCost) statCost.innerText = `$${formatPrice(avgCost)}`;
      if (statShares) statShares.innerText = `${isCrypto ? totalShares : totalShares.toLocaleString() + ' 股'}`;

      if (pnlLabel) {
        pnlLabel.innerText = `${totalNetPnl >= 0 ? '+' : ''}${isCrypto ? totalNetPnl.toFixed(2) + ' USDT' : Math.round(totalNetPnl).toLocaleString() + ' 元'} (${totalPnlPct}%)`;
        pnlLabel.className = `font-mono font-black text-xs sm:text-sm ${totalNetPnl >= 0 ? 'text-apple-green' : 'text-apple-red'}`;
      }
      if (statusPill) {
        statusPill.innerText = totalNetPnl >= 0 ? '獲利持倉中' : '帳面回檔中';
        statusPill.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${totalNetPnl >= 0 ? 'bg-emerald-950/80 text-apple-green border border-apple-green/40' : 'bg-rose-950/80 text-apple-red border border-apple-red/40'}`;
      }

      if (avgCost > 0) {
        if (!avgCostLine) avgCostLine = addLine(avgCost, '#0a84ff', '【加權均價】', 1, 2);
        else avgCostLine.applyOptions({ price: avgCost });
      } else if (avgCostLine) {
        candleSeries.removePriceLine(avgCostLine);
        avgCostLine = null;
      }
    }

    // =========================================================================
    // 6. 全自動雙向掃描器 (精準隔離、即時進度反饋)
    // =========================================================================
    async function runFullAutoScanner() {
      if (isScanning) return;
      isScanning = true;
      const btn = document.getElementById('btn-run-scan');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="inline-block animate-spin">⏳</span> <span>掃描中 (0%)...</span>`;
        btn.className = 'text-[11px] font-bold text-apple-amber py-0.5 px-2 rounded-lg bg-black/60 border border-apple-amber/40 transition flex items-center gap-1';
      }

      const isCrypto = (currentMarket === 'CRYPTO');
      const allCodesMap = isCrypto ? { ...UNIVERSE_CRYPTO } : { ...UNIVERSE_TW };
      const profiles = isCrypto ? cryptoProfiles : twProfiles;

      Object.keys(profiles).forEach(c => {
        allCodesMap[c] = profiles[c].name;
      });

      const allCodes = Object.keys(allCodesMap);
      const CHUNK_SIZE = isCrypto ? 4 : 5;
      const DELAY_MS = 180;
      const opportunities = [];

      for (let i = 0; i < allCodes.length; i += CHUNK_SIZE) {
        const chunk = allCodes.slice(i, i + CHUNK_SIZE);
        const progressPct = Math.round((i / allCodes.length) * 100);
        if (btn) btn.innerHTML = `<span class="inline-block animate-spin">⏳</span> <span>掃描中 (${progressPct}%)...</span>`;

        const chunkPromises = chunk.map(async code => {
          try {
            const klines = await loadAssetKlines(code, false);
            return { code, klines };
          } catch {
            return { code, klines: [] };
          }
        });

        const chunkResults = await Promise.allSettled(chunkPromises);

        chunkResults.forEach(res => {
          const item = res.value;
          if (!item || !item.klines || item.klines.length < 20) return;

          const code = item.code;
          const klines = item.klines;
          const len = klines.length;
          const curClose = klines[len - 1].close;

          // 執行雙向結構分析
          analyzeBidirectionalStructure(klines, code);
          const plan = { ...currentStructure };
          const isHolding = profiles[code] && (profiles[code].batches || []).length > 0;

          if (!isHolding && plan.rr < 1.6) return;

          opportunities.push({
            code,
            name: allCodesMap[code] || code,
            direction: plan.direction,
            currentPrice: curClose,
            entry: plan.suggestedEntry,
            stop: plan.suggestedStop,
            t1: plan.t1,
            t2: plan.t2,
            rr: plan.rrRatio,
            tag: plan.strategyType,
            score: (plan.direction === 'LONG' ? 10 : 8) + plan.rrRatio,
            isHolding
          });
        });

        await new Promise(r => setTimeout(r, DELAY_MS));
      }

      opportunities.sort((a, b) => b.score - a.score);

      if (isCrypto) cryptoScannedOpportunities = opportunities;
      else twScannedOpportunities = opportunities;

      isScanning = false;

      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `<span>✅</span> <span>已更新 (${opportunities.length}檔)</span>`;
        btn.className = 'text-[11px] font-bold text-apple-green py-0.5 px-2 rounded-lg bg-black/40 border border-apple-green/40 transition flex items-center gap-1';
        setTimeout(() => {
          btn.innerHTML = `<span>🔄</span> <span>重新掃描</span>`;
          btn.className = 'text-[11px] font-bold text-apple-blue hover:underline py-0.5 px-2 rounded-lg bg-black/40 border border-white/10 transition';
        }, 2500);
      }

      // 重新載入當前標的狀態
      loadAsset(currentCode);
    }

    // =========================================================================
    // 7. 深度篩選終端 (明確狀態反饋與時間戳記)
    // =========================================================================
    async function fetchScreenerData() {
      const btn = document.getElementById('btn-fetch-value');
      const btnImportAll = document.getElementById('btn-import-all-value');
      const tbody = document.getElementById('screener-table-body');
      const thead = document.getElementById('screener-table-head');
      const title = document.getElementById('screener-header-title');
      const desc = document.getElementById('screener-header-desc');
      const statusBar = document.getElementById('screener-status-bar');

      btn.disabled = true;
      btn.innerHTML = `<span class="inline-block animate-spin">⏳</span> <span>正在運算...</span>`;
      btnImportAll.classList.add('hidden');
      statusBar.innerHTML = `<span>狀態：正在連線更新數據...</span><span class="animate-pulse">讀取中</span>`;

      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="py-14 text-center text-apple-blue text-xs font-bold animate-pulse">
            ⚡ 正在高速運算即時數據並執行決策過濾...
          </td>
        </tr>
      `;

      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];

      if (currentMarket === 'TW') {
        title.innerHTML = `<span>📊</span> <span>低價低估值決策終端 (台股)</span>`;
        desc.innerHTML = `極致篩選準則：最新收盤價 ≦ <b class="text-white">$50.00</b> 且 股價淨值比 (PBR) ≦ <b class="text-white">0.85 倍</b> · 逆向價值防護`;
        thead.innerHTML = `
          <tr class="border-b border-white/10 text-apple-gray text-xs">
            <th class="py-2 px-3">代號</th>
            <th class="py-2 px-3">名稱</th>
            <th class="py-2 px-3">收盤價</th>
            <th class="py-2 px-3">每股淨值</th>
            <th class="py-2 px-3">即時PBR</th>
            <th class="py-2 px-3 text-center">判定</th>
            <th class="py-2 px-3 text-center">動作</th>
          </tr>
        `;

        try {
          const fetchPromises = TW_VALUE_CORE_POOL.map(async item => {
            try {
              const klines = await loadAssetKlines(item.code, false);
              return { ...item, close: klines[klines.length - 1].close };
            } catch {
              return { ...item, close: 0 };
            }
          });
          const results = await Promise.all(fetchPromises);
          const qualified = results.filter(s => s.close > 0 && (s.close <= 50.0) && ((s.close / s.nav) <= 0.85));
          currentQualifiedScreenerItems = qualified;

          statusBar.innerHTML = `<span class="text-apple-green font-bold">狀態：分析完成 (共掃描 ${results.length} 檔，符合 ${qualified.length} 檔)</span><span class="text-white font-mono">${timeStr}</span>`;

          if (qualified.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="py-14 text-center text-apple-amber text-xs font-bold">⚠️ 今日暫無標的滿足極致門檻</td></tr>`;
          } else {
            btnImportAll.classList.remove('hidden');
            tbody.innerHTML = qualified.map(s => {
              const pbr = (s.close / s.nav).toFixed(2);
              return `
                <tr class="hover:bg-white/5 transition border-b border-white/5 font-mono">
                  <td class="py-2.5 px-3 text-white font-bold">${s.code}</td>
                  <td class="py-2.5 px-3 text-apple-blue font-bold">${s.name}</td>
                  <td class="py-2.5 px-3 text-apple-red font-bold">$${s.close.toFixed(2)}</td>
                  <td class="py-2.5 px-3 text-apple-gray">$${s.nav.toFixed(2)}</td>
                  <td class="py-2.5 px-3"><span class="bg-apple-green/20 text-apple-green border border-apple-green/40 px-2.5 py-0.5 rounded-full text-xs font-bold">${pbr} 倍</span></td>
                  <td class="py-2.5 px-3 text-center"><span class="text-xs text-apple-green font-bold">🔥 符合</span></td>
                  <td class="py-2.5 px-3 text-center">
                    <button onclick="bringSingleScreenerToChart('${s.code}', '${s.name}')" class="bg-apple-blue text-white text-xs font-bold px-2.5 py-1 rounded-lg">帶入看圖</button>
                  </td>
                </tr>
              `;
            }).join('');
          }
        } catch (e) {
          statusBar.innerHTML = `<span class="text-apple-red font-bold">狀態：連線受阻，請稍候重試</span><span class="text-white font-mono">${timeStr}</span>`;
          tbody.innerHTML = `<tr><td colspan="7" class="py-14 text-center text-apple-red text-xs font-bold">連線異常，請稍候重試</td></tr>`;
        }
      } else {
        title.innerHTML = `<span>🔥</span> <span>主流幣波段波動與乖離篩選器</span>`;
        desc.innerHTML = `依據 1H 週期真實 ATR 波動比率與 20MA 偏離度，快速定位高彈性翻箱機會`;
        thead.innerHTML = `
          <tr class="border-b border-white/10 text-apple-gray text-xs">
            <th class="py-2 px-3">交易對</th>
            <th class="py-2 px-3">名稱</th>
            <th class="py-2 px-3">現價 (USDT)</th>
            <th class="py-2 px-3">ATR 波動率</th>
            <th class="py-2 px-3">20MA 乖離</th>
            <th class="py-2 px-3 text-center">狀態</th>
            <th class="py-2 px-3 text-center">動作</th>
          </tr>
        `;

        try {
          const symbols = Object.keys(CRYPTO_DICTIONARY);
          const rows = [];
          for (let sym of symbols) {
            try {
              const klines = await fetchBinanceKlines(sym, '1h', 40);
              if (klines.length >= 20) {
                const curClose = klines[klines.length - 1].close;
                const ma20 = klines.slice(-20).reduce((s, k) => s + k.close, 0) / 20;
                const bias = ((curClose - ma20) / ma20) * 100;
                let tr = 0;
                for (let i = klines.length - 14; i < klines.length; i++) {
                  tr += Math.max(klines[i].high - klines[i].low, Math.abs(klines[i].high - klines[i - 1].close));
                }
                const atrPct = ((tr / 14) / curClose) * 100;
                rows.push({ code: sym, name: CRYPTO_DICTIONARY[sym], close: curClose, atrPct, bias });
              }
            } catch (e) {}
          }
          rows.sort((a, b) => b.atrPct - a.atrPct);
          currentQualifiedScreenerItems = rows;
          btnImportAll.classList.remove('hidden');

          statusBar.innerHTML = `<span class="text-apple-green font-bold">狀態：分析完成 (共掃描 ${symbols.length} 檔主流資產)</span><span class="text-white font-mono">${timeStr}</span>`;

          tbody.innerHTML = rows.map(r => `
            <tr class="hover:bg-white/5 transition border-b border-white/5 font-mono">
              <td class="py-2.5 px-3 text-white font-bold">${r.code}</td>
              <td class="py-2.5 px-3 text-apple-blue font-bold">${r.name}</td>
              <td class="py-2.5 px-3 text-white font-bold">$${formatPrice(r.close)}</td>
              <td class="py-2.5 px-3 text-apple-green font-bold">${r.atrPct.toFixed(2)}%</td>
              <td class="py-2.5 px-3 font-bold ${r.bias >= 0 ? 'text-apple-green' : 'text-apple-red'}">${r.bias >= 0 ? '+' : ''}${r.bias.toFixed(2)}%</td>
              <td class="py-2.5 px-3 text-center">
                <span class="text-[10px] px-2 py-0.5 rounded-full ${Math.abs(r.bias) > 6 ? 'bg-apple-red/20 text-apple-red' : 'bg-white/10 text-slate-300'}">
                  ${Math.abs(r.bias) > 6 ? '乖離擴大' : '均線密合'}
                </span>
              </td>
              <td class="py-2.5 px-3 text-center">
                <button onclick="bringSingleScreenerToChart('${r.code}', '${r.name}')" class="bg-apple-blue text-white text-xs font-bold px-2.5 py-1 rounded-lg">帶入看圖</button>
              </td>
            </tr>
          `).join('');
        } catch (e) {
          statusBar.innerHTML = `<span class="text-apple-red font-bold">狀態：連線受阻，請稍候重試</span><span class="text-white font-mono">${timeStr}</span>`;
          tbody.innerHTML = `<tr><td colspan="7" class="py-14 text-center text-apple-red text-xs font-bold">連線異常，請稍候重試</td></tr>`;
        }
      }

      btn.disabled = false;
      btn.innerHTML = `<span>✅ 已更新 (${timeStr})</span>`;
      btn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black px-3.5 py-2 rounded-xl transition shadow flex items-center gap-1.5';
    }

    function bringSingleScreenerToChart(code, name) {
      if (currentMarket === 'CRYPTO') {
        UNIVERSE_CRYPTO[code] = name;
        if (!cryptoProfiles[code]) cryptoProfiles[code] = { name, batches: [] };
      } else {
        UNIVERSE_TW[code] = name;
        if (!twProfiles[code]) twProfiles[code] = { name, batches: [] };
      }
      saveProfiles();
      renderAssetSelect();
      switchAsset(code);
      setDashboardMode('HUNTER');
    }

    function bringAllScreenerToRadar() {
      if (currentQualifiedScreenerItems.length === 0) return;
      currentQualifiedScreenerItems.forEach(item => {
        if (currentMarket === 'CRYPTO') {
          UNIVERSE_CRYPTO[item.code] = item.name;
          if (!cryptoProfiles[item.code]) cryptoProfiles[item.code] = { name: item.name, batches: [] };
        } else {
          UNIVERSE_TW[item.code] = item.name;
          if (!twProfiles[item.code]) twProfiles[item.code] = { name: item.name, batches: [] };
        }
      });
      saveProfiles();
      renderAssetSelect();
      setDashboardMode('HUNTER');
      runFullAutoScanner();
    }

    // =========================================================================
    // 8. 導航與市場切換
    // =========================================================================
    function switchMarket(market) {
      currentMarket = market;
      const btnCrypto = document.getElementById('btn-market-crypto');
      const btnTW = document.getElementById('btn-market-tw');
      const tokenBtn = document.getElementById('btn-token-modal');

      if (market === 'CRYPTO') {
        btnCrypto.className = 'px-3 py-1 rounded-lg bg-apple-blue text-white transition shadow-sm whitespace-nowrap';
        btnTW.className = 'px-3 py-1 rounded-lg text-apple-gray hover:text-white transition whitespace-nowrap';
        tokenBtn.classList.add('hidden');
        currentCode = 'BTCUSDT';
        currentTimeframe = '1h';
        document.getElementById('label-tab-hunter').innerText = '主流雷達';
        document.getElementById('label-tab-value').innerText = '波動篩選';
      } else {
        btnTW.className = 'px-3 py-1 rounded-lg bg-apple-blue text-white transition shadow-sm whitespace-nowrap';
        btnCrypto.className = 'px-3 py-1 rounded-lg text-apple-gray hover:text-white transition whitespace-nowrap';
        tokenBtn.classList.remove('hidden');
        currentCode = '2330';
        currentTimeframe = 'D';
        document.getElementById('label-tab-hunter').innerText = '50檔雷達';
        document.getElementById('label-tab-value').innerText = '低估值選股';
      }

      renderTimeframeButtons();
      renderAssetSelect();
      switchAsset(currentCode);

      if (currentDashboardMode === 'VALUE') fetchScreenerData();
    }

    function renderTimeframeButtons() {
      const container = document.getElementById('timeframe-container');
      const tfs = (currentMarket === 'CRYPTO')
        ? [{ id: '15m', label: '15m' }, { id: '1h', label: '1h' }, { id: '4h', label: '4h' }, { id: '1d', label: '1d' }]
        : [{ id: 'D', label: '日' }, { id: 'W', label: '週' }, { id: 'M', label: '月' }];

      container.innerHTML = tfs.map(t => `
        <button onclick="setTimeframe('${t.id}')" id="tf-${t.id}" class="px-2.5 py-0.5 rounded-lg transition ${t.id === currentTimeframe ? 'bg-white/20 text-white font-black' : 'text-apple-gray hover:text-white'}">
          ${t.label}
        </button>
      `).join('');
    }

    function setTimeframe(tf) {
      currentTimeframe = tf;
      renderTimeframeButtons();
      loadAsset(currentCode);
    }

    function setDashboardMode(mode) {
      currentDashboardMode = mode;
      const btnHunter = document.getElementById('tab-HUNTER');
      const btnPort = document.getElementById('tab-PORTFOLIO');
      const btnVal = document.getElementById('tab-VALUE');
      const chartView = document.getElementById('view-macro-chart');
      const valView = document.getElementById('view-value-screener');
      const chartControls = document.getElementById('chart-controls-cluster');

      [btnHunter, btnPort, btnVal].forEach(btn => {
        btn.className = 'px-2.5 sm:px-3 py-1 rounded-lg text-apple-gray hover:text-white transition font-bold whitespace-nowrap';
      });

      if (mode === 'HUNTER') {
        btnHunter.className = 'px-2.5 sm:px-3 py-1 rounded-lg bg-white/15 text-white transition font-bold shadow-sm whitespace-nowrap';
        chartView.classList.remove('hidden');
        valView.classList.add('hidden');
        valView.classList.remove('flex');
        chartControls.classList.remove('hidden');
        renderModeUI();
      } else if (mode === 'PORTFOLIO') {
        btnPort.className = 'px-2.5 sm:px-3 py-1 rounded-lg bg-white/15 text-white transition font-bold shadow-sm whitespace-nowrap';
        chartView.classList.remove('hidden');
        valView.classList.add('hidden');
        valView.classList.remove('flex');
        chartControls.classList.remove('hidden');
        renderModeUI();
      } else if (mode === 'VALUE') {
        btnVal.className = 'px-2.5 sm:px-3 py-1 rounded-lg bg-white/10 text-white transition font-bold shadow-sm whitespace-nowrap';
        chartView.classList.add('hidden');
        valView.classList.remove('hidden');
        valView.classList.add('flex');
        chartControls.classList.add('hidden');
        fetchScreenerData();
      }

      setTimeout(() => {
        const box = document.getElementById('chart-box');
        if (chart && box && !isChartHidden && mode !== 'VALUE') {
          chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
        }
      }, 50);
    }

    function renderAssetSelect() {
      const select = document.getElementById('asset-select');
      select.innerHTML = '';
      const isCrypto = (currentMarket === 'CRYPTO');
      const universe = isCrypto ? UNIVERSE_CRYPTO : UNIVERSE_TW;
      const profiles = isCrypto ? cryptoProfiles : twProfiles;

      Object.keys(profiles).forEach(code => {
        if ((profiles[code].batches || []).length > 0) {
          const opt = document.createElement('option');
          opt.value = code;
          opt.innerText = `💼 ${code} ${profiles[code].name}`;
          if (code === currentCode) opt.selected = true;
          select.appendChild(opt);
        }
      });

      Object.keys(universe).forEach(code => {
        if (!profiles[code] || (profiles[code].batches || []).length === 0) {
          const opt = document.createElement('option');
          opt.value = code;
          opt.innerText = `${code} ${universe[code]}`;
          if (code === currentCode) opt.selected = true;
          select.appendChild(opt);
        }
      });
    }

    function switchAsset(code) {
      loadAsset(code);
    }

    function saveProfiles() {
      localStorage.setItem(STORAGE_TW_KEY, JSON.stringify(twProfiles));
      localStorage.setItem(STORAGE_CRYPTO_KEY, JSON.stringify(cryptoProfiles));
    }

    function openCustomModal() {
      document.getElementById('custom-code').value = '';
      document.getElementById('custom-name').value = '';
      const isCrypto = (currentMarket === 'CRYPTO');
      document.getElementById('modal-custom-title').innerText = isCrypto ? '加入虛擬幣觀察標的' : '加入台股自選清單';
      document.getElementById('modal-custom-subtitle').innerText = isCrypto ? '輸入代幣代號 (例: SOL, DOGE)' : '輸入 4 碼代號，系統秒配';
      document.getElementById('modal-label-code').innerText = isCrypto ? '加密貨幣代號' : '台股代號';
      document.getElementById('modal-custom').classList.remove('hidden');
    }

    function closeCustomModal() {
      document.getElementById('modal-custom').classList.add('hidden');
    }

    function handleCustomCodeInput(val) {
      val = val.trim();
      const nameInput = document.getElementById('custom-name');
      if (currentMarket === 'TW') {
        if (TW_STOCK_DICTIONARY[val]) {
          nameInput.value = TW_STOCK_DICTIONARY[val];
          return;
        }
        for (const [c, n] of Object.entries(TW_STOCK_DICTIONARY)) {
          if (n === val) {
            document.getElementById('custom-code').value = c;
            nameInput.value = n;
            return;
          }
        }
      } else {
        let sym = val.toUpperCase();
        if (!sym.endsWith('USDT')) sym += 'USDT';
        if (CRYPTO_DICTIONARY[sym]) nameInput.value = CRYPTO_DICTIONARY[sym];
      }
    }

    function confirmCustomAsset() {
      let code = document.getElementById('custom-code').value.trim().toUpperCase();
      let name = document.getElementById('custom-name').value.trim();
      if (!code) return alert('請至少輸入標的代號');

      if (currentMarket === 'CRYPTO') {
        if (!code.endsWith('USDT')) code += 'USDT';
        if (!name) name = CRYPTO_DICTIONARY[code] || code;
        UNIVERSE_CRYPTO[code] = name;
        cryptoProfiles[code] = { name, batches: [] };
      } else {
        if (!name) name = TW_STOCK_DICTIONARY[code] || code;
        UNIVERSE_TW[code] = name;
        twProfiles[code] = { name, batches: [] };
      }

      saveProfiles();
      renderAssetSelect();
      closeCustomModal();
      switchAsset(code);
      runFullAutoScanner();
    }

    function openTokenModal() {
      document.getElementById('input-api-token').value = localStorage.getItem('finmind_api_token') || '';
      document.getElementById('modal-token').classList.remove('hidden');
    }
    function closeTokenModal() {
      document.getElementById('modal-token').classList.add('hidden');
    }
    function saveApiToken() {
      const token = document.getElementById('input-api-token').value.trim();
      if (token) localStorage.setItem('finmind_api_token', token);
      else localStorage.removeItem('finmind_api_token');
      closeTokenModal();
      switchAsset(currentCode, true);
    }
    function clearApiToken() {
      localStorage.removeItem('finmind_api_token');
      document.getElementById('input-api-token').value = '';
      closeTokenModal();
      switchAsset(currentCode, true);
    }

    // =========================================================================
    // 9. 啟動入口
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      initChart();
      renderTimeframeButtons();
      renderAssetSelect();
      loadAsset('BTCUSDT');
    });
  </script>
</body>
</html>
