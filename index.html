<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>量化波段與亞當對稱翻箱雙核心決策終端 (Crypto & TW Stocks)</title>
  
  <!-- Tailwind CSS & Lightweight Charts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            apple: {
              bg: '#08090d',
              surface: '#12141c',
              elevated: '#181b26',
              border: 'rgba(255, 255, 255, 0.08)',
              blue: '#0a84ff',
              green: '#30d158',
              red: '#ff453a',
              amber: '#ffd60a',
              purple: '#bf5af2',
              gray: '#8e8e93'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #151824 0%, #08090d 70%);
      color: #f5f5f7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .glass-panel {
      background: rgba(18, 20, 28, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(24, 27, 38, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #2c3142; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    @media screen and (max-width: 768px) {
      input, select { font-size: 16px !important; }
    }
  </style>
</head>
<body class="min-h-screen md:h-screen w-screen overflow-x-hidden md:overflow-hidden p-2 sm:p-3.5 flex flex-col justify-between gap-2.5">

  <!-- 頂部 Apple 風格主控制列 -->
  <header class="glass-panel w-full rounded-2xl px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-2.5 shrink-0 shadow-2xl z-20">
    <div class="flex items-center gap-2.5 sm:gap-3">
      <!-- 品牌標誌 -->
      <div class="flex items-center gap-2 pr-2 border-r border-white/10">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-apple-blue to-apple-purple flex items-center justify-center shadow-lg shadow-apple-blue/20">
          <span class="text-white text-base font-black">⚡</span>
        </div>
        <div class="hidden sm:flex flex-col">
          <span class="text-xs font-black tracking-widest text-white leading-tight">ADAM QUANT</span>
          <span class="text-[10px] text-apple-gray font-mono">DUAL TERMINAL</span>
        </div>
      </div>

      <!-- 市場雙核心切換 (預設加密貨幣優先，直接看比特幣) -->
      <div class="flex bg-black/40 p-1 rounded-xl border border-white/10 text-xs font-bold shadow-inner">
        <button id="btn-market-crypto" onclick="switchMarket('CRYPTO')" class="px-3.5 py-1.5 rounded-lg bg-apple-blue text-white transition flex items-center gap-1.5 shadow-md active:scale-95">
          <span>🪙</span> <span>加密貨幣</span>
        </button>
        <button id="btn-market-tw" onclick="switchMarket('TW')" class="px-3.5 py-1.5 rounded-lg text-apple-gray hover:text-white transition flex items-center gap-1.5 active:scale-95">
          <span>🇹🇼</span> <span>台灣股市</span>
        </button>
      </div>

      <!-- 三大核心模態分頁 -->
      <div class="flex bg-black/40 p-1 rounded-xl border border-white/10 text-xs font-bold gap-0.5">
        <button onclick="setDashboardMode('HUNTER')" id="tab-HUNTER" class="px-3 py-1.5 rounded-lg bg-white/10 text-white transition flex items-center gap-1 font-bold shadow-sm">
          <span>🎯</span> <span id="label-tab-hunter">精選雷達</span>
        </button>
        <button onclick="setDashboardMode('PORTFOLIO')" id="tab-PORTFOLIO" class="px-3 py-1.5 rounded-lg text-apple-gray hover:text-white transition flex items-center gap-1 font-bold">
          <span>💼</span> <span>持倉簿記</span>
        </button>
        <button onclick="setDashboardMode('VALUE')" id="tab-VALUE" class="px-3 py-1.5 rounded-lg text-apple-gray hover:text-white transition flex items-center gap-1 font-bold">
          <span>📊</span> <span id="label-tab-value">深度篩選</span>
        </button>
      </div>
    </div>

    <!-- 標的選擇與時框集簇 (RWD 自動橫向適配) -->
    <div id="chart-controls-cluster" class="flex items-center gap-2 overflow-x-auto no-scrollbar max-w-full">
      <select id="asset-select" onchange="switchAsset(this.value)" class="bg-black/60 border border-white/15 text-white font-mono text-xs sm:text-sm rounded-xl px-2.5 py-1.5 font-bold focus:outline-none focus:border-apple-blue shadow-inner cursor-pointer max-w-[150px] sm:max-w-none">
      </select>

      <!-- 動態時框切換 (Crypto: 15m/1h/4h/1d；TW: D/W/M) -->
      <div id="timeframe-container" class="flex bg-black/40 p-1 rounded-xl border border-white/10 text-xs font-mono font-bold">
      </div>

      <!-- 台股 FinMind 金鑰設定 (台股模式專用) -->
      <button id="btn-token-modal" onclick="openTokenModal()" title="設定個人 API Token" class="bg-black/40 hover:bg-white/10 border border-white/10 text-apple-gray hover:text-white text-xs font-bold px-2.5 py-1.5 rounded-xl transition flex items-center gap-1">
        <span>🔑</span> <span class="hidden sm:inline">金鑰</span>
      </button>

      <!-- ＋ 自選標的 -->
      <button onclick="openCustomModal()" class="bg-apple-blue hover:opacity-90 active:scale-95 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl transition shadow-md flex items-center gap-1">
        <span>＋</span> <span>自選</span>
      </button>
    </div>
  </header>

  <!-- 主工作區 1：圖表與動態決策視圖 (Chart + Operation Panel) -->
  <main id="view-macro-chart" class="w-full flex-1 grid grid-cols-1 md:grid-cols-12 gap-2.5 min-h-0">
    
    <!-- 左側 / 上方：TradingView 專業 K 線圖表 -->
    <section class="md:col-span-7 lg:col-span-8 glass-panel rounded-3xl p-3 sm:p-4 flex flex-col justify-between min-h-[400px] md:min-h-0 shadow-2xl relative">
      <div class="flex flex-wrap justify-between items-center text-xs pb-2.5 border-b border-white/10 gap-2 shrink-0">
        <div class="flex items-center gap-2 sm:gap-2.5">
          <span id="chart-info" class="font-black text-white text-sm sm:text-base tracking-wide font-mono">連線中...</span>
          
          <!-- 三重視角切換 -->
          <div class="flex bg-black/40 p-0.5 rounded-xl border border-white/10 text-[11px] font-bold">
            <button id="view-mode-FOCUS" onclick="setViewMode('FOCUS')" class="px-2.5 py-1 rounded-lg bg-apple-blue text-white font-bold transition shadow-sm">
              🔍 聚焦K棒
            </button>
            <button id="view-mode-T1" onclick="setViewMode('T1')" class="px-2.5 py-1 rounded-lg text-apple-gray hover:text-white font-bold transition">
              🎯 T1視角
            </button>
            <button id="view-mode-MACRO" onclick="setViewMode('MACRO')" class="px-2.5 py-1 rounded-lg text-apple-gray hover:text-white font-bold transition">
              🔭 T2全景
            </button>
          </div>

          <!-- 隱藏/顯示按鈕 -->
          <button id="btn-chart-toggle" onclick="toggleChartDisplay()" class="bg-black/40 hover:bg-white/10 text-apple-gray hover:text-white px-2.5 py-1 rounded-lg text-xs font-semibold border border-white/10 transition">
            👁️ <span id="btn-chart-toggle-text">隱藏</span>
          </button>

          <!-- 透明度滑桿 (10% ~ 100%) -->
          <div class="hidden sm:flex items-center gap-1.5 bg-black/40 px-2.5 py-1 rounded-lg border border-white/10 text-xs">
            <span class="text-apple-gray font-semibold">透明度</span>
            <input type="range" min="10" max="100" value="100" oninput="changeChartOpacity(this.value)" class="w-16 h-1.5 accent-apple-blue cursor-pointer" />
            <span id="chart-opacity-val" class="text-white font-mono w-7 text-right">100%</span>
          </div>
        </div>

        <!-- 圖表動態圖例 -->
        <div id="dynamic-legend" class="flex flex-wrap gap-2.5 text-xs font-bold font-mono"></div>
      </div>

      <!-- K 線畫布容器 -->
      <div class="relative w-full flex-1 min-h-[300px] md:min-h-0 mt-2 rounded-2xl overflow-hidden bg-black/20">
        <div id="chart-box" class="w-full h-full min-h-[300px] md:min-h-0 transition-opacity duration-150"></div>
        <div id="floating-targets" class="absolute top-2 right-12 flex flex-col gap-1.5 z-10 pointer-events-auto"></div>
      </div>
      
      <!-- 圖表隱藏佔位符 -->
      <div id="chart-hidden-placeholder" class="hidden w-full flex-1 flex flex-col items-center justify-center text-apple-gray gap-2 border border-dashed border-white/10 py-12 rounded-2xl">
        <span class="text-4xl">👁️‍🗨️</span>
        <span class="text-sm sm:text-base font-bold text-white">線圖已隱藏 · 專注幾何結構與風控決策</span>
      </div>
    </section>

    <!-- 右側 / 下方：雙模動態操作面板 (雷達掃描 / 持倉簿記) -->
    <section class="md:col-span-5 lg:col-span-4 glass-panel rounded-3xl p-3.5 sm:p-4 flex flex-col justify-between gap-3 overflow-y-auto no-scrollbar shadow-2xl">
      <div id="panel-content-container" class="space-y-3"></div>
      <div id="hud-bottom-card" class="glass-card p-3.5 rounded-2xl border border-white/10 text-xs sm:text-sm space-y-1.5 mt-auto shadow-inner font-mono"></div>
    </section>
  </main>

  <!-- 主工作區 2：【📊 深度篩選終端】(台股低估值 PBR vs 虛擬幣高波動 ATR) -->
  <main id="view-value-screener" class="w-full flex-1 hidden glass-panel rounded-3xl p-4 sm:p-6 flex-col justify-between overflow-y-auto shadow-2xl">
    <div class="space-y-4">
      <div class="flex flex-wrap justify-between items-center pb-3 border-b border-white/10 gap-3">
        <div>
          <h2 id="screener-header-title" class="text-xl sm:text-2xl font-black text-apple-blue tracking-wide flex items-center gap-2">
            <span>📊</span> <span>深度決策終端</span>
          </h2>
          <p id="screener-header-desc" class="text-xs sm:text-sm text-apple-gray font-semibold mt-1">
            極致量化篩選準則
          </p>
        </div>
        <div class="flex items-center gap-2.5">
          <button id="btn-import-all-value" onclick="bringAllScreenerToRadar()" class="hidden bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs sm:text-sm font-black px-3.5 py-2 rounded-xl transition shadow-lg flex items-center gap-1.5">
            <span>📥</span> <span>一鍵全部帶入雷達觀察</span>
          </button>
          <button id="btn-fetch-value" onclick="fetchScreenerData()" class="bg-apple-blue hover:opacity-90 active:scale-95 text-white text-xs sm:text-sm font-black px-4 py-2 rounded-xl transition shadow-lg flex items-center gap-2">
            <span>🔄</span> <span>點此獲取最新數據</span>
          </button>
        </div>
      </div>

      <!-- 數據表格區 -->
      <div class="overflow-x-auto rounded-2xl border border-white/10 bg-black/20 shadow-inner">
        <table class="w-full text-left border-collapse min-w-[700px] font-mono">
          <thead id="screener-table-head" class="border-b border-white/10 bg-white/[0.02] text-apple-gray text-xs sm:text-sm font-bold">
          </thead>
          <tbody id="screener-table-body" class="divide-y divide-white/5 text-sm font-medium">
            <tr>
              <td colspan="7" class="py-16 text-center text-apple-gray text-sm font-semibold">
                <span class="text-2xl block mb-2">💡</span>
                請點選右上角按鈕獲取最新數據...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer class="pt-3 border-t border-white/10 text-right">
      <p id="screener-footer-tip" class="text-xs text-apple-gray">
        * 數據支援雙軌自適應線路即時獲取。
      </p>
    </footer>
  </main>

  <!-- 自訂標的彈窗 (台股代號秒配對 / 虛擬幣代幣自動對齊) -->
  <div id="modal-custom" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="glass-panel border border-white/15 w-full max-w-sm p-6 rounded-3xl space-y-4 shadow-2xl">
      <div>
        <h3 class="text-lg font-black text-white flex items-center gap-2">
          <span>＋</span> <span id="modal-custom-title">加入觀察清單</span>
        </h3>
        <p class="text-xs text-apple-gray mt-1" id="modal-custom-subtitle">輸入代號，系統自動配對名稱</p>
      </div>

      <div class="space-y-3.5 text-sm">
        <div>
          <label class="block text-apple-gray mb-1 font-bold text-xs" id="modal-label-code">標的代號</label>
          <input id="custom-code" type="text" placeholder="例: SOL 或 2454" oninput="handleCustomCodeInput(this.value)" class="w-full bg-black/50 border border-white/15 rounded-xl p-3 text-white uppercase outline-none focus:border-apple-blue font-mono font-bold text-base shadow-inner" />
        </div>
        <div>
          <label class="block text-apple-gray mb-1 font-semibold text-xs flex justify-between">
            <span>標的名稱</span>
            <span class="text-apple-blue font-normal">可留空，系統自動配對</span>
          </label>
          <input id="custom-name" type="text" placeholder="自動配對中..." class="w-full bg-black/40 border border-white/15 rounded-xl p-3 text-slate-200 outline-none focus:border-apple-blue font-bold text-base" />
        </div>
      </div>
      <div class="flex gap-2.5 pt-1">
        <button onclick="closeCustomModal()" class="flex-1 py-2.5 text-sm text-apple-gray hover:text-white bg-white/5 hover:bg-white/10 rounded-xl font-bold transition">取消</button>
        <button onclick="confirmCustomAsset()" class="flex-1 py-2.5 text-sm bg-apple-blue hover:opacity-90 active:scale-95 text-white rounded-xl font-bold transition shadow-md">確認加入</button>
      </div>
    </div>
  </div>

  <!-- FinMind API Token 設定彈窗 (台股專用) -->
  <div id="modal-token" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="glass-panel border border-white/15 w-full max-w-sm p-6 rounded-3xl space-y-4 shadow-2xl">
      <div>
        <h3 class="text-lg font-black text-white flex items-center gap-2">
          <span>🔑</span> <span>FinMind API 金鑰設定</span>
        </h3>
        <p class="text-xs text-apple-gray mt-1 leading-relaxed">
          系統已內建自動備用代理線路。若希望將台股直連額度擴增至 600 次/小時，可填入免費金鑰。
        </p>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-apple-gray mb-1 font-bold text-xs">個人 API Token</label>
          <input id="input-api-token" type="text" placeholder="貼上金鑰，可留空" class="w-full bg-black/50 border border-white/15 rounded-xl p-3 text-white outline-none focus:border-apple-blue font-mono text-xs shadow-inner" />
        </div>
      </div>
      <div class="flex gap-2.5 pt-1">
        <button onclick="clearApiToken()" class="py-2.5 px-3 text-xs text-apple-red bg-white/5 hover:bg-white/10 rounded-xl font-bold transition">清除金鑰</button>
        <button onclick="closeTokenModal()" class="flex-1 py-2.5 text-sm text-apple-gray bg-white/5 hover:bg-white/10 rounded-xl font-bold transition">取消</button>
        <button onclick="saveApiToken()" class="flex-1 py-2.5 text-sm bg-apple-blue hover:opacity-90 text-white rounded-xl font-bold transition shadow-md">儲存套用</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 雙市場資產字典與核心數據庫
    // =========================================================================
    const TW_STOCK_DICTIONARY = {
      '2330': '台積電', '2454': '聯發科', '2317': '鴻海', '2382': '廣達', '3231': '緯創',
      '6669': '緯穎', '2356': '英業達', '3017': '奇鋐', '3324': '雙鴻', '2376': '技嘉',
      '3443': '創意', '3661': '世芯-KY', '3035': '智原', '3034': '聯詠', '3583': '辛耘',
      '3131': '弘塑', '6187': '萬潤', '3711': '日月光投控', '3450': '聯鈞', '6442': '光聖',
      '1519': '華城', '1513': '中興電', '1514': '亞力', '1609': '大亞', '2359': '所羅門',
      '2049': '上銀', '4583': '台灣精銳', '8374': '羅昇', '3653': '健策', '2383': '台光電',
      '2368': '金像電', '6274': '台燿', '8046': '南電', '3037': '欣興', '2345': '智邦',
      '3533': '嘉澤', '3081': '聯亞', '4977': '眾達-KY', '2603': '長榮', '2609': '陽明',
      '2615': '萬海', '2618': '長榮航', '9945': '潤泰新', '2881': '富邦金', '2882': '國泰金',
      '2891': '中信金', '2886': '兆豐金', '2885': '元大金', '9904': '寶成', '2105': '正新',
      '1402': '遠東新', '1303': '南亞', '1301': '台塑', '2002': '中鋼', '2303': '聯電',
      '2884': '玉山金', '5876': '上海商銀', '2834': '臺企銀', '3702': '大聯大', '2812': '台中銀'
    };

    const CRYPTO_DICTIONARY = {
      'BTCUSDT': '比特幣 (BTC)', 'ETHUSDT': '以太坊 (ETH)', 'SOLUSDT': '索拉納 (SOL)',
      'BNBUSDT': '幣安幣 (BNB)', 'DOGEUSDT': '狗狗幣 (DOGE)', 'XRPUSDT': '瑞波幣 (XRP)',
      'ADAUSDT': '艾達幣 (ADA)', 'AVAXUSDT': '雪崩幣 (AVAX)', 'LINKUSDT': 'Chainlink',
      'SUIUSDT': 'Sui Network', 'NEARUSDT': 'NEAR Protocol', 'PEPEUSDT': 'Pepe Coin',
      'APTUSDT': 'Aptos', 'ARBUSDT': 'Arbitrum', 'OPUSDT': 'Optimism', 'LTCUSDT': '萊特幣 (LTC)'
    };

    const TW_VALUE_CORE_POOL = [
      { code: '2105', name: '正新', nav: 26.20 },
      { code: '1402', name: '遠東新', nav: 43.50 },
      { code: '9945', name: '潤泰新', nav: 56.85 },
      { code: '1303', name: '南亞', nav: 48.20 },
      { code: '2609', name: '陽明', nav: 96.50 }
    ];

    let currentMarket = 'CRYPTO'; // 預設直接看虛擬幣 (BTC)
    let currentCode = 'BTCUSDT';
    let currentTimeframe = '1h'; // Crypto 預設 1小時；TW 預設 D
    let currentDashboardMode = 'HUNTER';
    let currentViewMode = 'FOCUS';

    // 獨立本地持久化存儲 (台股與虛擬幣倉位分離，互不覆蓋)
    const STORAGE_TW_KEY = 'macro_trader_universe50_v14_financial_engine';
    const STORAGE_CRYPTO_KEY = 'crypto_adam_trader_v14_portfolio';

    let twProfiles = JSON.parse(localStorage.getItem(STORAGE_TW_KEY)) || {
      '9945': { name: '潤泰新', batches: [{ id: 'b_tw_1', cost: 26.1, shares: 63818, tag: '核心倉' }] }
    };

    let cryptoProfiles = JSON.parse(localStorage.getItem(STORAGE_CRYPTO_KEY)) || {
      'BTCUSDT': { name: '比特幣 (BTC)', batches: [{ id: 'b_crypto_1', cost: 63800.0, shares: 0.35, tag: '首發突破倉' }] }
    };

    let UNIVERSE_TW = { ...TW_STOCK_DICTIONARY };
    let UNIVERSE_CRYPTO = { ...CRYPTO_DICTIONARY };

    let rawKlines = [];
    let chart, candleSeries;
    let activePriceLines = [];
    let avgCostLine = null;
    let b2Line = null;
    let isChartHidden = false;

    let scannedOpportunities = [];
    let isScanning = false;
    let currentQualifiedScreenerItems = [];

    let currentStructure = {
      currentPrice: 0,
      macroLow: 0,
      macroHigh: 0,
      localLow: 0,
      localHigh: 0,
      boxH: 0,
      t1: 0,
      t2: 0,
      strategyType: '',
      suggestedEntry: 0,
      suggestedStop: 0,
      rrRatio: 0,
      rationale: '',
      isInsideBox: false
    };

    // =========================================================================
    // 2. 雙軌即時 API 資料獲取 (台股 FinMind + 幣安 15m/1h/4h/1d 直連)
    // =========================================================================
    function autoAdjustCorporateActions(klines) {
      if (!klines || klines.length < 2) return klines;
      const adjusted = klines.map(k => ({ ...k }));
      for (let i = adjusted.length - 1; i > 0; i--) {
        const prevClose = adjusted[i - 1].close;
        const curOpen = adjusted[i].open;
        if (prevClose <= 0 || curOpen <= 0) continue;
        const gap = (curOpen - prevClose) / prevClose;
        if (gap < -0.105 || gap > 0.105) {
          const factor = curOpen / prevClose;
          for (let j = 0; j < i; j++) {
            adjusted[j].open = parseFloat((adjusted[j].open * factor).toFixed(2));
            adjusted[j].high = parseFloat((adjusted[j].high * factor).toFixed(2));
            adjusted[j].low = parseFloat((adjusted[j].low * factor).toFixed(2));
            adjusted[j].close = parseFloat((adjusted[j].close * factor).toFixed(2));
            if (adjusted[j].volume && factor > 0) {
              adjusted[j].volume = Math.round(adjusted[j].volume / factor);
            }
          }
        }
      }
      return adjusted;
    }

    async function fetchTWKlines(code, startStr, forceRefresh = false) {
      const cacheKey = `kline_cache_tw_${code}`;
      if (!forceRefresh) {
        try {
          const cache = localStorage.getItem(cacheKey);
          if (cache) {
            const parsed = JSON.parse(cache);
            if (parsed && (Date.now() - parsed.timestamp < 3600 * 1000) && parsed.data?.length >= 10) {
              return parsed.data;
            }
          }
        } catch (e) {}
      }

      let directUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startStr}`;
      const savedToken = localStorage.getItem('finmind_api_token') || '';
      if (savedToken) directUrl += `&token=${encodeURIComponent(savedToken)}`;

      const endpoints = [
        directUrl,
        `https://corsproxy.io/?url=${encodeURIComponent(directUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`
      ];

      for (let url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const json = await res.json();
          const list = json.data || [];
          if (list.length >= 10) {
            const rawCandles = list
              .filter(d => d.date && d.close > 0 && d.max > 0 && d.min > 0)
              .map(d => ({
                time: d.date,
                open: d.open || d.close,
                high: d.max,
                low: d.min,
                close: d.close,
                volume: d.Trading_Volume || d.volume || 0
              }));
            const finalKlines = autoAdjustCorporateActions(rawCandles);
            try {
              localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: finalKlines }));
            } catch (e) {}
            return finalKlines;
          }
        } catch (err) {}
      }
      throw new Error(`台股 ${code} 連線異常`);
    }

    async function fetchBinanceKlines(symbol, interval = '1h', limit = 280) {
      const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Binance API HTTP ${res.status}`);
      const data = await res.json();
      return data.map(item => ({
        time: Math.floor(item[0] / 1000), // 秒級 Unix Timestamp
        open: parseFloat(item[1]),
        high: parseFloat(item[2]),
        low: parseFloat(item[3]),
        close: parseFloat(item[4]),
        volume: parseFloat(item[5])
      }));
    }

    async function loadAssetKlines(code, forceRefresh = false) {
      if (currentMarket === 'CRYPTO') {
        return await fetchBinanceKlines(code, currentTimeframe, 280);
      } else {
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 730);
        const startStr = startDate.toISOString().split('T')[0];
        return await fetchTWKlines(code, startStr, forceRefresh);
      }
    }

    // =========================================================================
    // 3. 量化對稱翻箱演算引擎 (台股金融防乖離 + 虛擬幣高彈性寬幅動態自適應)
    // =========================================================================
    function calculateSymmetricTargets(klines, curPrice, baseAtrPct, code = '') {
      const isCrypto = (currentMarket === 'CRYPTO');
      const isFinancial = !isCrypto && (code.startsWith('28') || code.startsWith('58') || code.startsWith('60'));

      const lookback = isCrypto ? Math.min(80, klines.length) : Math.min(120, klines.length);
      const recentSlice = klines.slice(-lookback);
      const maxBody = Math.max(...recentSlice.map(k => Math.max(k.open, k.close)));
      const minBody = Math.min(...recentSlice.map(k => Math.min(k.open, k.close)));
      const peakHigh = Math.max(...recentSlice.map(k => k.high));
      const troughLow = Math.min(...recentSlice.map(k => k.low));

      const wickHighThreshold = isCrypto ? 1.08 : 1.05;
      const wickLowThreshold = isCrypto ? 0.92 : 0.95;

      const effectiveHigh = (peakHigh > maxBody * wickHighThreshold) ? (maxBody * (isCrypto ? 1.025 : 1.02)) : peakHigh;
      const effectiveLow = (troughLow < minBody * wickLowThreshold) ? (minBody * (isCrypto ? 0.975 : 0.98)) : troughLow;

      let baseHigh = effectiveHigh;
      let baseLow = effectiveLow;
      let effectiveBoxH = effectiveHigh - effectiveLow;

      let maxCapRatio = isCrypto ? 0.28 : 0.16;
      let minBoxRatio = isCrypto ? 0.04 : 0.05;

      if (isFinancial || baseAtrPct < 1.6) {
        maxCapRatio = 0.07; // 台股金融股嚴格 7% 限幅保護
        minBoxRatio = 0.025;
      } else if (!isCrypto && baseAtrPct < 3.2) {
        maxCapRatio = 0.13;
        minBoxRatio = 0.05;
      }

      if (klines.length >= 35) {
        const localSlice = klines.slice(-35);
        const lMaxBody = Math.max(...localSlice.map(k => Math.max(k.open, k.close)));
        const lMinBody = Math.min(...localSlice.map(k => Math.min(k.open, k.close)));
        const lPeak = Math.max(...localSlice.map(k => k.high));
        const lTrough = Math.min(...localSlice.map(k => k.low));

        const lEffHigh = (lPeak > lMaxBody * 1.04) ? (lMaxBody * 1.015) : lPeak;
        const lEffLow = (lTrough < lMinBody * 0.96) ? (lMinBody * 0.985) : lTrough;

        if (lEffHigh < effectiveHigh * 0.97) {
          baseHigh = lEffHigh;
          baseLow = lEffLow;
          effectiveBoxH = Math.max(curPrice * minBoxRatio, Math.min(baseHigh - baseLow, curPrice * maxCapRatio));
        } else {
          effectiveBoxH = Math.min(effectiveBoxH, curPrice * maxCapRatio);
        }
      } else {
        effectiveBoxH = Math.min(effectiveBoxH, curPrice * maxCapRatio);
      }

      const isInsideBox = (curPrice < baseHigh * 0.985);
      let rawT1, rawT2;

      if (isInsideBox) {
        rawT1 = baseHigh;
        rawT2 = baseHigh + effectiveBoxH;
      } else {
        rawT1 = baseHigh + effectiveBoxH;
        rawT2 = rawT1 + effectiveBoxH;
      }

      return { baseHigh, baseLow, boxH: effectiveBoxH, rawT1, rawT2, isInsideBox };
    }

    function calculateDynamicPricing(klines, mLow, mHigh, lLow, t1, t2, code = '') {
      const isCrypto = (currentMarket === 'CRYPTO');
      const isFinancial = !isCrypto && (code.startsWith('28') || code.startsWith('58') || code.startsWith('60'));
      const len = klines.length;
      const curPrice = klines[len - 1].close;

      let trSum14 = 0;
      const atrPeriod = Math.min(14, len - 1);
      for (let i = len - atrPeriod; i < len; i++) {
        trSum14 += Math.max(klines[i].high - klines[i].low, Math.abs(klines[i].high - klines[i - 1].close), Math.abs(klines[i].low - klines[i - 1].close));
      }
      const atr14 = Math.max(curPrice * 0.003, trSum14 / atrPeriod);
      const atrPct = (atr14 / curPrice) * 100;

      let trSum40 = 0;
      const period40 = Math.min(40, len - 1);
      for (let i = len - period40; i < len; i++) {
        trSum40 += Math.max(klines[i].high - klines[i].low, Math.abs(klines[i].high - klines[i - 1].close), Math.abs(klines[i].low - klines[i - 1].close));
      }
      const baseAtrPct = ((trSum40 / period40) / curPrice) * 100;

      const ma10 = klines.slice(-10).reduce((s, k) => s + k.close, 0) / 10;
      const ma20 = klines.slice(-20).reduce((s, k) => s + k.close, 0) / 20;
      const ma60 = len >= 60 ? klines.slice(-60).reduce((s, k) => s + k.close, 0) / 60 : ma20;

      const recentSlice = klines.slice(-20);
      const rHigh = Math.max(...recentSlice.map(k => k.high));
      const rLow = Math.min(...recentSlice.map(k => k.low));
      const fibDiff = rHigh - rLow;
      const fib382 = rHigh - 0.382 * fibDiff;
      const fib500 = rHigh - 0.500 * fibDiff;
      const fib618 = rHigh - 0.618 * fibDiff;

      const avgVol5 = klines.slice(-5).reduce((s, k) => s + (k.volume || 0), 0) / 5;

      const hMultiYear = Math.max(...klines.map(k => k.high));
      const isTrappedUnderCeiling = (!isCrypto) && (t1 > hMultiYear * 1.02) && (curPrice < hMultiYear * 0.90);

      let finalT1 = t1;
      let finalT2 = t2;
      let ceilingWarning = '';

      if (isTrappedUnderCeiling) {
        finalT1 = hMultiYear * 0.96;
        finalT2 = hMultiYear;
        ceilingWarning = ` (⚠️ 上方受制波段大頂 $${formatPrice(hMultiYear)}，已壓制為真實目標)`;
      }

      let entry = 0;
      let stop = 0;
      let type = '';
      let rationale = '';
      let priority = 1;

      const bias20 = ((curPrice - ma20) / ma20) * 100;
      const price20Ago = klines[Math.max(0, len - 20)].close;
      const momentum20 = ((curPrice - price20Ago) / price20Ago) * 100;

      const overheatBiasLimit = isCrypto ? 14.0 : (isFinancial ? 4.5 : ((baseAtrPct < 1.9) ? 6.0 : 10.0));
      const overheatMomLimit = isCrypto ? 25.0 : (isFinancial ? 10.0 : ((baseAtrPct < 1.9) ? 14.0 : 22.0));
      const isParabolicOverheat = (bias20 > overheatBiasLimit) || (momentum20 > overheatMomLimit);

      const last5 = klines.slice(-5);
      const last5Low = Math.min(...last5.map(k => k.low));
      const isTightBase = ((mHigh - last5Low) / mHigh) <= 0.038;
      const priorTouches = recentSlice.slice(0, -3).filter(k => k.high >= mHigh * 0.985).length;
      const hasTrueConsolidationBase = isTightBase && (priorTouches >= 1);

      if (curPrice >= mHigh * 0.985 && curPrice <= mHigh * 1.05) {
        if (isParabolicOverheat || (!hasTrueConsolidationBase && !isCrypto)) {
          type = isCrypto ? '⚠️ 短線暴衝急拉·防插針拉回' : (isFinancial ? '⚠️ 權值金融急衝·防乖離拉回' : '⚠️ 垂直暴衝·缺乏橫盤底座');
          const safePullback = Math.max(ma10, fib382);
          entry = (safePullback < curPrice ? safePullback : curPrice * 0.96);
          stop = Math.min(fib618, ma20) - 0.8 * atr14;
          rationale = `短線垂直暴衝 +${momentum20.toFixed(1)}%、正乖離達 ${bias20.toFixed(1)}%！拒絕追高，預約於 10MA 或 0.382 費氏位 ($${formatPrice(entry)}) 回踩接刀${ceilingWarning}`;
          priority = 3;
        } else {
          type = '🚀 頸線動能突破/回踩';
          entry = mHigh;
          stop = mHigh - 1.2 * atr14;
          rationale = `高檔水平換手蓄勢並放量突破頸線 $${formatPrice(mHigh)}，以 1.2×ATR 設防洗停損${ceilingWarning}`;
          priority = 5;
        }
      } else if (curPrice <= lLow * 1.035) {
        type = '🛡️ 底座止跌低吸點';
        entry = lLow + 0.3 * atr14;
        stop = lLow - 0.7 * atr14;
        rationale = `回踩密集支撐底座 $${formatPrice(lLow)}，於底座上方掛單，停損嚴格守破底${ceilingWarning}`;
        priority = 4;
      } else if (curPrice >= ma20) {
        type = '📈 多頭均線/0.382回踩';
        const sup = Math.max(ma20, fib382);
        entry = (sup < curPrice) ? sup : Math.max(ma20, fib500);
        if (entry >= curPrice) entry = curPrice - 0.3 * atr14;
        stop = Math.min(fib618, entry - 1.0 * atr14);
        rationale = `站上 20 均線順勢發散，預約於 20MA ($${formatPrice(ma20)}) 或 0.382 支撐位 ($${formatPrice(fib382)}) 掛單${ceilingWarning}`;
        priority = 3;
      } else {
        type = '⏳ 箱體築底·區間掛單';
        entry = (fib500 < curPrice) ? fib500 : (curPrice - 0.5 * atr14);
        stop = Math.min(lLow, entry - 1.2 * atr14);
        rationale = `價格處於箱體半山腰，拒絕追高；預約於 0.5 費氏位 $${formatPrice(entry)} 限價接刀${ceilingWarning}`;
        priority = 2;
      }

      const minRiskBuffer = Math.max(curPrice * 0.015, 1.0 * atr14);
      if (entry - stop < minRiskBuffer) stop = entry - minRiskBuffer;

      const risk = Math.max(curPrice * 0.003, entry - stop);
      const reward = Math.max(curPrice * 0.003, finalT1 - entry);
      const rr = parseFloat((reward / risk).toFixed(1));

      return {
        entry, stop, type, rationale, priority, rr, avgVol5, atrPct,
        t1: finalT1, t2: finalT2, isTrappedUnderCeiling
      };
    }

    function analyzeStockStructure(klines, code = '') {
      if (!klines || klines.length < 25) return;
      const len = klines.length;
      const curPrice = klines[len - 1].close;
      const localSlice = klines.slice(-25);
      const lLow = Math.min(...localSlice.map(k => k.low));
      const lHigh = Math.max(...localSlice.map(k => k.high));

      let trSum40 = 0;
      const period40 = Math.min(40, len - 1);
      for (let i = len - period40; i < len; i++) {
        trSum40 += Math.max(klines[i].high - klines[i].low, Math.abs(klines[i].high - klines[i - 1].close), Math.abs(klines[i].low - klines[i - 1].close));
      }
      const baseAtrPct = ((trSum40 / period40) / curPrice) * 100;

      const targets = calculateSymmetricTargets(klines, curPrice, baseAtrPct, code);
      const plan = calculateDynamicPricing(klines, targets.baseLow, targets.baseHigh, lLow, targets.rawT1, targets.rawT2, code);

      currentStructure = {
        currentPrice: curPrice,
        macroLow: targets.baseLow,
        macroHigh: targets.baseHigh,
        localLow: lLow,
        localHigh: lHigh,
        boxH: targets.boxH,
        t1: plan.t1,
        t2: plan.t2,
        strategyType: plan.type,
        suggestedEntry: plan.entry,
        suggestedStop: plan.stop,
        rrRatio: plan.rr,
        rationale: plan.rationale,
        isInsideBox: targets.isInsideBox
      };
    }

    // =========================================================================
    // 4. Lightweight-Charts 圖表引擎初始化與視角自適應
    // =========================================================================
    function initChart() {
      const box = document.getElementById('chart-box');
      chart = LightweightCharts.createChart(box, {
        width: box.clientWidth,
        height: box.clientHeight || 420,
        layout: {
          background: { color: '#090d16' },
          textColor: '#8e8e93',
          fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif'
        },
        grid: {
          vertLines: { color: 'rgba(255, 255, 255, 0.04)' },
          horzLines: { color: 'rgba(255, 255, 255, 0.04)' }
        },
        rightPriceScale: { borderColor: 'rgba(255, 255, 255, 0.1)' },
        timeScale: {
          borderColor: 'rgba(255, 255, 255, 0.1)',
          timeVisible: true,
          secondsVisible: false
        },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
      });

      // Apple 規範配色：綠漲紅跌 (台股與虛擬幣統一清晰顯示)
      candleSeries = chart.addCandlestickSeries({
        upColor: '#30d158',
        downColor: '#ff453a',
        borderVisible: false,
        wickUpColor: '#30d158',
        wickDownColor: '#ff453a',
        autoscaleInfoProvider: (original) => {
          const res = original();
          if (res !== null && res.priceRange !== null) {
            let minP = res.priceRange.minValue;
            let maxP = res.priceRange.maxValue;

            if (currentViewMode === 'FOCUS') {
              if (currentStructure.suggestedStop > 0 && currentStructure.suggestedStop < minP) {
                minP = Math.min(minP, currentStructure.suggestedStop * 0.995);
              }
              if (currentStructure.suggestedEntry > 0 && currentStructure.suggestedEntry > maxP) {
                maxP = Math.max(maxP, currentStructure.suggestedEntry * 1.005);
              }
              return {
                priceRange: { minValue: minP * 0.99, maxValue: maxP * 1.01 },
                margins: res.margins
              };
            } else if (currentViewMode === 'T1') {
              if (currentStructure.suggestedStop > 0) minP = Math.min(minP, currentStructure.suggestedStop * 0.99);
              if (currentStructure.t1 > 0) maxP = Math.max(maxP, currentStructure.t1 * 1.02);
              return {
                priceRange: { minValue: minP * 0.99, maxValue: maxP },
                margins: res.margins
              };
            } else if (currentViewMode === 'MACRO') {
              if (currentStructure.suggestedStop > 0) minP = Math.min(minP, currentStructure.suggestedStop * 0.98);
              if (currentStructure.localLow > 0) minP = Math.min(minP, currentStructure.localLow * 0.98);
              if (currentStructure.t2 > 0) maxP = Math.max(maxP, currentStructure.t2 * 1.03);
              return {
                priceRange: { minValue: minP, maxValue: maxP },
                margins: res.margins
              };
            }
          }
          return res;
        }
      });

      // 響應式保證：ResizeObserver 確保在任何設備轉向、尺寸變換時 100% 重繪
      const resizeObserver = new ResizeObserver(entries => {
        if (!entries || entries.length === 0) return;
        const { width, height } = entries[0].contentRect;
        if (chart && width > 0 && height > 0 && !isChartHidden && currentDashboardMode !== 'VALUE') {
          chart.applyOptions({ width, height });
        }
      });
      resizeObserver.observe(box);
    }

    function formatPrice(p) {
      if (p === undefined || p === null || isNaN(p)) return '0.00';
      if (p >= 1000) return p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (p >= 1) return p.toFixed(3);
      if (p >= 0.01) return p.toFixed(4);
      return p.toFixed(6);
    }

    function clearPriceLines() {
      activePriceLines.forEach(l => candleSeries.removePriceLine(l));
      activePriceLines = [];
      avgCostLine = null;
      b2Line = null;
    }

    function addLine(price, color, title, lineStyle = 2, lineWidth = 2) {
      if (!price || isNaN(price) || price <= 0) return null;
      const l = candleSeries.createPriceLine({
        price: parseFloat(price), color, lineWidth, lineStyle, title
      });
      activePriceLines.push(l);
      return l;
    }

    function changeChartOpacity(val) {
      document.getElementById('chart-box').style.opacity = val / 100;
      document.getElementById('chart-opacity-val').innerText = `${val}%`;
    }

    function toggleChartDisplay() {
      isChartHidden = !isChartHidden;
      const box = document.getElementById('chart-box');
      const placeholder = document.getElementById('chart-hidden-placeholder');
      const btnText = document.getElementById('btn-chart-toggle-text');
      const floatBadges = document.getElementById('floating-targets');

      if (isChartHidden) {
        box.classList.add('hidden');
        if (floatBadges) floatBadges.classList.add('hidden');
        placeholder.classList.remove('hidden');

      } else {

        if (floatBadges) updateFloatingBadges();

        btnText.innerText = '隱藏';

    function setViewMode(mode) {
      currentViewMode = mode;
      ['FOCUS', 'T1', 'MACRO'].forEach(m => {
        const btn = document.getElementById(`view-mode-${m}`);
        if (btn) {
          btn.className = (m === mode)
            ? 'px-2.5 py-1 rounded-lg bg-apple-blue text-white font-bold transition shadow-sm'
            : 'px-2.5 py-1 rounded-lg text-apple-gray hover:text-white font-bold transition';
        }
      });
      updateFloatingBadges();
      if (candleSeries && chart) {
        candleSeries.applyOptions({});
        chart.priceScale('right').applyOptions({ autoScale: true });
      }

    function updateFloatingBadges() {
      const container = document.getElementById('floating-targets');
      if (!container) return;

      const t1 = formatPrice(currentStructure.t1);
      const t2 = formatPrice(currentStructure.t2);

      if (currentViewMode === 'FOCUS') {
        container.classList.remove('hidden');
        container.innerHTML = `

            <span>🎯 望向 T1 ($${t1})</span> <span>↗</span>
          </button>
          <button onclick="setViewMode('MACRO')" class="glass-panel text-apple-amber px-3 py-1.5 rounded-xl text-xs font-mono font-bold shadow-xl flex items-center gap-1 active:scale-95 border border-apple-amber/40">
            <span>🏆 望向 T2 ($${t2})</span> <span>↗</span>
          </button>
        `;
      } else if (currentViewMode === 'T1') {
        container.classList.remove('hidden');
        container.innerHTML = `
          <button onclick="setViewMode('MACRO')" class="glass-panel text-apple-amber px-3 py-1.5 rounded-xl text-xs font-mono font-bold shadow-xl flex items-center gap-1 active:scale-95 border border-apple-amber/40">
            <span>🏆 望向 T2 ($${t2})</span> <span>↗</span>
          </button>
        `;
      } else {
        container.classList.add('hidden');
        container.innerHTML = '';
      }
    }

    // =========================================================================
    // 5. 畫面載入與交互渲染 (雷達 Hunter / 持倉 Portfolio)
    // =========================================================================
    async function loadAsset(code, forceRefresh = false) {
      currentCode = code;
      const isCrypto = (currentMarket === 'CRYPTO');
      const universe = isCrypto ? UNIVERSE_CRYPTO : UNIVERSE_TW;
      const profiles = isCrypto ? cryptoProfiles : twProfiles;
      const name = universe[code] || (profiles[code] ? profiles[code].name : code);

      if (!profiles[code]) {
        profiles[code] = { name, batches: [] };
      }

      document.getElementById('chart-info').innerText = `${code} ${name} 載入中...`;
      renderAssetSelect();

      try {
        const klines = await loadAssetKlines(code, forceRefresh);
        rawKlines = klines;
        currentStructure.currentPrice = rawKlines[rawKlines.length - 1].close;

        analyzeStockStructure(rawKlines, code);
        renderActiveTimeframe();
        renderModeUI();
        updateFloatingBadges();

        if (candleSeries && chart) {
          candleSeries.applyOptions({});
          chart.priceScale('right').applyOptions({ autoScale: true });
        }

    function renderActiveTimeframe() {

      } else {

        const map = { D: '日 K', W: '週 K', M: '月 K' };
        document.getElementById('chart-info').innerText = `${currentCode} ${UNIVERSE_TW[currentCode] || currentCode} 【${map[currentTimeframe]}】 $${formatPrice(currentStructure.currentPrice)}`;
      }
    }

    function aggregateTWKlines(dailyData, type) {
      if (type === 'D') return dailyData;
      const groups = {};
      dailyData.forEach(bar => {
        let key = '';
        const d = new Date(bar.time);
        if (type === 'W') {
          const day = d.getDay() || 7;
          d.setDate(d.getDate() - day + 1);
          key = d.toISOString().split('T')[0];
        } else if (type === 'M') {
          key = `${bar.time.slice(0, 7)}-01`;
        }
        if (!groups[key]) {
          groups[key] = { time: key, open: bar.open, high: bar.high, low: bar.low, close: bar.close };
        } else {
          groups[key].high = Math.max(groups[key].high, bar.high);
          groups[key].low = Math.min(groups[key].low, bar.low);
          groups[key].close = bar.close;
        }
      });
      return Object.values(groups).sort((a, b) => a.time.localeCompare(b.time));
    }

    function updateBatchRow(batchId, field, val) {
      const isCrypto = (currentMarket === 'CRYPTO');
      const profiles = isCrypto ? cryptoProfiles : twProfiles;
      const profile = profiles[currentCode];
      if (!profile || !profile.batches) return;
      const target = profile.batches.find(b => b.id === batchId);
      if (!target) return;
      const numVal = parseFloat(val);
      if (!isNaN(numVal)) {
        target[field] = numVal;
        saveProfiles();
        recalcPortfolioAggregates();
      }
    }

    function recalcPortfolioAggregates() {
      const isCrypto = (currentMarket === 'CRYPTO');
      const profiles = isCrypto ? cryptoProfiles : twProfiles;
      const profile = profiles[currentCode];
      const batches = profile.batches || [];
      const curPrice = currentStructure.currentPrice;
      const t1 = currentStructure.t1;
      const t2 = currentStructure.t2;
      const stop = currentStructure.localLow;

      let totalShares = 0;
      let totalCostSum = 0;

      batches.forEach(b => {
        const c = parseFloat(b.cost) || 0;
        const s = parseFloat(b.shares) || 0;
        totalShares += s;
        totalCostSum += (c * s);

        const rowPnl = (curPrice - c) * s;
        const pnlLabel = document.getElementById(`batch-pnl-${b.id}`);
        if (pnlLabel) {
          pnlLabel.innerText = `${rowPnl >= 0 ? '+' : ''}${isCrypto ? rowPnl.toFixed(2) + ' U' : Math.round(rowPnl).toLocaleString()}`;
          pnlLabel.className = `font-mono text-xs font-black block ${rowPnl >= 0 ? 'text-apple-green' : 'text-apple-red'}`;
        }
      });

      const avgCost = totalShares > 0 ? (totalCostSum / totalShares) : 0;
      const totalPnl = (curPrice - avgCost) * totalShares;
      const totalPnlPct = avgCost > 0 ? (((curPrice - avgCost) / avgCost) * 100).toFixed(1) : 0;

      const statCost = document.getElementById('stat-avg-cost');
      const statShares = document.getElementById('stat-total-shares');
      const pnlLabel = document.getElementById('port-pnl-label');
      const statusPill = document.getElementById('port-status-pill');

      if (statCost) statCost.innerText = `$${formatPrice(avgCost)}`;
      if (statShares) statShares.innerText = `${isCrypto ? totalShares : totalShares.toLocaleString() + ' 股'}`;

      if (pnlLabel) {
        pnlLabel.innerText = `${totalPnl >= 0 ? '+' : ''}${isCrypto ? totalPnl.toFixed(2) + ' USDT' : Math.round(totalPnl).toLocaleString() + ' 元'} (${totalPnlPct}%)`;
        pnlLabel.className = `font-mono font-black text-base ${totalPnl >= 0 ? 'text-apple-green' : 'text-apple-red'}`;
      }
      if (statusPill) {
        statusPill.innerText = totalPnl >= 0 ? '整體獲利中' : '回檔整理中';
        statusPill.className = `text-xs font-bold px-3 py-0.5 rounded-full ${totalPnl >= 0 ? 'bg-emerald-950/80 text-apple-green border border-apple-green/40' : 'bg-rose-950/80 text-apple-red border border-apple-red/40'}`;
      }

      if (avgCost > 0) {
        if (!avgCostLine) avgCostLine = addLine(avgCost, '#0a84ff', '【加權均價】', 1, 2);
        else avgCostLine.applyOptions({ price: avgCost });
      } else if (avgCostLine) {
        candleSeries.removePriceLine(avgCostLine);
        avgCostLine = null;
      }

      const t1Shares = isCrypto ? (totalShares * 0.6) : Math.round(totalShares * 0.6);
      const t2Shares = totalShares - t1Shares;
      const t1Profit = (t1 - avgCost) * t1Shares;
      const t2Profit = (t2 - avgCost) * t2Shares;

      if (t1PctElem) t1PctElem.innerText = `(+${t1Pct}%)`;

      if (t2Title) t2Title.innerText = `🏆 T2 奔跑 40% (${isCrypto ? t2Shares.toFixed(3) : t2Shares.toLocaleString() + ' 股'})`;
      if (t2Money) t2Money.innerText = `+${isCrypto ? t2Profit.toFixed(2) + ' U' : Math.round(t2Profit).toLocaleString() + ' 元'}`;
      if (t2PctElem) t2PctElem.innerText = `(+${t2Pct}%)`;

      const risk = Math.max(0, (avgCost - stop) * totalShares);
      const totalReward = t1Profit + t2Profit;
      const hud = document.getElementById('hud-bottom-card');
      if (hud) {

        `;
      }
    }

    // =========================================================================
    // 6. 全自動異步批次掃描器 (Chunking & Rate Limiting 完整還原)
    // =========================================================================
    async function runFullAutoScanner() {
      if (isScanning) return;
      isScanning = true;
      const btn = document.getElementById('btn-run-scan');
      if (btn) btn.innerText = '⚡ 掃描中 (0%)...';

      const isCrypto = (currentMarket === 'CRYPTO');
      const allCodesMap = isCrypto ? { ...UNIVERSE_CRYPTO } : { ...UNIVERSE_TW };
      const profiles = isCrypto ? cryptoProfiles : twProfiles;

      Object.keys(profiles).forEach(c => {
        allCodesMap[c] = profiles[c].name;
      });

      const allCodes = Object.keys(allCodesMap);
      const CHUNK_SIZE = isCrypto ? 4 : 5;
      const DELAY_MS = 200;
      const opportunities = [];

      for (let i = 0; i < allCodes.length; i += CHUNK_SIZE) {
        const chunk = allCodes.slice(i, i + CHUNK_SIZE);
        if (btn) btn.innerText = `⚡ 掃描中 (${i}/${allCodes.length})...`;

        const chunkPromises = chunk.map(async code => {
          try {
            const klines = await loadAssetKlines(code, false);
            return { code, klines };
          } catch {
            return { code, klines: [] };
          }
        });

        const chunkResults = await Promise.allSettled(chunkPromises);

        chunkResults.forEach(res => {
          const item = res.value;
          if (!item || !item.klines || item.klines.length < 20) return;

          const code = item.code;
          const klines = item.klines;
          const len = klines.length;
          const curClose = klines[len - 1].close;
          const lLow = Math.min(...klines.slice(-20).map(k => k.low));

          let trSum40 = 0;
          const period40 = Math.min(40, len - 1);
          for (let k = len - period40; k < len; k++) {
            trSum40 += Math.max(klines[k].high - klines[k].low, Math.abs(klines[k].high - klines[k - 1].close), Math.abs(klines[k].low - klines[k - 1].close));
          }
          const baseAtrPct = ((trSum40 / period40) / curClose) * 100;

          const targets = calculateSymmetricTargets(klines, curClose, baseAtrPct, code);
          const plan = calculateDynamicPricing(klines, targets.baseLow, targets.baseHigh, lLow, targets.rawT1, targets.rawT2, code);
          const isHolding = profiles[code] && (profiles[code].batches || []).length > 0;

          if (!isHolding) {
            if (plan.isTrappedUnderCeiling && plan.rr < 2.8) return;
            if (plan.atrPct < (isCrypto ? 0.8 : 1.2)) return;
            if (!isCrypto && plan.avgVol5 < 800) return;
            if (plan.rr < 1.8) return;
          }

          opportunities.push({
            code,
            name: allCodesMap[code] || code,
            currentPrice: curClose,
            entry: plan.entry,
            stop: plan.stop,
            t1: plan.t1,
            t2: plan.t2,
            rr: plan.rr,
            tag: plan.type,
            priority: plan.priority,
            score: plan.priority * 10 + plan.rr,
            isHolding
          });
        });

        await new Promise(r => setTimeout(r, DELAY_MS));
      }

      opportunities.sort((a, b) => {
        if (a.isHolding && !b.isHolding) return -1;
        if (!a.isHolding && b.isHolding) return 1;
        return b.score - a.score;
      });

      scannedOpportunities = opportunities;
      isScanning = false;
      if (btn) btn.innerText = '🔄 重新掃描';

      if (currentDashboardMode === 'HUNTER') {
        renderHunterMode();
      }
    }

    // --- FinMind Token Modal ---
    function openTokenModal() {
      document.getElementById('input-api-token').value = localStorage.getItem('finmind_api_token') || '';
      document.getElementById('modal-token').classList.remove('hidden');
    }

    function closeTokenModal() {
      document.getElementById('modal-token').classList.add('hidden');
    }

    function saveApiToken() {
      const token = document.getElementById('input-api-token').value.trim();
      if (token) localStorage.setItem('finmind_api_token', token);
      else localStorage.removeItem('finmind_api_token');
      closeTokenModal();
      switchAsset(currentCode, true);
    }

    function clearApiToken() {
      localStorage.removeItem('finmind_api_token');
      document.getElementById('input-api-token').value = '';
      closeTokenModal();
      switchAsset(currentCode, true);
    }

    // =========================================================================
    // 9. 系統開機初始化：預設直接進入比特幣 1H 亞當翻箱決策
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      initChart();
      renderTimeframeButtons();
      renderAssetSelect();
      // 直接預設載入比特幣 (BTCUSDT)，秒級連線
      loadAsset('BTCUSDT');
    });
  </script>
</body>
</html>
