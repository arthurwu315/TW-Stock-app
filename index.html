<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>量化波段與低估值雙核心決策終端</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    @media screen and (max-width: 768px) {
      input, select { font-size: 16px !important; }
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen md:h-screen w-screen overflow-x-hidden md:overflow-hidden p-3 sm:p-4 flex flex-col justify-between gap-3">

  <!-- 頂部操控列 -->
  <header class="w-full bg-slate-800/90 border border-slate-700/80 rounded-2xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 shrink-0 shadow-xl backdrop-blur-md">
    <div class="flex items-center gap-3">
      <span class="text-lg sm:text-xl font-black text-white tracking-wide flex items-center gap-2">
        <span class="text-sky-400">⚡</span> <span>決策終端</span>
      </span>
      
      <!-- 三大核心功能切換 -->
      <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-sm font-bold gap-1">
        <button onclick="setDashboardMode('HUNTER')" id="tab-HUNTER" class="px-3.5 py-1.5 rounded-lg bg-sky-500 text-white transition flex items-center gap-1.5 font-bold shadow">
          <span>🎯</span> <span>50檔雷達</span>
        </button>
        <button onclick="setDashboardMode('PORTFOLIO')" id="tab-PORTFOLIO" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1.5 font-bold">
          <span>💼</span> <span>持倉簿記</span>
        </button>
        <button onclick="setDashboardMode('VALUE')" id="tab-VALUE" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1.5 font-bold">
          <span>📊</span> <span>低估值選股</span>
        </button>
      </div>
    </div>

    <!-- 股票選擇與時框 -->
    <div id="chart-controls-cluster" class="flex items-center gap-2.5">
      <select id="stock-select" onchange="switchStock(this.value)" class="bg-slate-900 border border-slate-700 text-white text-sm rounded-xl px-3 py-1.5 font-bold focus:outline-none focus:border-sky-400 max-w-[160px] sm:max-w-none shadow-sm">
      </select>

      <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold gap-0.5">
        <button onclick="setTimeframe('D')" id="tf-D" class="px-3 py-1 rounded-lg bg-sky-500 text-white transition">日</button>
        <button onclick="setTimeframe('W')" id="tf-W" class="px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">週</button>
        <button onclick="setTimeframe('M')" id="tf-M" class="px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">月</button>
      </div>

      <button onclick="openModal()" class="bg-sky-500 hover:bg-sky-400 active:scale-95 text-white text-sm font-bold px-3.5 py-1.5 rounded-xl transition shadow-md flex items-center gap-1">
        <span>＋</span> <span>自選</span>
      </button>
    </div>
  </header>

  <!-- 主工作區 1：波段與持倉視圖 (Chart + Panel) -->
  <main id="view-macro-chart" class="w-full flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 min-h-0">
    
    <!-- 左側 K 線圖表 -->
    <section class="md:col-span-7 lg:col-span-8 bg-slate-800/80 border border-slate-700/70 rounded-2xl p-3.5 flex flex-col justify-between min-h-[380px] md:min-h-0 shadow-lg">
      <div class="flex flex-wrap justify-between items-center text-sm pb-2.5 border-b border-slate-700/60 gap-2 shrink-0">
        <div class="flex items-center gap-2.5">
          <span id="chart-info" class="font-black text-white text-base tracking-wide">連線中...</span>
          <div class="flex bg-slate-950 p-0.5 rounded-xl border border-slate-800 text-xs font-bold">
            <button id="view-mode-FOCUS" onclick="setViewMode('FOCUS')" class="px-2.5 py-1 rounded-lg bg-sky-500 text-white font-bold transition flex items-center gap-1 shadow-sm">
              <span>🔍</span> <span>聚焦K棒</span>
            </button>
            <button id="view-mode-T1" onclick="setViewMode('T1')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white font-bold transition flex items-center gap-1">
              <span>🎯</span> <span>T1視角</span>
            </button>
            <button id="view-mode-MACRO" onclick="setViewMode('MACRO')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white font-bold transition flex items-center gap-1">
              <span>🔭</span> <span>T2全景</span>
            </button>
          </div>
          <button id="btn-chart-toggle" onclick="toggleChartDisplay()" class="bg-slate-900 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg text-xs font-semibold border border-slate-700">
            👁️ <span id="btn-chart-toggle-text">隱藏</span>
          </button>
          <div class="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800 text-xs">
            <span class="text-slate-400 font-semibold">透明度</span>
            <input type="range" min="10" max="100" value="100" oninput="changeChartOpacity(this.value)" class="w-16 h-1.5 accent-sky-400 cursor-pointer" />
            <span id="chart-opacity-val" class="text-slate-300 font-mono w-8 text-right">100%</span>
          </div>
        </div>

        <div id="dynamic-legend" class="flex flex-wrap gap-2.5 text-xs font-bold"></div>
      </div>

      <div class="relative w-full flex-1 min-h-[300px] md:min-h-0 mt-2 rounded-xl overflow-hidden">
        <div id="chart-box" class="w-full h-full min-h-[300px] md:min-h-0 transition-opacity duration-150"></div>
        <div id="floating-targets" class="absolute top-2 right-14 flex flex-col gap-1.5 z-10 pointer-events-auto"></div>
      </div>
      
      <div id="chart-hidden-placeholder" class="hidden w-full flex-1 flex flex-col items-center justify-center text-slate-500 gap-2 border border-dashed border-slate-700 py-12 rounded-xl">
        <span class="text-4xl">👁️‍🗨️</span>
        <span class="text-base font-bold">線圖已隱藏 · 專注結構決策</span>
      </div>
    </section>

    <!-- 右側 雙模動態操作面板 -->
    <section class="md:col-span-5 lg:col-span-4 bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 flex flex-col justify-between gap-3.5 overflow-y-auto shadow-lg">
      <div id="panel-content-container" class="space-y-3.5"></div>
      <div id="hud-bottom-card" class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/80 text-sm space-y-2 mt-1 shadow-inner"></div>
    </section>
  </main>

  <!-- 主工作區 2：【📊 低價低估值決策終端】 -->
  <main id="view-value-screener" class="w-full flex-1 hidden bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 sm:p-6 flex-col justify-between overflow-y-auto shadow-xl">
    <div class="space-y-4">
      <div class="flex flex-wrap justify-between items-center pb-4 border-b border-slate-700/80 gap-3">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-sky-400 tracking-wide flex items-center gap-2">
            <span>📊</span> <span>低價低估值決策終端</span>
          </h2>
          <p class="text-xs sm:text-sm text-slate-400 font-semibold mt-1">
            極致篩選準則：最新收盤價 ≦ <b class="text-white">$50.00</b> 且 股價淨值比 (PBR) ≦ <b class="text-white">0.85 倍</b> · 逆向價值防護
          </p>
        </div>
        <div class="flex items-center gap-2.5">
          <button id="btn-import-all-value" onclick="bringAllValueStocksToRadar()" class="hidden bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs sm:text-sm font-black px-3.5 py-2.5 rounded-xl transition shadow-lg flex items-center gap-1.5">
            <span>📥</span> <span>一鍵全部帶入雷達觀察</span>
          </button>
          <button id="btn-fetch-value" onclick="fetchValueScreenerData()" class="bg-sky-500 hover:bg-sky-400 disabled:opacity-50 disabled:cursor-not-allowed active:scale-95 text-white text-xs sm:text-sm font-black px-4 py-2.5 rounded-xl transition shadow-lg flex items-center gap-2">
            <span>🔄</span> <span>點此連線獲取最新數據</span>
          </button>
        </div>
      </div>

      <!-- 數據表格區 -->
      <div class="overflow-x-auto rounded-xl border border-slate-700/80 bg-slate-900/60 shadow-inner">
        <table class="w-full text-left border-collapse min-w-[700px]">
          <thead>
            <tr class="border-b border-slate-700/80 bg-slate-900/90 text-slate-400 text-xs sm:text-sm font-bold">
              <th class="py-3 px-4">股票代號</th>
              <th class="py-3 px-4">股票名稱</th>
              <th class="py-3 px-4">今日收盤價</th>
              <th class="py-3 px-4">每股淨值 (NAV)</th>
              <th class="py-3 px-4">即時淨值比 (PBR)</th>
              <th class="py-3 px-4 text-center">決策判定</th>
              <th class="py-3 px-4 text-center">動作</th>
            </tr>
          </thead>
          <tbody id="value-table-body" class="divide-y divide-slate-800 text-sm font-medium">
            <tr>
              <td colspan="7" class="py-16 text-center text-slate-400 text-sm font-semibold tracking-wide">
                <span class="text-2xl block mb-2">💡</span>
                請點選右上角按鈕下載今日數據...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 頁尾提示 -->
    <footer class="pt-4 border-t border-slate-700/60 text-right">
      <p class="text-xs text-slate-400">
        * 本終端每股淨值 (NAV) 數據基於最新公告財報；收盤價取自證交所官方盤後即時結算，現場動態運算篩選。
      </p>
    </footer>
  </main>

  <!-- 自訂股票彈窗 -->
  <div id="modal-custom" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm p-6 rounded-2xl space-y-4 shadow-2xl">
      <div>
        <h3 class="text-lg font-black text-white flex items-center gap-2">
          <span>＋</span> <span>加入觀察清單</span>
        </h3>
        <p class="text-xs text-slate-400 mt-0.5">輸入 4 碼代號，系統將自動秒填名稱</p>
      </div>

      <div class="space-y-3.5 text-sm">
        <div>
          <label class="block text-slate-300 mb-1 font-bold">台股代號</label>
          <input id="custom-code" type="text" placeholder="例: 2454 或 聯發科" oninput="handleCustomCodeInput(this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white uppercase outline-none focus:border-sky-400 font-bold text-base shadow-inner" />
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold flex justify-between">
            <span>股票名稱</span>
            <span class="text-xs text-sky-400 font-normal">可留空，系統自動識別</span>
          </label>
          <input id="custom-name" type="text" placeholder="自動配對中..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-slate-200 outline-none focus:border-sky-400 font-bold text-base" />
        </div>
      </div>
      <div class="flex gap-2.5 pt-1">
        <button onclick="closeModal()" class="flex-1 py-2.5 text-sm text-slate-400 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition">取消</button>
        <button onclick="confirmCustomStock()" class="flex-1 py-2.5 text-sm bg-sky-500 hover:bg-sky-400 text-white rounded-xl font-bold transition shadow-md">確認加入</button>
      </div>
    </div>
  </div>

  <script>
    const TW_STOCK_DICTIONARY = {
      '2330': '台積電', '2454': '聯發科', '2317': '鴻海', '2382': '廣達', '3231': '緯創',
      '6669': '緯穎', '2356': '英業達', '3017': '奇鋐', '3324': '雙鴻', '2376': '技嘉',
      '3443': '創意', '3661': '世芯-KY', '3035': '智原', '3034': '聯詠', '3583': '辛耘',
      '3131': '弘塑', '6187': '萬潤', '3711': '日月光投控', '3450': '聯鈞', '6442': '光聖',
      '1519': '華城', '1513': '中興電', '1514': '亞力', '1609': '大亞', '2359': '所羅門',
      '2049': '上銀', '4583': '台灣精銳', '8374': '羅昇', '3653': '健策', '2383': '台光電',
      '2368': '金像電', '6274': '台燿', '8046': '南電', '3037': '欣興', '2345': '智邦',
      '3533': '嘉澤', '3081': '聯亞', '4977': '眾達-KY', '2603': '長榮', '2609': '陽明',
      '2615': '萬海', '2618': '長榮航', '9945': '潤泰新', '2881': '富邦金', '2882': '國泰金',
      '2891': '中信金', '2886': '兆豐金', '2885': '元大金', '9904': '寶成', '2105': '正新',
      '1402': '遠東新', '1303': '南亞', '1301': '台塑', '2002': '中鋼', '2303': '聯電',
      '2884': '玉山金', '5876': '上海商銀', '2834': '臺企銀', '3702': '大聯大', '2812': '台中銀'
    };

    let UNIVERSE_50 = { ...TW_STOCK_DICTIONARY };

    const VALUE_CORE_POOL = [
      { code: '2105', name: '正新', nav: 26.20 },
      { code: '1402', name: '遠東新', nav: 43.50 },
      { code: '9945', name: '潤泰新', nav: 56.85 },
      { code: '1303', name: '南亞', nav: 48.20 },
      { code: '2609', name: '陽明', nav: 96.50 }
    ];

    let currentQualifiedValueStocks = [];

    const defaultLedgerProfiles = {
      '9945': {
        name: '潤泰新',
        batches: [
          { id: 'b_1', cost: 26.1, shares: 63818, tag: '核心倉' }
        ]
      }
    };

    const STORAGE_KEY = 'macro_trader_universe50_v8';
    let stockProfiles = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultLedgerProfiles;
    let currentCode = '9945';
    let currentDashboardMode = 'HUNTER';

    const memoryKlinesCache = {};

    let rawDailyKlines = [];
    let currentTimeframe = 'D';
    let chart, candleSeries;
    let activePriceLines = [];
    let avgCostLine = null;
    let isChartHidden = false;

    let scannedOpportunities = [];
    let isScanning = false;
    let currentViewMode = 'FOCUS';

    let currentStockStructure = {
      currentPrice: 0,
      macroLow: 0,
      macroHigh: 0,
      localLow: 0,
      localHigh: 0,
      boxH: 0,
      t1: 0,
      t2: 0,
      strategyType: '',
      suggestedEntry: 0,
      suggestedStop: 0,
      rrRatio: 0,
      rationale: ''
    };

    function initChart() {
      const box = document.getElementById('chart-box');
      chart = LightweightCharts.createChart(box, {
        width: box.clientWidth,
        height: box.clientHeight || 400,
        layout: { background: { color: '#1e293b' }, textColor: '#94a3b8' },
        grid: { vertLines: { color: '#334155' }, horzLines: { color: '#334155' } },
        rightPriceScale: { borderColor: '#475569' },
        timeScale: { borderColor: '#475569' },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#f43f5e', downColor: '#10b981', borderVisible: false,
        wickUpColor: '#f43f5e', wickDownColor: '#10b981',
        autoscaleInfoProvider: (original) => {
          const res = original();
          if (res !== null && res.priceRange !== null) {
            let minP = res.priceRange.minValue;
            let maxP = res.priceRange.maxValue;

            if (currentViewMode === 'FOCUS') {
              if (currentStockStructure.suggestedStop > 0 && currentStockStructure.suggestedStop < minP) {
                minP = Math.min(minP, currentStockStructure.suggestedStop * 0.995);
              }
              if (currentStockStructure.suggestedEntry > 0 && currentStockStructure.suggestedEntry > maxP) {
                maxP = Math.max(maxP, currentStockStructure.suggestedEntry * 1.005);
              }
              return {
                priceRange: {
                  minValue: minP * 0.99,
                  maxValue: maxP * 1.01
                },
                margins: res.margins
              };
            } else if (currentViewMode === 'T1') {
              if (currentStockStructure.suggestedStop > 0) minP = Math.min(minP, currentStockStructure.suggestedStop * 0.99);
              if (currentStockStructure.t1 > 0) maxP = Math.max(maxP, currentStockStructure.t1 * 1.02);
              return {
                priceRange: { minValue: minP * 0.99, maxValue: maxP },
                margins: res.margins
              };
            } else if (currentViewMode === 'MACRO') {
              if (currentStockStructure.suggestedStop > 0) minP = Math.min(minP, currentStockStructure.suggestedStop * 0.98);
              if (currentStockStructure.localLow > 0) minP = Math.min(minP, currentStockStructure.localLow * 0.98);
              if (currentStockStructure.t2 > 0) maxP = Math.max(maxP, currentStockStructure.t2 * 1.03);
              return {
                priceRange: { minValue: minP, maxValue: maxP },
                margins: res.margins
              };
            }
          }
          return res;
        }
      });

      window.addEventListener('resize', () => {
        if (chart && box && !isChartHidden && currentDashboardMode !== 'VALUE') {
          chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
        }
      });
    }

    function changeChartOpacity(val) {
      document.getElementById('chart-box').style.opacity = val / 100;
      document.getElementById('chart-opacity-val').innerText = `${val}%`;
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      ['FOCUS', 'T1', 'MACRO'].forEach(m => {
        const btn = document.getElementById(`view-mode-${m}`);
        if (btn) {
          btn.className = (m === mode)
            ? 'px-2.5 py-1 rounded-lg bg-sky-500 text-white font-bold transition flex items-center gap-1 shadow-sm'
            : 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white font-bold transition flex items-center gap-1';
        }
      });

      updateFloatingBadges();

      if (candleSeries && chart) {
        candleSeries.applyOptions({});
        chart.priceScale('right').applyOptions({ autoScale: true });
      }
    }

    function updateFloatingBadges() {
      const container = document.getElementById('floating-targets');
      if (!container) return;

      const t1 = currentStockStructure.t1;
      const t2 = currentStockStructure.t2;

      if (currentViewMode === 'FOCUS') {
        container.classList.remove('hidden');
        container.innerHTML = `
          <button onclick="setViewMode('T1')" class="bg-emerald-950/90 hover:bg-emerald-900 border border-emerald-600/80 text-emerald-300 px-3 py-1.5 rounded-lg text-xs font-bold shadow-lg flex items-center gap-1.5 backdrop-blur-md transition active:scale-95">
            <span>🎯 望向 T1 ($${t1})</span> <span class="text-xs">↗</span>
          </button>
          <button onclick="setViewMode('MACRO')" class="bg-amber-950/90 hover:bg-amber-900 border border-amber-600/80 text-amber-300 px-3 py-1.5 rounded-lg text-xs font-bold shadow-lg flex items-center gap-1.5 backdrop-blur-md transition active:scale-95">
            <span>🏆 望向 T2 ($${t2})</span> <span class="text-xs">↗</span>
          </button>
        `;
      } else if (currentViewMode === 'T1') {
        container.classList.remove('hidden');
        container.innerHTML = `
          <button onclick="setViewMode('MACRO')" class="bg-amber-950/90 hover:bg-amber-900 border border-amber-600/80 text-amber-300 px-3 py-1.5 rounded-lg text-xs font-bold shadow-lg flex items-center gap-1.5 backdrop-blur-md transition active:scale-95">
            <span>🏆 望向 T2 ($${t2})</span> <span class="text-xs">↗</span>
          </button>
        `;
      } else {
        container.classList.add('hidden');
        container.innerHTML = '';
      }
    }

    function toggleChartDisplay() {
      isChartHidden = !isChartHidden;
      const box = document.getElementById('chart-box');
      const placeholder = document.getElementById('chart-hidden-placeholder');
      const btnText = document.getElementById('btn-chart-toggle-text');
      const floatBadges = document.getElementById('floating-targets');

      if (isChartHidden) {
        box.classList.add('hidden');
        if (floatBadges) floatBadges.classList.add('hidden');
        placeholder.classList.remove('hidden');
        btnText.innerText = '顯示';
      } else {
        box.classList.remove('hidden');
        if (floatBadges) updateFloatingBadges();
        placeholder.classList.add('hidden');
        btnText.innerText = '隱藏';
        if (chart && box) chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
      }
    }

    function setDashboardMode(mode) {
      currentDashboardMode = mode;
      
      const btnHunter = document.getElementById('tab-HUNTER');
      const btnPort = document.getElementById('tab-PORTFOLIO');
      const btnVal = document.getElementById('tab-VALUE');
      const chartView = document.getElementById('view-macro-chart');

    function renderLoadedKlines(code, klines) {

    // =========================================================================
    // 核心演算：自適應波動率測幅 (ATR% 階梯上限) + 影線修剪 + 歷史頂部防禦
    // =========================================================================
    function calculateSymmetricTargets(klines, curPrice, atrPct) {
      const recentSlice = klines.slice(-120);

      // 1. 提取實體邊界與極端針頭 (Wick Shaving)
      const maxBody = Math.max(...recentSlice.map(k => Math.max(k.open, k.close)));
      const minBody = Math.min(...recentSlice.map(k => Math.min(k.open, k.close)));
      const peakHigh = Math.max(...recentSlice.map(k => k.high));
      const troughLow = Math.min(...recentSlice.map(k => k.low));

      const effectiveHigh = (peakHigh > maxBody * 1.05) ? parseFloat((maxBody * 1.02).toFixed(2)) : peakHigh;
      const effectiveLow = (troughLow < minBody * 0.95) ? parseFloat((minBody * 0.98).toFixed(2)) : troughLow;

      const macroSpan = (effectiveHigh - effectiveLow) / curPrice;
      let baseHigh = effectiveHigh;
      let baseLow = effectiveLow;
      let effectiveBoxH = effectiveHigh - effectiveLow;

      // 波動率自適應動態上限 (防止金融/傳產牛皮股翻出天價)
      let maxCapRatio = 0.16;
      let minBoxRatio = 0.05;
      if (atrPct < 1.8) {
        maxCapRatio = 0.09; // 金融傳產 (低 ATR%) 單波目標上限 8%~9%
        minBoxRatio = 0.03;
      } else if (atrPct < 3.0) {
        maxCapRatio = 0.14; // 常態股 14%
        minBoxRatio = 0.05;
      } else {
        maxCapRatio = 0.18; // 高動能成長股 18%
        minBoxRatio = 0.07;
      }

      // 2. 中繼型態識別門檻調降至 18%，波段升幅 > 18% 即自動切入實體中繼平台
      if (macroSpan > 0.18 && klines.length >= 35) {
        const localSlice = klines.slice(-35);
        const lMaxBody = Math.max(...localSlice.map(k => Math.max(k.open, k.close)));
        const lMinBody = Math.min(...localSlice.map(k => Math.min(k.open, k.close)));
        const lPeak = Math.max(...localSlice.map(k => k.high));
        const lTrough = Math.min(...localSlice.map(k => k.low));

        baseHigh = (lPeak > lMaxBody * 1.04) ? parseFloat((lMaxBody * 1.015).toFixed(2)) : lPeak;
        baseLow = (lTrough < lMinBody * 0.96) ? parseFloat((lMinBody * 0.985).toFixed(2)) : lTrough;

        effectiveBoxH = Math.max(curPrice * minBoxRatio, Math.min(baseHigh - baseLow, curPrice * maxCapRatio));
      } else {
        effectiveBoxH = Math.min(effectiveBoxH, curPrice * maxCapRatio);
      }

      const rawT1 = parseFloat((baseHigh + effectiveBoxH).toFixed(2));
      const rawT2 = parseFloat((rawT1 + effectiveBoxH).toFixed(2));

      return { baseHigh, baseLow, boxH: effectiveBoxH, rawT1, rawT2 };
    }

    function calculateDynamicPricing(klines, mLow, mHigh, lLow, t1, t2) {
      const len = klines.length;
      const curPrice = klines[len - 1].close;

      let trSum = 0;
      const atrPeriod = Math.min(14, len - 1);
      for (let i = len - atrPeriod; i < len; i++) {
        const h = klines[i].high;
        const l = klines[i].low;
        const prevC = klines[i - 1].close;
        const tr = Math.max(h - l, Math.abs(h - prevC), Math.abs(l - prevC));
        trSum += tr;
      }
      const atr14 = Math.max(0.1, trSum / atrPeriod);
      const atrPct = (atr14 / curPrice) * 100;

      const ma10 = klines.slice(-10).reduce((sum, k) => sum + k.close, 0) / 10;
      const ma20 = klines.slice(-20).reduce((sum, k) => sum + k.close, 0) / 20;

      const recentSlice = klines.slice(-20);
      const rHigh = Math.max(...recentSlice.map(k => k.high));
      const rLow = Math.min(...recentSlice.map(k => k.low));
      const fibDiff = rHigh - rLow;
      const fib382 = parseFloat((rHigh - 0.382 * fibDiff).toFixed(2));
      const fib500 = parseFloat((rHigh - 0.500 * fibDiff).toFixed(2));
      const fib618 = parseFloat((rHigh - 0.618 * fibDiff).toFixed(2));

      const avgVol5 = klines.slice(-5).reduce((s, k) => s + (k.volume || 0), 0) / (5 * 1000);

      // 天花板阻力檢驗
      const hMultiYear = Math.max(...klines.map(k => k.high));
      const isTrappedUnderCeiling = (t1 > hMultiYear * 1.02) && (curPrice < hMultiYear * 0.90);

      let finalT1 = t1;
      let finalT2 = t2;
      let ceilingWarning = '';

      if (isTrappedUnderCeiling) {
        finalT1 = parseFloat((hMultiYear * 0.96).toFixed(2));
        finalT2 = parseFloat(hMultiYear.toFixed(2));
        ceilingWarning = ` (⚠️ 上方受制波段大頂 $${hMultiYear}，已壓制為真實目標)`;
      }

      let entry = 0;
      let stop = 0;
      let type = '';
      let rationale = '';
      let priority = 1;

      // 檢查是否為「低波動權值股短線急噴乖離過大」
      const isLowVolSurge = (atrPct < 1.8) && (curPrice > ma20 * 1.05);

      if (curPrice >= mHigh * 0.985 && curPrice <= mHigh * 1.05) {
        if (isLowVolSurge) {
          type = '⚠️ 權值金融急衝·防乖離拉回';
          entry = parseFloat(Math.max(ma10, fib382).toFixed(2));
          stop = parseFloat((entry - 1.2 * atr14).toFixed(2));
          rationale = `低波動權值短線連拉、正乖離偏大；拒絕於天花板 $${mHigh} 追價，預約於 10MA ($${ma10.toFixed(2)}) 支撐掛單${ceilingWarning}`;
          priority = 3;
        } else {
          type = '🚀 頸線動能突破/回踩';
          entry = parseFloat(mHigh.toFixed(2));
          stop = parseFloat((mHigh - 1.2 * atr14).toFixed(2));
          rationale = `站穩實體頸線 $${mHigh}，以 1.2×ATR ($${(1.2*atr14).toFixed(2)}) 設防洗停損${ceilingWarning}`;
          priority = 5;
        }
      } else if (curPrice <= lLow * 1.035) {
        type = '🛡️ 底座止跌低吸點';
        entry = parseFloat((lLow + 0.3 * atr14).toFixed(2));
        stop = parseFloat((lLow - 0.5 * atr14).toFixed(2));
        rationale = `測試底座 $${lLow}，於底座上方 0.3×ATR ($${entry}) 掛單，停損守破底${ceilingWarning}`;
        priority = 4;
      } else if (curPrice >= ma20 && ma10 >= ma20) {
        type = '📈 多頭均線/0.382回踩';
        const sup = Math.max(ma20, fib382);
        if (sup < curPrice) entry = parseFloat(sup.toFixed(2));
        else entry = parseFloat(Math.max(ma20, fib500).toFixed(2));
        if (entry >= curPrice) entry = parseFloat((curPrice - 0.3 * atr14).toFixed(2));
        stop = parseFloat(Math.min(fib618, entry - 1.0 * atr14).toFixed(2));
        rationale = `多頭發散，預約於 20MA ($${ma20.toFixed(2)}) 或 0.382 費氏位 ($${fib382}) 支撐掛單${ceilingWarning}`;
        priority = 3;
      } else {
        type = '⏳ 區間震盪·回踩掛單';
        if (fib500 < curPrice) entry = fib500;
        else if (fib618 < curPrice) entry = fib618;
        else entry = parseFloat((curPrice - 0.5 * atr14).toFixed(2));
        stop = parseFloat(Math.min(lLow, entry - 1.0 * atr14).toFixed(2));
        rationale = `股價處於半山腰，拒絕追高；預約於 0.5 費氏位 $${entry} 限價接刀${ceilingWarning}`;
        priority = 2;
      }

      const risk = Math.max(0.1, parseFloat((entry - stop).toFixed(2)));
      const reward = Math.max(0.1, parseFloat((finalT1 - entry).toFixed(2)));
      const rr = parseFloat((reward / risk).toFixed(1));

      return {
        entry, stop, type, rationale, priority, rr, avgVol5, atrPct,
        t1: finalT1, t2: finalT2, isTrappedUnderCeiling
      };
    }

    function analyzeStockStructure(klines) {
      if (klines.length < 30) return;

      const len = klines.length;
      const curPrice = klines[len - 1].close;
      const localSlice = klines.slice(-25);
      const lLow = Math.min(...localSlice.map(k => k.low));
      const lHigh = Math.max(...localSlice.map(k => k.high));

      // 預先計算 ATR% 以驅動自適應測幅
      let trSum = 0;
      const atrPeriod = Math.min(14, len - 1);
      for (let i = len - atrPeriod; i < len; i++) {
        const h = klines[i].high;
        const l = klines[i].low;
        const prevC = klines[i - 1].close;
        trSum += Math.max(h - l, Math.abs(h - prevC), Math.abs(l - prevC));
      }
      const initialAtrPct = ((trSum / atrPeriod) / curPrice) * 100;

      // 傳入 atrPct 調用自適應對稱目標
      const targets = calculateSymmetricTargets(klines, curPrice, initialAtrPct);

      currentStockStructure.macroLow = parseFloat(targets.baseLow.toFixed(2));
      currentStockStructure.macroHigh = parseFloat(targets.baseHigh.toFixed(2));
      currentStockStructure.localLow = parseFloat(lLow.toFixed(2));
      currentStockStructure.localHigh = parseFloat(lHigh.toFixed(2));
      currentStockStructure.boxH = parseFloat(targets.boxH.toFixed(2));

      const plan = calculateDynamicPricing(klines, targets.baseLow, targets.baseHigh, lLow, targets.rawT1, targets.rawT2);
      currentStockStructure.t1 = plan.t1;
      currentStockStructure.t2 = plan.t2;
      currentStockStructure.strategyType = plan.type;
      currentStockStructure.suggestedEntry = plan.entry;
      currentStockStructure.suggestedStop = plan.stop;
      currentStockStructure.rationale = plan.rationale;
      currentStockStructure.rrRatio = plan.rr;
    }

    async function runFullAutoScanner() {
      if (isScanning) return;
      isScanning = true;
      const btn = document.getElementById('btn-run-scan');
      if (btn) btn.innerText = '⚡ 掃描中 (0%)...';

      const allCodesMap = { ...UNIVERSE_50 };
      Object.keys(stockProfiles).forEach(c => {
        allCodesMap[c] = stockProfiles[c].name;
      });
      const allCodes = Object.keys(allCodesMap);

      const startDate = new Date();
      startDate.setDate(startDate.getDate() - 365);
      const startStr = startDate.toISOString().split('T')[0];

      const CHUNK_SIZE = 5;
      const DELAY_MS = 200;
      const opportunities = [];

      for (let i = 0; i < allCodes.length; i += CHUNK_SIZE) {
        const chunk = allCodes.slice(i, i + CHUNK_SIZE);
        if (btn) btn.innerText = `⚡ 掃描中 (${i}/${allCodes.length})...`;

        const chunkPromises = chunk.map(async code => {
          if (memoryKlinesCache[code]) {
            return { code, data: memoryKlinesCache[code], isCached: true };
          }
          const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startStr}`;
          try {
            const r = await fetch(url);
            if (!r.ok) return { code, data: [] };
            const res = await r.json();
            return { code, data: res.data || [], isCached: false };
          } catch {
            return { code, data: [] };
          }
        });

        const chunkResults = await Promise.allSettled(chunkPromises);

        chunkResults.forEach(res => {
          const item = res.value;
          if (!item) return;
          const code = item.code;
          const rawData = item.data;

          let klines = [];
          if (item.isCached) {
            klines = rawData;
          } else {
            klines = rawData
              .filter(d => d.date && d.close > 0 && d.max > 0 && d.min > 0)
              .map(d => ({
                time: d.date,
                open: d.open || d.close,
                high: d.max,
                low: d.min,
                close: d.close,
                volume: d.Trading_Volume || d.volume || 0
              }));
            if (klines.length > 20) memoryKlinesCache[code] = klines;
          }

          if (klines.length > 20) {
            const curClose = klines[klines.length - 1].close;
            const lLow = Math.min(...klines.slice(-20).map(k => k.low));

            let trSum = 0;
            const atrPeriod = Math.min(14, klines.length - 1);
            for (let i = klines.length - atrPeriod; i < klines.length; i++) {
              trSum += Math.max(klines[i].high - klines[i].low, Math.abs(klines[i].high - klines[i-1].close), Math.abs(klines[i].low - klines[i-1].close));
            }
            const curAtrPct = ((trSum / atrPeriod) / curClose) * 100;

            const targets = calculateSymmetricTargets(klines, curClose, curAtrPct);
            const plan = calculateDynamicPricing(klines, targets.baseLow, targets.baseHigh, lLow, targets.rawT1, targets.rawT2);
            const isHolding = stockProfiles[code] && (stockProfiles[code].batches || []).length > 0;

            if (!isHolding) {
              if (plan.isTrappedUnderCeiling && plan.rr < 3.0) return;
              if (plan.atrPct < 1.3) return;
              if (plan.avgVol5 < 1000) return;
              if (plan.rr < 2.0) return;
            }

            opportunities.push({
              code,
              name: allCodesMap[code] || code,
              currentPrice: curClose,
              entry: plan.entry,
              stop: plan.stop,
              t1: plan.t1,
              t2: plan.t2,
              rr: plan.rr,
              tag: plan.type,
              priority: plan.priority,
              score: plan.priority * 10 + plan.rr,
              avgVol5: Math.round(plan.avgVol5),
              isHolding
            });
          }
        });

        await new Promise(r => setTimeout(r, DELAY_MS));
      }

      opportunities.sort((a, b) => {
        if (a.isHolding && !b.isHolding) return -1;
        if (!a.isHolding && b.isHolding) return 1;
        return b.score - a.score;
      });

      scannedOpportunities = opportunities;
      isScanning = false;
      if (btn) btn.innerText = '🔄 重新掃描';

      if (currentDashboardMode === 'HUNTER') {
        renderHunterMode();
      }
    }

    function addNewBatch() {
      const profile = stockProfiles[currentCode];
      if (!profile.batches) profile.batches = [];

      const defaultPrice = currentStockStructure.suggestedEntry > 0 
        ? currentStockStructure.suggestedEntry 
        : currentStockStructure.currentPrice;

      const newId = 'b_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      profile.batches.push({
        id: newId,
        cost: defaultPrice,
        shares: 10000,
        tag: '加碼批次'
      });

      saveProfiles();
      renderPortfolioMode();
    }

    function addBatchFromHunter() {
      const profile = stockProfiles[currentCode];
      if (!profile.batches) profile.batches = [];

      const entryPrice = currentStockStructure.suggestedEntry > 0 
        ? currentStockStructure.suggestedEntry 
        : currentStockStructure.currentPrice;

      const newId = 'b_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      profile.batches.push({
        id: newId,
        cost: entryPrice,
        shares: 5000,
        tag: currentStockStructure.strategyType ? currentStockStructure.strategyType.split(' ')[0] : '動態切入'
      });

      saveProfiles();
      setDashboardMode('PORTFOLIO');
    }

    function removeBatch(batchId) {
      const profile = stockProfiles[currentCode];
      if (!profile || !profile.batches) return;

      profile.batches = profile.batches.filter(b => b.id !== batchId);
      saveProfiles();
      renderPortfolioMode();
    }

    function updateBatchRow(batchId, field, val) {
      const profile = stockProfiles[currentCode];
      if (!profile || !profile.batches) return;

      const target = profile.batches.find(b => b.id === batchId);
      if (!target) return;

      const numVal = parseFloat(val);
      if (!isNaN(numVal)) {
        target[field] = numVal;
        saveProfiles();
        recalcPortfolioAggregates();
      }
    }

    function recalcPortfolioAggregates() {
      const profile = stockProfiles[currentCode];
      const batches = profile.batches || [];
      const curPrice = currentStockStructure.currentPrice;
      const t1 = currentStockStructure.t1;
      const t2 = currentStockStructure.t2;
      const stop = currentStockStructure.localLow;

      let totalShares = 0;
      let totalCostSum = 0;

      batches.forEach(b => {
        const c = parseFloat(b.cost) || 0;
        const s = parseInt(b.shares) || 0;
        totalShares += s;
        totalCostSum += (c * s);

        const rowPnl = (curPrice - c) * s;
        const pnlLabel = document.getElementById(`batch-pnl-${b.id}`);
        if (pnlLabel) {
          pnlLabel.innerText = `${rowPnl >= 0 ? '+' : ''}${Math.round(rowPnl).toLocaleString()}`;
          pnlLabel.className = `font-mono text-sm font-black block ${rowPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
        }
      });

      const avgCost = totalShares > 0 ? (totalCostSum / totalShares) : 0;
      const totalPnl = Math.round((curPrice - avgCost) * totalShares);
      const totalPnlPct = avgCost > 0 ? (((curPrice - avgCost) / avgCost) * 100).toFixed(1) : 0;

      const statCost = document.getElementById('stat-avg-cost');
      const statShares = document.getElementById('stat-total-shares');
      const pnlLabel = document.getElementById('port-pnl-label');
      const statusPill = document.getElementById('port-status-pill');

      if (statCost) statCost.innerText = `$${avgCost.toFixed(2)}`;
      if (statShares) statShares.innerText = `${totalShares.toLocaleString()} 股`;

      if (pnlLabel) {
        pnlLabel.innerText = `${totalPnl >= 0 ? '+' : ''}${totalPnl.toLocaleString()} 元 (${totalPnlPct}%)`;
        pnlLabel.className = `font-mono font-black text-base sm:text-lg ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
      }
      if (statusPill) {
        statusPill.innerText = totalPnl >= 0 ? '整體獲利中' : '回檔整理中';
        statusPill.className = `text-xs font-bold px-3 py-1 rounded-lg ${totalPnl >= 0 ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-rose-950 text-rose-300 border border-rose-800'}`;
      }

      if (avgCost > 0) {
        if (!avgCostLine) {
          avgCostLine = addLine(avgCost, '#38bdf8', '【加權均價】', 1, 2);
        } else {
          avgCostLine.applyOptions({ price: avgCost });
        }
      } else if (avgCostLine) {
        candleSeries.removePriceLine(avgCostLine);
        avgCostLine = null;
      }

      const t1Shares = Math.round(totalShares * 0.6);
      const t2Shares = totalShares - t1Shares;
      const t1Profit = Math.round((t1 - avgCost) * t1Shares);
      const t2Profit = Math.round((t2 - avgCost) * t2Shares);
      const t1Pct = avgCost > 0 ? (((t1 - avgCost) / avgCost) * 100).toFixed(1) : 0;
      const t2Pct = avgCost > 0 ? (((t2 - avgCost) / avgCost) * 100).toFixed(1) : 0;

      const t1Title = document.getElementById('port-t1-title');
      const t1Money = document.getElementById('port-t1-money');
      const t1PctElem = document.getElementById('port-t1-pct');

      const t2Title = document.getElementById('port-t2-title');
      const t2Money = document.getElementById('port-t2-money');
      const t2PctElem = document.getElementById('port-t2-pct');

      if (t1Title) t1Title.innerText = `🎯 T1 建議收割 60% (${t1Shares.toLocaleString()} 股)`;
      if (t1Money) t1Money.innerText = `+${t1Profit.toLocaleString()} 元`;
      if (t1PctElem) t1PctElem.innerText = `(+${t1Pct}%)`;

      if (t2Title) t2Title.innerText = `🏆 T2 奔跑 40% (${t2Shares.toLocaleString()} 股)`;
      if (t2Money) t2Money.innerText = `+${t2Profit.toLocaleString()} 元`;
      if (t2PctElem) t2PctElem.innerText = `(+${t2Pct}%)`;

      const risk = Math.max(0, (avgCost - stop) * totalShares);
      const totalReward = t1Profit + t2Profit;
      const hud = document.getElementById('hud-bottom-card');
      if (hud) {
        hud.innerHTML = `
          <div class="text-slate-400 font-bold text-xs border-b border-slate-700 pb-1.5 flex justify-between">
            <span>持倉極限風控 (${batches.length} 筆批次)</span>
            <span class="text-rose-400 font-black font-mono text-sm">底座防守: $${stop}</span>
          </div>
          <div class="flex justify-between text-slate-300 text-sm">
            <span>若破底最大承擔風險：</span>
            <span class="text-rose-400 font-mono font-black">-$${Math.round(risk).toLocaleString()}</span>
          </div>
          <div class="flex justify-between text-emerald-400 font-bold pt-1.5 border-t border-slate-700 text-sm">
            <span>全波段最優期望總盈餘：</span>
            <span class="font-mono text-base font-black">+$${totalReward.toLocaleString()}</span>
          </div>
        `;
      }
    }

    // =========================================================================
    // 模組三：低價低估值選股引擎 (防本地快取、平滑 400ms 反饋、帶時間戳記)
    // =========================================================================
    async function fetchValueScreenerData() {
      const btn = document.getElementById('btn-fetch-value');
      const btnImportAll = document.getElementById('btn-import-all-value');
      const tbody = document.getElementById('value-table-body');
      
      btn.disabled = true;
      btn.innerHTML = `<span>⏳</span> <span>連線演算中...</span>`;
      btnImportAll.classList.add('hidden');
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="py-16 text-center text-sky-400 text-sm font-black tracking-wide animate-pulse">
            <span class="text-3xl block mb-2">⏳</span>
            正在連線 API 獲取收盤價並執行 PBR 估值過濾...
          </td>
        </tr>
      `;

      const delayPromise = new Promise(r => setTimeout(r, 400));
      const startDate = new Date();
      startDate.setDate(startDate.getDate() - 20);
      const startStr = startDate.toISOString().split('T')[0];

      try {
        const fetchPromises = VALUE_CORE_POOL.map(async item => {
          const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${item.code}&start_date=${startStr}&_t=${Date.now()}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const list = json.data || [];
          if (list.length === 0) return { ...item, close: 0 };
          const curClose = list[list.length - 1].close;
          return { ...item, close: curClose };
        });

        const [results] = await Promise.all([Promise.all(fetchPromises), delayPromise]);

        const qualifiedList = results.filter(stock => {
          if (stock.close <= 0) return false;
          const pbr = stock.close / stock.nav;
          return (stock.close <= 50.0) && (pbr <= 0.85);
        });

        currentQualifiedValueStocks = qualifiedList;

        if (qualifiedList.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="py-16 text-center text-amber-300 text-sm sm:text-base font-bold tracking-wide">
                <span class="text-3xl block mb-2">⚠️</span>
                今日暫無低價股滿足極致篩選門檻
              </td>
            </tr>
          `;
        } else {
          btnImportAll.classList.remove('hidden');
          tbody.innerHTML = qualifiedList.map(stock => {
            const pbr = (stock.close / stock.nav).toFixed(2);
            return `
              <tr class="hover:bg-slate-800/80 transition border-b border-slate-800">
                <td class="py-3.5 px-4 font-mono">
                  <span class="bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-md font-bold tracking-wider">${stock.code}</span>
                </td>
                <td class="py-3.5 px-4 font-black text-sky-300 text-base sm:text-lg">
                  ${stock.name}
                </td>
                <td class="py-3.5 px-4 font-black text-rose-400 font-mono text-base sm:text-lg">
                  $${stock.close.toFixed(2)}
                </td>
                <td class="py-3.5 px-4 text-slate-300 font-mono font-bold text-sm sm:text-base">
                  $${stock.nav.toFixed(2)}
                </td>
                <td class="py-3.5 px-4">
                  <span class="bg-emerald-950 text-emerald-300 border border-emerald-600 px-3 py-1 rounded-full text-xs sm:text-sm font-black font-mono tracking-wide shadow-sm">
                    ${pbr} 倍
                  </span>
                </td>
                <td class="py-3.5 px-4 text-center">
                  <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 font-black text-xs sm:text-sm px-3 py-1 rounded-lg inline-flex items-center gap-1 shadow-sm">
                    🔥 精準符合
                  </span>
                </td>
                <td class="py-3.5 px-4 text-center">
                  <button onclick="bringSingleValueStockToChart('${stock.code}', '${stock.name}')" class="bg-sky-600 hover:bg-sky-500 active:scale-95 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl transition shadow flex items-center gap-1 mx-auto">
                    <span>🔍</span> <span>帶入看圖</span>
                  </button>
                </td>
              </tr>
            `;
          }).join('');
        }

      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-16 text-center text-rose-400 text-sm sm:text-base font-bold tracking-wide">
              <span class="text-3xl block mb-2">❌</span>
              終端連線異常，請檢查網路環境。
            </td>
          </tr>
        `;
      } finally {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];
        btn.disabled = false;
        btn.innerHTML = `<span>🔄</span> <span>已更新 (${timeStr})</span>`;
      }
    }

    function bringSingleValueStockToChart(code, name) {
      UNIVERSE_50[code] = name;
      if (!stockProfiles[code]) {
        stockProfiles[code] = { name, batches: [] };
      }
      saveProfiles();
      renderStockSelect();
      switchStock(code);
      setDashboardMode('HUNTER');
    }

    function bringAllValueStocksToRadar() {
      if (currentQualifiedValueStocks.length === 0) return;

      currentQualifiedValueStocks.forEach(stock => {
        UNIVERSE_50[stock.code] = stock.name;
        if (!stockProfiles[stock.code]) {
          stockProfiles[stock.code] = { name: stock.name, batches: [] };
        }
      });

      saveProfiles();
      renderStockSelect();
      setDashboardMode('HUNTER');
      runFullAutoScanner();
    }

    function handleCustomCodeInput(inputVal) {
      const val = inputVal.trim();
      const nameInput = document.getElementById('custom-name');

      if (TW_STOCK_DICTIONARY[val]) {
        nameInput.value = TW_STOCK_DICTIONARY[val];
        return;
      }

      for (const [c, n] of Object.entries(TW_STOCK_DICTIONARY)) {
        if (n === val) {
          document.getElementById('custom-code').value = c;
          nameInput.value = n;
          return;
        }
      }
    }

    function saveProfiles() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stockProfiles));
    }

    function renderStockSelect() {
      const select = document.getElementById('stock-select');
      select.innerHTML = '';

      const myHoldingCodes = Object.keys(stockProfiles);
      myHoldingCodes.forEach(code => {
        const opt = document.createElement('option');
        opt.value = code;
        opt.innerText = `💼 ${code} ${stockProfiles[code].name}`;
        if (code === currentCode) opt.selected = true;
        select.appendChild(opt);
      });

      Object.keys(UNIVERSE_50).forEach(code => {
        if (!stockProfiles[code]) {
          const opt = document.createElement('option');
          opt.value = code;
          opt.innerText = `${code} ${UNIVERSE_50[code]}`;
          if (code === currentCode) opt.selected = true;
          select.appendChild(opt);
        }
      });
    }

    function switchStock(code) {
      loadStock(code);
    }

    function setTimeframe(tf) {
      currentTimeframe = tf;
      ['D', 'W', 'M'].forEach(t => {
        document.getElementById(`tf-${t}`).className = (t === tf)
          ? 'px-3 py-1 rounded-lg bg-sky-500 text-white font-bold transition'
          : 'px-3 py-1 rounded-lg text-slate-400 hover:text-white font-bold transition';
      });
      renderActiveTimeframe();
    }

    function renderActiveTimeframe() {
      if (rawDailyKlines.length === 0) return;
      candleSeries.setData(aggregateKlines(rawDailyKlines, currentTimeframe));
      const map = { D: '日 K', W: '週 K', M: '月 K' };
      document.getElementById('chart-info').innerText = `${currentCode} ${UNIVERSE_50[currentCode] || currentCode} 【${map[currentTimeframe]}】`;
    }

    function aggregateKlines(dailyData, type) {
      if (type === 'D') return dailyData;
      const groups = {};
      dailyData.forEach(bar => {
        let key = '';
        const d = new Date(bar.time);
        if (type === 'W') {
          const day = d.getDay() || 7;
          d.setDate(d.getDate() - day + 1);
          key = d.toISOString().split('T')[0];
        } else if (type === 'M') {
          key = `${bar.time.slice(0, 7)}-01`;
        }
        if (!groups[key]) {
          groups[key] = { time: key, open: bar.open, high: bar.high, low: bar.low, close: bar.close };
        } else {
          groups[key].high = Math.max(groups[key].high, bar.high);
          groups[key].low = Math.min(groups[key].low, bar.low);
          groups[key].close = bar.close;
        }
      });
      return Object.values(groups).sort((a, b) => a.time.localeCompare(b.time));
    }

    function openModal() {
      document.getElementById('custom-code').value = '';
      document.getElementById('custom-name').value = '';
      document.getElementById('modal-custom').classList.remove('hidden');
    }
    
    function closeModal() {
      document.getElementById('modal-custom').classList.add('hidden');
    }

    function confirmCustomStock() {
      let code = document.getElementById('custom-code').value.trim().toUpperCase();
      let name = document.getElementById('custom-name').value.trim();

      if (!code) return alert('請至少輸入股票代號');

      if (!name) {
        name = TW_STOCK_DICTIONARY[code] || code;
      }

      UNIVERSE_50[code] = name;
      stockProfiles[code] = { name, batches: [] };
      saveProfiles();
      renderStockSelect();
      closeModal();
      switchStock(code);
      runFullAutoScanner();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initChart();
      renderStockSelect();
      switchStock('9945');
    });
  </script>
</body>
</html>
