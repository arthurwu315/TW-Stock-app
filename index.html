    // =========================================================================
    // API 連線層：幣安免金鑰直連 (秒級) + FinMind 台股代理
    // =========================================================================
    async function fetchKlinesData(market, symbol, tf) {
      if (market === 'CRYPTO') {
        // 幣安公開 REST API (支援 15m, 1h, 4h, 1d)
        const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=240`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Binance HTTP ${res.status}`);
        const data = await res.json();
        return data.map(item => ({
          time: Math.floor(item[0] / 1000), // TradingView 秒級 Unix Timestamp
          open: parseFloat(item[1]),
          high: parseFloat(item[2]),
          low: parseFloat(item[3]),
          close: parseFloat(item[4]),
          volume: parseFloat(item[5])
        }));
      } else {
        // 台股 FinMind 線路
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 500);
        const startStr = startDate.toISOString().split('T')[0];
        const directUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${symbol}&start_date=${startStr}`;
        const endpoints = [
          directUrl,
          `https://corsproxy.io/?url=${encodeURIComponent(directUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`
        ];

        let lastErr = null;
        for (let url of endpoints) {
          try {
            const res = await fetch(url);
            if (!res.ok) continue;
            const json = await res.json();
            const list = json.data || [];
            if (list.length >= 10) {
              return list.map(d => ({
                time: d.date,
                open: d.open || d.close,
                high: d.max,
                low: d.min,
                close: d.close,
                volume: d.Trading_Volume || d.volume || 0
              }));
            }
          } catch (e) {
            lastErr = e;
          }
        }
        throw lastErr || new Error('台股數據線路無法連線');
      }
    }

    // =========================================================================
    // 核心量化引擎：自適應亞當理論 (對稱翻箱 & 幾何目標測幅)
    // =========================================================================
    function analyzeAdamSymmetricStructure(klines, market) {
      if (!klines || klines.length < 25) return;

      const len = klines.length;
      const curPrice = klines[len - 1].close;
      currentStructure.currentPrice = curPrice;

      // 1. 計算當前資產真實 ATR 波動
      let trSum14 = 0;
      const period = Math.min(14, len - 1);
      for (let i = len - period; i < len; i++) {
        const h = klines[i].high;
        const l = klines[i].low;
        const prevC = klines[i - 1].close;
        trSum14 += Math.max(h - l, Math.abs(h - prevC), Math.abs(l - prevC));
      }
      const atr14 = trSum14 / period;
      const atrPct = (atr14 / curPrice) * 100;

      // 2. 識別前波密集箱體的高低底座 (過濾虛幻長影線插針)
      const sliceLookback = Math.min(70, len);
      const recentSlice = klines.slice(-sliceLookback);
      const bodiesMax = Math.max(...recentSlice.map(k => Math.max(k.open, k.close)));
      const bodiesMin = Math.min(...recentSlice.map(k => Math.min(k.open, k.close)));
      const rawHigh = Math.max(...recentSlice.map(k => k.high));
      const rawLow = Math.min(...recentSlice.map(k => k.low));

      // 若最高點超出實體 6% 視為合約插針，壓制為真實水平頸線
      const effectiveHigh = (rawHigh > bodiesMax * 1.06) ? (bodiesMax * 1.025) : rawHigh;
      const effectiveLow = (rawLow < bodiesMin * 0.94) ? (bodiesMin * 0.975) : rawLow;

      const boxH = effectiveHigh - effectiveLow;
      currentStructure.macroHigh = effectiveHigh;
      currentStructure.macroLow = effectiveLow;
      currentStructure.boxH = boxH;

      // 近期 20 根次級底座
      const localSlice = klines.slice(-20);
      const lLow = Math.min(...localSlice.map(k => k.low));
      const lHigh = Math.max(...localSlice.map(k => k.high));
      currentStructure.localLow = lLow;
      currentStructure.localHigh = lHigh;

      // 3. 亞當理論第一對稱滿足 (T1) 與第二對稱翻倍 (T2)
      const isInsideBox = (curPrice < effectiveHigh * 0.99);
      let t1, t2;
      if (isInsideBox) {
        t1 = effectiveHigh;
        t2 = effectiveHigh + boxH;
      } else {
        t1 = effectiveHigh + boxH;
        t2 = t1 + boxH;
      }

      currentStructure.t1 = t1;
      currentStructure.t2 = t2;

      // 4. 動態定價與買點策略推導
      const ma20 = klines.slice(-20).reduce((s, k) => s + k.close, 0) / 20;
      const fibDiff = lHigh - lLow;
      const fib382 = lHigh - 0.382 * fibDiff;

      let entry = curPrice;
      let stop = lLow;
      let type = '';
      let rationale = '';

      if (curPrice >= effectiveHigh * 0.985 && curPrice <= effectiveHigh * 1.04) {
        type = '🚀 頸線突破·亞當翻倍';
        entry = effectiveHigh;
        stop = effectiveHigh - 1.2 * atr14;
        rationale = `強勢挑戰關鍵水平頸線，確認實體站穩後開倉，預約第一波對稱測幅目標 $${formatPrice(t1)}`;
      } else if (curPrice <= lLow * 1.025) {
        type = '🛡️ 底座支撐·極限低吸';
        entry = lLow + 0.3 * atr14;
        stop = lLow - 0.8 * atr14;
        rationale = `回測密集整理底座 $${formatPrice(lLow)}，防守明確且停損極小，具有顯著盈虧比優勢`;
      } else if (curPrice >= ma20) {
        type = '📈 均線回踩·順勢佈局';
        entry = Math.max(ma20, fib382);
        stop = entry - 1.2 * atr14;
        rationale = `短線沿著 20 均線強勢向上發散，預約在 0.382 費氏位或均線支撐點掛單承接`;
      } else {
        type = '⏳ 箱體中繼·耐心等待';
        entry = curPrice * 0.985;
        stop = lLow;
        rationale = `價格位於結構半山腰，拒絕追高，耐心等待拉回頸線或測試底座`;
      }

      const risk = Math.max(curPrice * 0.005, entry - stop);
      const reward = Math.max(curPrice * 0.005, t1 - entry);
      const rr = parseFloat((reward / risk).toFixed(1));

      currentStructure.suggestedEntry = entry;
      currentStructure.suggestedStop = stop;
      currentStructure.strategyType = type;
      currentStructure.rationale = rationale;
      currentStructure.rrRatio = rr;
    }

    // =========================================================================

    function initAppleStyleChart() {

        layout: {

          textColor: '#8e8e93',
          fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif'
        },
        grid: { 
          vertLines: { color: 'rgba(255, 255, 255, 0.04)' }, 
          horzLines: { color: 'rgba(255, 255, 255, 0.04)' } 
        },
        rightPriceScale: { 
          borderColor: 'rgba(255, 255, 255, 0.1)',
          scaleMargins: { top: 0.12, bottom: 0.12 }
        },
        timeScale: { 
          borderColor: 'rgba(255, 255, 255, 0.1)',
          timeVisible: true,
          secondsVisible: false
        },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
      });

      // Apple 配色 (綠漲紅跌)
      candleSeries = chart.addCandlestickSeries({
        upColor: '#30d158',
        downColor: '#ff453a',
        borderVisible: false,
        wickUpColor: '#30d158',
        wickDownColor: '#ff453a'
      });

      // 核心 RWD：使用 ResizeObserver 保證任何螢幕比例下 100% 自適應貼合容器
      const resizeObserver = new ResizeObserver(entries => {
        if (!entries || entries.length === 0) return;
        const { width, height } = entries[0].contentRect;
        if (chart && width > 0 && height > 0) {
          chart.applyOptions({ width, height });
        }
      });
      resizeObserver.observe(box);
    }

    function formatPrice(p) {
      if (p === undefined || p === null || isNaN(p)) return '0.00';
      if (p >= 1000) return p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (p >= 1) return p.toFixed(3);
      return p.toFixed(5);
    }

    function clearLines() {
      activePriceLines.forEach(l => candleSeries.removePriceLine(l));
      activePriceLines = [];
      avgCostLine = null;
    }

    function drawLine(price, color, title, lineStyle = 2) {
      if (!price || isNaN(price) || price <= 0) return null;
      const l = candleSeries.createPriceLine({
        price: parseFloat(price),
        color: color,
        lineWidth: 2,
        lineStyle: lineStyle,
        title: title
      });
      activePriceLines.push(l);
      return l;
    }

    function recalcPortfolioStats() {
      const profile = userProfiles[currentMarket][currentSymbol] || { batches: [] };
      const batches = profile.batches || [];
      const curPrice = currentStructure.currentPrice;

      let totalShares = 0;
      let totalCostSum = 0;

      batches.forEach(b => {
        const c = parseFloat(b.cost) || 0;
        const s = parseFloat(b.shares) || 0;
        totalShares += s;
        totalCostSum += (c * s);
      });

      const avgCost = totalShares > 0 ? (totalCostSum / totalShares) : 0;
      const totalPnl = (curPrice - avgCost) * totalShares;
      const totalPnlPct = avgCost > 0 ? (((curPrice - avgCost) / avgCost) * 100).toFixed(2) : 0;

      const statCost = document.getElementById('stat-avg-cost');
      const statShares = document.getElementById('stat-total-shares');
      const pnlText = document.getElementById('port-pnl-text');
      const statusBadge = document.getElementById('port-status-badge');

      if (statCost) statCost.innerText = `$${formatPrice(avgCost)}`;
      if (statShares) statShares.innerText = `${totalShares}`;

      if (pnlText) {
        pnlText.innerText = `${totalPnl >= 0 ? '+' : ''}${formatPrice(totalPnl)} (${totalPnlPct}%)`;
        pnlText.className = `font-black text-sm ${totalPnl >= 0 ? 'text-apple-green' : 'text-apple-red'}`;
      }
      if (statusBadge) {
        statusBadge.innerText = totalPnl >= 0 ? '獲利中' : '回檔中';
        statusBadge.className = `text-[10px] font-bold px-2 py-0.5 rounded-full ${totalPnl >= 0 ? 'bg-apple-green/20 text-apple-green border border-apple-green/40' : 'bg-apple-red/20 text-apple-red border border-apple-red/40'}`;
      }

      if (avgCost > 0) {
        if (!avgCostLine) avgCostLine = drawLine(avgCost, '#0a84ff', '加權持倉均價', 1);
        else avgCostLine.applyOptions({ price: avgCost });
      }
    }

    async function executeCurrentScreener() {
      const thead = document.getElementById('screener-table-head');
      const tbody = document.getElementById('screener-table-body');
      const title = document.getElementById('screener-title');
      const subtitle = document.getElementById('screener-subtitle');

        subtitle.innerText = `基於當前 ${currentTimeframe} 週期 ATR 波動率與 20 均線偏離幅度，挖掘超跌反彈與突破標的`;

        thead.innerHTML = `
          <tr>
            <th class="py-3 px-4">交易對</th>
            <th class="py-3 px-4">現價 (USDT)</th>
            <th class="py-3 px-4">ATR 波動率</th>
            <th class="py-3 px-4">20均線乖離</th>
            <th class="py-3 px-4 text-center">動作</th>
          </tr>
        `;
        tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-apple-blue font-bold animate-pulse">⚡ 正在連線幣安計算即時數據...</td></tr>`;

        const rows = [];
        for (let sym of Object.keys(CRYPTO_UNIVERSE)) {
          try {
            const data = await fetchKlinesData('CRYPTO', sym, currentTimeframe);
            if (data.length >= 20) {
              const cur = data[data.length - 1].close;
              const ma20 = data.slice(-20).reduce((s, k) => s + k.close, 0) / 20;
              const bias = ((cur - ma20) / ma20) * 100;
              let tr = 0;
              for (let i = data.length - 14; i < data.length; i++) {
                tr += Math.max(data[i].high - data[i].low, Math.abs(data[i].high - data[i-1].close));
              }
              const atrPct = ((tr / 14) / cur) * 100;
              rows.push({ sym, cur, atrPct, bias });
            }
          } catch (e) {}
        }
        rows.sort((a, b) => b.atrPct - a.atrPct);

        tbody.innerHTML = rows.map(r => `
          <tr class="hover:bg-white/5 transition">
            <td class="py-3 px-4 font-black text-white">${r.sym}</td>
            <td class="py-3 px-4 text-apple-gray font-bold">$${formatPrice(r.cur)}</td>
            <td class="py-3 px-4 text-apple-green font-bold">${r.atrPct.toFixed(2)}%</td>
            <td class="py-3 px-4 ${r.bias >= 0 ? 'text-apple-green' : 'text-apple-red'} font-bold">${r.bias >= 0 ? '+' : ''}${r.bias.toFixed(2)}%</td>
            <td class="py-3 px-4 text-center">
              <button onclick="switchAsset('${r.sym}'); setDashboardTab('HUNTER');" class="bg-apple-blue text-white text-xs font-bold px-3 py-1 rounded-lg">帶入看圖</button>
            </td>
          </tr>
        `).join('');
      } else {
        title.innerHTML = `<span>📊</span> <span>台股極致低估值價值雷達</span>`;
        subtitle.innerText = `篩選準則：最新收盤價 ≦ $50.00 且 股價淨值比 (PBR) ≦ 0.85 倍`;

        thead.innerHTML = `
          <tr>
            <th class="py-3 px-4">代號</th>
            <th class="py-3 px-4">名稱</th>
            <th class="py-3 px-4">收盤價</th>
            <th class="py-3 px-4">每股淨值 (NAV)</th>
            <th class="py-3 px-4">即時淨值比 (PBR)</th>
            <th class="py-3 px-4 text-center">動作</th>
          </tr>
        `;
        tbody.innerHTML = `<tr><td colspan="6" class="py-12 text-center text-apple-blue font-bold animate-pulse">⏳ 正在運算台股每股淨值與最新報價...</td></tr>`;

        const rows = [];
        for (let item of TW_VALUE_CORE) {
          try {
            const data = await fetchKlinesData('TW', item.code, 'D');
            const cur = data[data.length - 1].close;
            const pbr = (cur / item.nav);
            rows.push({ ...item, cur, pbr });
          } catch (e) {}
        }

        tbody.innerHTML = rows.map(r => `
          <tr class="hover:bg-white/5 transition">
            <td class="py-3 px-4 font-black text-white">${r.code}</td>
            <td class="py-3 px-4 text-white">${r.name}</td>
            <td class="py-3 px-4 text-apple-red font-bold">$${r.cur.toFixed(2)}</td>
            <td class="py-3 px-4 text-apple-gray font-bold">$${r.nav.toFixed(2)}</td>
            <td class="py-3 px-4">
              <span class="bg-apple-green/20 text-apple-green px-2 py-0.5 rounded-md font-bold text-xs">
                ${r.pbr.toFixed(2)} 倍
              </span>
            </td>
            <td class="py-3 px-4 text-center">
              <button onclick="TW_UNIVERSE['${r.code}'] = '${r.name}'; renderAssetSelect(); switchAsset('${r.code}'); setDashboardTab('HUNTER');" class="bg-apple-blue text-white text-xs font-bold px-3 py-1 rounded-lg">帶入看圖</button>
            </td>
          </tr>
        `).join('');
      }
    }

    // =========================================================================
    // 模態彈窗控制
    // =========================================================================
    function openAddModal() {
      document.getElementById('modal-title').innerText = (currentMarket === 'CRYPTO') ? '加入加密貨幣標的' : '加入台股標的';
      document.getElementById('input-asset-code').value = '';
      document.getElementById('modal-add-asset').classList.remove('hidden');
    }
    function closeAddModal() {
      document.getElementById('modal-add-asset').classList.add('hidden');
    }
    function confirmAddAsset() {
      let code = document.getElementById('input-asset-code').value.trim().toUpperCase();
      if (!code) return;

      if (currentMarket === 'CRYPTO') {
        if (!code.endsWith('USDT')) code += 'USDT';
        CRYPTO_UNIVERSE[code] = code;
      } else {
        TW_UNIVERSE[code] = code;
      }

      renderAssetSelect();
      switchAsset(code);
      closeAddModal();
    }

    // =========================================================================
    // 啟動入口：直接加載比特幣 (BTC/USDT) 1小時 K 線圖
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      initAppleStyleChart();
      renderTimeframeButtons();
      renderAssetSelect();
      loadActiveAsset();
    });
  </script>
</body>
</html>
