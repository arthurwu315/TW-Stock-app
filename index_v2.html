<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>多批次波段決策終端 (手機大字優化版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body {
      background-color: #0b0e14;
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    /* 防止 iOS Safari 點擊輸入框時自動縮放畫面 */
    @media screen and (max-width: 768px) {
      input, select { font-size: 16px !important; }
    }
    /* 自訂平滑滾動條 */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen md:h-screen w-screen overflow-x-hidden md:overflow-hidden p-2.5 sm:p-3 md:p-4 flex flex-col justify-between gap-2.5 md:gap-3">

  <!-- 頂部操控列 -->
  <header class="w-full bg-gray-900/90 border border-gray-800 rounded-2xl px-3 py-2.5 flex flex-wrap items-center justify-between gap-2.5 shrink-0">
    <div class="flex items-center gap-2">
      <span class="text-base sm:text-lg font-black text-white tracking-wide flex items-center gap-1.5">
        ⚡ 波段決策終端
      </span>
      
      <!-- 核心雙模式切換 -->
      <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 text-xs sm:text-sm font-bold gap-1">
        <button onclick="setDashboardMode('HUNTER')" id="tab-HUNTER" class="px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition flex items-center gap-1">
          <span>🎯</span> <span>自動選股</span>
        </button>
        <button onclick="setDashboardMode('PORTFOLIO')" id="tab-PORTFOLIO" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white transition flex items-center gap-1">
          <span>💼</span> <span>持倉簿記</span>
        </button>
      </div>
    </div>

    <!-- 股票選擇與時框 -->
    <div class="flex items-center gap-2">
      <select id="stock-select" onchange="switchStock(this.value)" class="bg-gray-800 border border-gray-700 text-white text-xs sm:text-sm rounded-xl px-2.5 py-1.5 font-bold focus:outline-none">
      </select>

      <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 text-xs font-bold gap-0.5">
        <button onclick="setTimeframe('D')" id="tf-D" class="px-2 py-1 rounded-lg bg-blue-600 text-white transition">日</button>
        <button onclick="setTimeframe('W')" id="tf-W" class="px-2 py-1 rounded-lg text-gray-400 hover:text-white transition">週</button>
        <button onclick="setTimeframe('M')" id="tf-M" class="px-2 py-1 rounded-lg text-gray-400 hover:text-white transition">月</button>
      </div>

      <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl transition shadow flex items-center gap-1">
        <span>＋</span> <span>自選</span>
      </button>
    </div>
  </header>

  <!-- 主工作區 -->
  <main class="w-full flex-1 grid grid-cols-1 md:grid-cols-12 gap-2.5 md:gap-3 min-h-0">
    
    <!-- 左側 K 線圖表 -->
    <section class="md:col-span-7 lg:col-span-8 xl:col-span-8 bg-gray-900 border border-gray-800 rounded-2xl p-3 flex flex-col justify-between min-h-[360px] md:min-h-0">
      <div class="flex flex-wrap justify-between items-center text-xs sm:text-sm pb-2 border-b border-gray-800/80 gap-2 shrink-0">
        <div class="flex items-center gap-2">
          <span id="chart-info" class="font-bold text-white tracking-wide">連線中...</span>
          <button id="btn-chart-toggle" onclick="toggleChartDisplay()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-lg text-xs font-semibold border border-gray-700">
            👁️ <span id="btn-chart-toggle-text">隱藏</span>
          </button>
          <div class="flex items-center gap-1.5 bg-gray-950 px-2 py-1 rounded-lg border border-gray-800 text-xs">
            <span class="text-gray-400">透明度</span>
            <input type="range" min="10" max="100" value="100" oninput="changeChartOpacity(this.value)" class="w-14 sm:w-16 h-1.5 accent-blue-500 cursor-pointer" />
            <span id="chart-opacity-val" class="text-gray-400 w-7 text-right">100%</span>
          </div>
        </div>

        <div id="dynamic-legend" class="flex flex-wrap gap-2 text-xs font-semibold"></div>
      </div>

      <div id="chart-box" class="w-full flex-1 min-h-[300px] md:min-h-0 mt-1.5 rounded-xl overflow-hidden transition-opacity duration-150"></div>
      
      <div id="chart-hidden-placeholder" class="hidden w-full flex-1 flex flex-col items-center justify-center text-gray-500 gap-2 border border-dashed border-gray-800 py-12">
        <span class="text-3xl">👁️‍🗨️</span>
        <span class="text-sm">線圖已隱藏 · 專注水位決策</span>
      </div>
    </section>

    <!-- 右側 雙模動態操作面板 -->
    <section class="md:col-span-5 lg:col-span-4 xl:col-span-4 bg-gray-900 border border-gray-800 rounded-2xl p-3 sm:p-4 flex flex-col justify-between gap-3 overflow-y-auto">
      <div id="panel-content-container" class="space-y-3"></div>
      <div id="hud-bottom-card" class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/60 text-xs sm:text-sm space-y-1.5 mt-1"></div>
    </section>
  </main>

  <!-- 自訂股票彈窗 -->
  <div id="modal-custom" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-900 border border-gray-800 w-full max-w-xs p-5 rounded-2xl space-y-3.5 shadow-2xl">
      <h3 class="text-base font-black text-white">加入監控池</h3>
      <div class="space-y-2.5 text-xs sm:text-sm">
        <div>
          <label class="block text-gray-400 mb-1 font-semibold">台股代號</label>
          <input id="custom-code" type="text" placeholder="例: 2454" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-white uppercase outline-none focus:border-blue-500 font-bold" />
        </div>
        <div>
          <label class="block text-gray-400 mb-1 font-semibold">股票名稱</label>
          <input id="custom-name" type="text" placeholder="例: 聯發科" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-white outline-none focus:border-blue-500 font-bold" />
        </div>
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="closeModal()" class="flex-1 py-2 text-xs sm:text-sm text-gray-400 bg-gray-800 rounded-xl font-bold">取消</button>
        <button onclick="confirmCustomStock()" class="flex-1 py-2 text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold">加入</button>
      </div>
    </div>
  </div>

  <script>
    const defaultLedgerProfiles = {
      '9945': {
        name: '潤泰新',
        batches: [
          { id: 'b_1', cost: 26.1, shares: 63818, tag: '核心倉' }
        ]
      },
      '2330': {
        name: '台積電',
        batches: [
          { id: 'b_2', cost: 980.0, shares: 1000, tag: '波段倉' }
        ]
      },
      '2603': {
        name: '長榮',
        batches: []
      },
      '2317': {
        name: '鴻海',
        batches: []
      },
      '3231': {
        name: '緯創',
        batches: []
      }
    };

    const STORAGE_KEY = 'macro_trader_multi_batches_v2';
    let stockProfiles = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultLedgerProfiles;
    let currentCode = '9945';
    let currentDashboardMode = 'PORTFOLIO';

    let rawDailyKlines = [];
    let currentTimeframe = 'D';
    let chart, candleSeries;
    let activePriceLines = [];
    let avgCostLine = null;
    let isChartHidden = false;

    let scannedOpportunities = [];
    let isScanning = false;

    let currentStockStructure = {
      currentPrice: 0,
      macroLow: 0,
      macroHigh: 0,
      localLow: 0,
      boxH: 0,
      t1: 0,
      t2: 0,
      strategyType: '',
      suggestedEntry: 0,
      suggestedStop: 0,
      rrRatio: 0
    };

    function initChart() {
      const box = document.getElementById('chart-box');
      chart = LightweightCharts.createChart(box, {
        width: box.clientWidth,
        height: box.clientHeight || 400,
        layout: { background: { color: '#0b0e14' }, textColor: '#64748b' },
        grid: { vertLines: { color: '#161e2e' }, horzLines: { color: '#161e2e' } },
        rightPriceScale: { borderColor: '#334155' },
        timeScale: { borderColor: '#334155' },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#ef4444', downColor: '#22c55e', borderVisible: false,
        wickUpColor: '#ef4444', wickDownColor: '#22c55e'
      });

      window.addEventListener('resize', () => {
        if (chart && box && !isChartHidden) {
          chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
        }
      });
    }

    function changeChartOpacity(val) {
      document.getElementById('chart-box').style.opacity = val / 100;
      document.getElementById('chart-opacity-val').innerText = `${val}%`;
    }

    function toggleChartDisplay() {
      isChartHidden = !isChartHidden;
      const box = document.getElementById('chart-box');
      const placeholder = document.getElementById('chart-hidden-placeholder');
      const btnText = document.getElementById('btn-chart-toggle-text');

      if (isChartHidden) {
        box.classList.add('hidden');
        placeholder.classList.remove('hidden');
        btnText.innerText = '顯示';
      } else {
        box.classList.remove('hidden');
        placeholder.classList.add('hidden');
        btnText.innerText = '隱藏';
        if (chart && box) chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
      }
    }

    function setDashboardMode(mode) {
      currentDashboardMode = mode;
      document.getElementById('tab-HUNTER').className = (mode === 'HUNTER')
        ? 'px-3 py-1.5 rounded-lg bg-blue-600 text-white transition flex items-center gap-1 font-bold'
        : 'px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition flex items-center gap-1 font-bold';
      document.getElementById('tab-PORTFOLIO').className = (mode === 'PORTFOLIO')
        ? 'px-3 py-1.5 rounded-lg bg-blue-600 text-white transition flex items-center gap-1 font-bold'
        : 'px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition flex items-center gap-1 font-bold';
      
      renderModeUI();
    }

    async function loadStock(code) {
      currentCode = code;
      if (!stockProfiles[code]) {
        stockProfiles[code] = { name: code, batches: [] };
      }
      const profile = stockProfiles[code];
      document.getElementById('chart-info').innerText = `正在讀取 ${code} ${profile.name} ...`;

      const select = document.getElementById('stock-select');
      if (select && select.value !== code) select.value = code;

      const startDate = new Date();
      startDate.setDate(startDate.getDate() - 750);
      const startStr = startDate.toISOString().split('T')[0];
      const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startStr}`;

      try {
        const res = await fetch(url);
        const json = await res.json();
        if (!json.data || json.data.length === 0) throw new Error('無數據');

        rawDailyKlines = json.data.map(d => ({
          time: d.date, open: d.open, high: d.max, low: d.min, close: d.close
        }));

        currentStockStructure.currentPrice = rawDailyKlines[rawDailyKlines.length - 1].close;

        analyzeStockStructure(rawDailyKlines);
        renderActiveTimeframe();
        renderModeUI();

        if (scannedOpportunities.length === 0) {
          runFullAutoScanner();
        }

        setTimeout(() => {
          const box = document.getElementById('chart-box');
          if (!isChartHidden) chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
        }, 100);
      } catch (err) {
        document.getElementById('chart-info').innerText = `${code} 載入失敗`;
      }
    }

    function analyzeStockStructure(klines) {
      if (klines.length < 60) return;

      const macroLookback = klines.slice(-150);
      const mLow = Math.min(...macroLookback.map(k => k.low));
      const mHigh = Math.max(...macroLookback.map(k => k.high));

      const localSlice = klines.slice(-25);
      const lLow = Math.min(...localSlice.map(k => k.low));

      const curPrice = klines[klines.length - 1].close;
      const boxH = mHigh - mLow;
      const t1 = parseFloat((mHigh + boxH).toFixed(2));
      const t2 = parseFloat((t1 + (t1 - mLow)).toFixed(2));

      currentStockStructure.macroLow = parseFloat(mLow.toFixed(2));
      currentStockStructure.macroHigh = parseFloat(mHigh.toFixed(2));
      currentStockStructure.localLow = parseFloat(lLow.toFixed(2));
      currentStockStructure.boxH = parseFloat(boxH.toFixed(2));
      currentStockStructure.t1 = t1;
      currentStockStructure.t2 = t2;

      if (curPrice <= lLow * 1.035) {
        currentStockStructure.strategyType = '🛡️ 底座埋伏點 (極小停損)';
        currentStockStructure.suggestedEntry = parseFloat((lLow * 1.01).toFixed(2));
        currentStockStructure.suggestedStop = parseFloat((lLow * 0.985).toFixed(2));
      } else if (curPrice >= mHigh * 0.965 && curPrice < mHigh * 1.01) {
        currentStockStructure.strategyType = '🚀 頸線突破買點 (動能主升)';
        currentStockStructure.suggestedEntry = mHigh;
        currentStockStructure.suggestedStop = parseFloat((mHigh * 0.97).toFixed(2));
      } else if (curPrice >= mHigh && curPrice <= mHigh * 1.06) {
        currentStockStructure.strategyType = '🔄 回踩支撐接力點 (S/R Flip)';
        currentStockStructure.suggestedEntry = mHigh;
        currentStockStructure.suggestedStop = parseFloat((mHigh * 0.975).toFixed(2));
      } else {
        currentStockStructure.strategyType = '📈 波段常態切入點';
        currentStockStructure.suggestedEntry = curPrice;
        currentStockStructure.suggestedStop = parseFloat((lLow * 0.99).toFixed(2));
      }

      const risk = Math.max(0.1, currentStockStructure.suggestedEntry - currentStockStructure.suggestedStop);
      const reward = Math.max(0.1, t1 - currentStockStructure.suggestedEntry);
      currentStockStructure.rrRatio = (reward / risk).toFixed(1);
    }

    // 核心修復：掃描器永遠保留完整池子，絕不讓任何股票消失
    async function runFullAutoScanner() {
      if (isScanning) return;
      isScanning = true;
      const btn = document.getElementById('btn-run-scan');
      if (btn) btn.innerText = '⚡ 掃描中...';

      const poolCodes = Object.keys(stockProfiles);
      const startDate = new Date();
      startDate.setDate(startDate.getDate() - 250);
      const startStr = startDate.toISOString().split('T')[0];

      const promises = poolCodes.map(code => {
        const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startStr}`;
        return fetch(url).then(r => r.json()).then(res => ({ code, data: res.data || [] })).catch(() => ({ code, data: [] }));
      });

      const results = await Promise.allSettled(promises);
      const opportunities = [];

      results.forEach(res => {
        const code = res.value ? res.value.code : null;
        if (!code) return;
        const klines = res.value.data || [];

        if (klines.length > 30) {
          const curClose = klines[klines.length - 1].close;
          const lookback = klines.slice(-120);
          const mLow = Math.min(...lookback.map(k => k.low));
          const mHigh = Math.max(...lookback.map(k => k.high));
          const lLow = Math.min(...klines.slice(-20).map(k => k.low));

          const boxH = mHigh - mLow;
          const t1 = parseFloat((mHigh + boxH).toFixed(2));
          const t2 = parseFloat((t1 + (t1 - mLow)).toFixed(2));

          let entry = curClose;
          let stop = parseFloat((lLow * 0.985).toFixed(2));
          let tag = '常態追蹤';
          let priority = 1;

          if (curClose <= lLow * 1.03) {
            entry = parseFloat((lLow * 1.01).toFixed(2));
            stop = parseFloat((lLow * 0.985).toFixed(2));
            tag = '🛡️ 底座埋伏 (極高盈虧比)';
            priority = 3;
          } else if (curClose >= mHigh * 0.97 && curClose <= mHigh * 1.01) {
            entry = mHigh;
            stop = parseFloat((mHigh * 0.97).toFixed(2));
            tag = '🚀 頸線待突破 (即將發動)';
            priority = 4;
          } else if (curClose > mHigh && curClose <= mHigh * 1.05) {
            entry = mHigh;
            stop = parseFloat((mHigh * 0.975).toFixed(2));
            tag = '⚡ 回踩支撐 (最佳二次買點)';
            priority = 5;
          }

          const risk = Math.max(0.1, entry - stop);
          const reward = Math.max(0.1, t1 - entry);
          const rr = parseFloat((reward / risk).toFixed(1));

          opportunities.push({
            code,
            name: stockProfiles[code].name,
            currentPrice: curClose,
            entry,
            stop,
            t1,
            t2,
            rr,
            tag,
            priority,
            score: priority * 10 + rr
          });
        } else {
          // 網路偶爾卡頓或數據少時，依然保留該檔股票！絕不消失！
          opportunities.push({
            code,
            name: stockProfiles[code].name,
            currentPrice: 0,
            entry: 0,
            stop: 0,
            t1: 0,
            t2: 0,
            rr: 0,
            tag: '⏳ 資料讀取中',
            priority: 0,
            score: 0
          });
        }
      });

      opportunities.sort((a, b) => b.score - a.score);
      scannedOpportunities = opportunities;
      isScanning = false;

      if (currentDashboardMode === 'HUNTER') {
        renderHunterMode();
      }
    }

    function clearPriceLines() {
      activePriceLines.forEach(l => candleSeries.removePriceLine(l));
      activePriceLines = [];
      avgCostLine = null;
    }

    function addLine(price, color, title, lineStyle = 2, lineWidth = 2) {
      if (!price || isNaN(price) || price <= 0) return null;
      const l = candleSeries.createPriceLine({
        price: parseFloat(price), color, lineWidth, lineStyle, title
      });
      activePriceLines.push(l);
      return l;
    }

    function renderModeUI() {
      clearPriceLines();
      if (currentDashboardMode === 'HUNTER') {
        renderHunterMode();
      } else {
        renderPortfolioMode();
      }
    }

    // ==============================================================
    // 視圖 1：【自動選股獵人模式】(大字排版、高辨識度)
    // ==============================================================
    function renderHunterMode() {
      clearPriceLines();
      const container = document.getElementById('panel-content-container');
      const legend = document.getElementById('dynamic-legend');
      const hud = document.getElementById('hud-bottom-card');

      const entry = currentStockStructure.suggestedEntry;
      const stop = currentStockStructure.suggestedStop;
      const t1 = currentStockStructure.t1;
      const t2 = currentStockStructure.t2;

      addLine(entry, '#c084fc', '👉【建議買點】', 0, 2);
      addLine(stop, '#ef4444', '🛑【結構停損】', 0, 2);
      addLine(t1, '#10b981', '🎯【T1首波目標】', 2, 2);
      addLine(t2, '#f59e0b', '🏆【T2二次翻倍】', 2, 2);

      legend.innerHTML = `
        <span class="text-purple-400 font-bold">● 建議買點</span>
        <span class="text-red-400 font-bold">● 結構停損</span>
        <span class="text-emerald-400 font-bold">● T1目標</span>
        <span class="text-amber-400 font-bold">● T2二次翻倍</span>
      `;

      let scannerListHtml = scannedOpportunities.map((opp, idx) => `
        <div onclick="switchStock('${opp.code}')" class="p-3 rounded-xl cursor-pointer transition flex items-center justify-between border ${opp.code === currentCode ? 'bg-blue-950/40 border-blue-600 shadow-md' : 'bg-gray-800/40 border-gray-800 hover:bg-gray-800/80'}">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-black px-1.5 py-0.5 rounded ${idx === 0 ? 'bg-amber-500 text-black' : 'bg-gray-700 text-gray-300'}">#${idx + 1}</span>
              <span class="font-black text-white text-sm sm:text-base">${opp.code} ${opp.name}</span>
              <span class="text-xs text-purple-300 font-semibold bg-purple-950/60 px-1.5 py-0.5 rounded border border-purple-800/50">${opp.tag.split(' ')[0]}</span>
            </div>
            <div class="text-xs text-gray-400 mt-1">
              現價: $${opp.currentPrice > 0 ? opp.currentPrice.toFixed(2) : '--'} | 買點: <b class="text-purple-300">$${opp.entry > 0 ? opp.entry : '--'}</b>
            </div>
          </div>
          <div class="text-right">
            <span class="text-xs bg-emerald-950 text-emerald-300 px-2 py-1 rounded-lg font-mono font-bold block border border-emerald-800">
              R:R 1 : ${opp.rr > 0 ? opp.rr : '--'}
            </span>
            <span class="text-xs text-emerald-400 block mt-1 font-semibold">T1 $${opp.t1 > 0 ? opp.t1 : '--'}</span>
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="bg-purple-950/20 border-2 border-purple-500/70 p-3.5 rounded-2xl space-y-2.5 text-xs sm:text-sm">
          <div class="flex justify-between items-center">
            <span class="font-black text-white text-sm sm:text-base flex items-center gap-1.5">
              <span>🎯</span> <span>${currentCode} ${stockProfiles[currentCode].name} 自動進場指引</span>
            </span>
            <span class="text-xs bg-purple-900 text-purple-200 px-2 py-0.5 rounded-md font-bold">
              ${currentStockStructure.strategyType.split(' ')[0]}
            </span>
          </div>

          <div class="grid grid-cols-2 gap-2.5 pt-1 border-t border-purple-900/60">
            <div class="bg-gray-900/90 p-2.5 rounded-xl border border-purple-800/50">
              <span class="text-purple-300 text-xs block font-bold">👉 建議進場點 (圖上紫線)</span>
              <span class="text-white font-black text-base sm:text-lg font-mono mt-0.5 block">$${entry}</span>
              <span class="text-xs text-gray-400 block mt-0.5">帶量實體站上即切入</span>
            </div>
            <div class="bg-gray-900/90 p-2.5 rounded-xl border border-red-800/50">
              <span class="text-red-300 text-xs block font-bold">🛑 結構停損點 (圖上紅線)</span>
              <span class="text-red-400 font-black text-base sm:text-lg font-mono mt-0.5 block">$${stop}</span>
              <span class="text-xs text-gray-400 block mt-0.5">實體收破此線立即砍倉</span>
            </div>
          </div>

          <div class="pt-1">
            <button onclick="addBatchFromHunter()" class="w-full py-2.5 text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 active:scale-98 text-white rounded-xl font-bold transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-1.5">
              <span>💼</span> <span>將此進場點加入持倉簿記</span>
            </button>
          </div>
        </div>

        <div class="space-y-2 text-xs sm:text-sm">
          <div class="flex justify-between items-center border-b border-gray-800 pb-1.5">
            <span class="font-bold text-gray-300 text-xs sm:text-sm flex items-center gap-1">
              ⚡ 潛力雷達排行 (${scannedOpportunities.length} 檔全部在列)
            </span>
            <button id="btn-run-scan" onclick="runFullAutoScanner()" class="text-xs text-blue-400 hover:text-blue-300 font-bold py-0.5 px-2 rounded-lg bg-blue-950/40 border border-blue-900">
              🔄 重新掃描
            </button>
          </div>
          <div class="space-y-1.5 max-h-[220px] overflow-y-auto pr-0.5">
            ${scannerListHtml || '<div class="text-gray-500 text-center py-6">雷達連線演算中...</div>'}
          </div>
        </div>
      `;

      hud.innerHTML = `
        <div class="text-gray-400 font-bold text-xs border-b border-gray-700/60 pb-1 flex justify-between">
          <span>進場結構指標 (${currentCode})</span>
          <span class="text-emerald-400 font-bold font-mono">盈虧比 1 : ${currentStockStructure.rrRatio}</span>
        </div>
        <div class="flex justify-between text-gray-300 text-xs sm:text-sm">
          <span>首波 T1 目標滿足價：</span>
          <span class="text-emerald-400 font-mono font-bold">$${t1} (+${(((t1 - entry) / entry) * 100).toFixed(1)}%)</span>
        </div>
        <div class="flex justify-between text-gray-300 text-xs sm:text-sm">
          <span>二次翻亞當 T2 目標：</span>
          <span class="text-amber-400 font-mono font-bold">$${t2} (+${(((t2 - entry) / entry) * 100).toFixed(1)}%)</span>
        </div>
      `;
    }

    // ==============================================================
    // 視圖 2：【持倉簿記模式】(大字排版、清晰損益、獨立增刪)
    // ==============================================================
    function renderPortfolioMode() {
      clearPriceLines();
      const container = document.getElementById('panel-content-container');
      const legend = document.getElementById('dynamic-legend');
      const profile = stockProfiles[currentCode] || { name: currentCode, batches: [] };

      const stop = currentStockStructure.localLow;
      const t1 = currentStockStructure.t1;
      const t2 = currentStockStructure.t2;
      const b2Trigger = currentStockStructure.macroHigh;

      addLine(stop, '#ef4444', '【底座防守】', 0, 2);
      addLine(b2Trigger, '#c084fc', '👉【B2加碼點】', 0, 2);
      addLine(t1, '#10b981', '【T1首波目標】', 2, 2);
      addLine(t2, '#f59e0b', '【T2二次亞當】', 2, 2);

      legend.innerHTML = `
        <span class="text-blue-400 font-bold">● 加權均價</span>
        <span class="text-red-400 font-bold">● 底座防守</span>
        <span class="text-purple-400 font-bold">● B2加碼點</span>
        <span class="text-emerald-400 font-bold">● T1目標</span>
        <span class="text-amber-400 font-bold">● T2目標</span>
      `;

      // 庫存切換膠囊
      const holdingCodes = Object.keys(stockProfiles).filter(c => (stockProfiles[c].batches || []).length > 0);
      const positionTabsHtml = holdingCodes.map(c => {
        const totalS = stockProfiles[c].batches.reduce((sum, b) => sum + (parseInt(b.shares) || 0), 0);
        return `
          <button onclick="switchStock('${c}')" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition shrink-0 flex items-center gap-1.5 border ${c === currentCode ? 'bg-blue-600 border-blue-500 text-white shadow-md' : 'bg-gray-800/80 border-gray-700 text-gray-300 hover:text-white'}">
            <span>${c} ${stockProfiles[c].name}</span>
            <span class="text-xs opacity-90 font-mono">(${(totalS / 1000).toFixed(1)}張)</span>
          </button>
        `;
      }).join('');

      // 生成每筆批次明細 (大字排版 + 易按刪除鈕)
      const batches = profile.batches || [];
      const batchListHtml = batches.map((batch, idx) => `
        <div id="batch-row-${batch.id}" class="bg-gray-800/50 p-2.5 rounded-xl border border-gray-700/60 flex items-center gap-2 text-xs sm:text-sm">
          <span class="text-xs font-mono font-bold text-gray-400 shrink-0 w-6">#${idx + 1}</span>
          
          <!-- 買入價格 -->
          <div class="flex-1">
            <label class="text-xs text-gray-400 block mb-0.5 font-semibold">成本價</label>
            <input type="number" step="any" inputmode="decimal" value="${batch.cost}" 
                   oninput="updateBatchRow('${batch.id}', 'cost', this.value)" 
                   class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-white font-mono font-bold text-sm outline-none focus:border-blue-500" />
          </div>

          <!-- 買入股數 -->
          <div class="flex-1">
            <label class="text-xs text-gray-400 block mb-0.5 font-semibold">持有股數</label>
            <input type="number" step="100" value="${batch.shares}" 
                   oninput="updateBatchRow('${batch.id}', 'shares', this.value)" 
                   class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-white font-mono font-bold text-sm outline-none focus:border-blue-500" />
          </div>

          <!-- 單批損益狀態 -->
          <div class="w-20 text-right shrink-0">
            <label class="text-xs text-gray-400 block mb-0.5 font-semibold">損益</label>
            <span id="batch-pnl-${batch.id}" class="font-mono text-xs sm:text-sm font-bold block">--</span>
          </div>

          <!-- 刪除批次按鈕 -->
          <button onclick="removeBatch('${batch.id}')" title="刪除此筆批次" class="text-gray-400 hover:text-red-400 p-2 rounded-lg transition shrink-0 font-bold text-sm">
            ✕
          </button>
        </div>
      `).join('');

      container.innerHTML = `
        <!-- 頂部庫存切換 -->
        <div class="bg-gray-950/80 p-2.5 rounded-2xl border border-gray-800 space-y-2">
          <div class="flex justify-between items-center text-xs sm:text-sm">
            <span class="text-gray-400 font-bold flex items-center gap-1.5">
              💼 我的庫存股票 (${holdingCodes.length} 檔)
            </span>
            <span class="text-xs text-gray-500">點擊即時切換</span>
          </div>
          <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
            ${positionTabsHtml || '<span class="text-gray-500 text-xs">尚無持倉</span>'}
          </div>
        </div>

        <!-- 總持倉加權統計看板 (大字清晰) -->
        <div class="bg-blue-950/20 border border-blue-800/60 p-3.5 rounded-2xl space-y-2.5 text-xs sm:text-sm">
          <div class="flex justify-between items-center">
            <span class="font-black text-white text-base sm:text-lg">${currentCode} ${profile.name} 總持倉結算</span>
            <span id="port-status-pill" class="text-xs font-bold px-2 py-0.5 rounded-md">
              --
            </span>
          </div>

          <div class="grid grid-cols-2 gap-2.5 mt-1">
            <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-700/60">
              <span class="text-gray-400 block text-xs mb-0.5 font-semibold">加權平均成本</span>
              <span id="stat-avg-cost" class="font-mono font-black text-white text-base sm:text-lg">$0.00</span>
            </div>
            <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-700/60">
              <span class="text-gray-400 block text-xs mb-0.5 font-semibold">總持股數 (合計)</span>
              <span id="stat-total-shares" class="font-mono font-black text-white text-base sm:text-lg">0 股</span>
            </div>
          </div>

          <div class="flex justify-between items-center pt-2 border-t border-blue-900/60 text-xs sm:text-sm">
            <span class="text-gray-300 font-semibold">目前總帳面損益：</span>
            <span id="port-pnl-label" class="font-mono font-bold text-sm sm:text-base">
              -- 元 (--%)
            </span>
          </div>
        </div>

        <!-- 批次明細帳 (自由增刪) -->
        <div class="bg-gray-900/90 border border-gray-800 p-3 rounded-2xl space-y-2.5 text-xs sm:text-sm">
          <div class="flex justify-between items-center border-b border-gray-800 pb-2">
            <span class="font-bold text-gray-200 text-xs sm:text-sm flex items-center gap-1.5">
              📋 獨立買進批次明細 (<span id="batch-count-label" class="text-blue-400">${batches.length}</span> 筆)
            </span>
            <button onclick="addNewBatch()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl transition shadow flex items-center gap-1">
              <span>＋</span> <span>新增批次</span>
            </button>
          </div>

          <!-- 批次清單容器 -->
          <div id="batch-list-container" class="space-y-2 max-h-[190px] overflow-y-auto pr-0.5">
            ${batchListHtml || '<div class="text-gray-500 text-center py-4 text-xs">尚無買進批次，點擊「＋ 新增批次」開始記帳</div>'}
          </div>
        </div>

        <!-- T1 與 T2 獲利預估 (雙指標標示) -->
        <div class="space-y-2 text-xs sm:text-sm">
          <div class="bg-emerald-950/20 border border-emerald-800/40 p-2.5 rounded-xl flex justify-between items-center">
            <div>
              <div id="port-t1-title" class="text-emerald-400 font-bold text-xs">🎯 T1 建議收割 60%</div>
              <div class="text-emerald-300 font-black text-sm sm:text-base font-mono">$${t1}</div>
            </div>
            <div class="text-right">
              <div id="port-t1-money" class="text-emerald-400 font-bold font-mono text-sm sm:text-base">+-- 元</div>
              <div id="port-t1-pct" class="text-emerald-400/90 font-semibold text-xs font-mono">(+--%)</div>
            </div>
          </div>

          <div class="bg-amber-950/20 border border-amber-800/40 p-2.5 rounded-xl flex justify-between items-center">
            <div>
              <div id="port-t2-title" class="text-amber-400 font-bold text-xs">🏆 T2 奔跑 40%</div>
              <div class="text-amber-300 font-black text-sm sm:text-base font-mono">$${t2}</div>
            </div>
            <div class="text-right">
              <div id="port-t2-money" class="text-amber-400 font-bold font-mono text-sm sm:text-base">+-- 元</div>
              <div id="port-t2-pct" class="text-amber-400/90 font-semibold text-xs font-mono">(+--%)</div>
            </div>
          </div>
        </div>
      `;

      recalcPortfolioAggregates();
    }

    function addNewBatch() {
      const profile = stockProfiles[currentCode];
      if (!profile.batches) profile.batches = [];

      const defaultPrice = profile.batches.length > 0 
        ? profile.batches[profile.batches.length - 1].cost 
        : currentStockStructure.currentPrice;

      const newId = 'b_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      profile.batches.push({
        id: newId,
        cost: defaultPrice,
        shares: 10000,
        tag: '加碼批次'
      });

      saveProfiles();
      renderPortfolioMode();
    }

    function addBatchFromHunter() {
      const profile = stockProfiles[currentCode];
      if (!profile.batches) profile.batches = [];

      const newId = 'b_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      profile.batches.push({
        id: newId,
        cost: currentStockStructure.suggestedEntry,
        shares: 5000,
        tag: '雷達切入'
      });

      saveProfiles();
      setDashboardMode('PORTFOLIO');
    }

    function removeBatch(batchId) {
      const profile = stockProfiles[currentCode];
      if (!profile || !profile.batches) return;

      profile.batches = profile.batches.filter(b => b.id !== batchId);
      saveProfiles();
      renderPortfolioMode();
    }

    function updateBatchRow(batchId, field, val) {
      const profile = stockProfiles[currentCode];
      if (!profile || !profile.batches) return;

      const target = profile.batches.find(b => b.id === batchId);
      if (!target) return;

      const numVal = parseFloat(val);
      if (!isNaN(numVal)) {
        target[field] = numVal;
        saveProfiles();
        recalcPortfolioAggregates();
      }
    }

    function recalcPortfolioAggregates() {
      const profile = stockProfiles[currentCode];
      const batches = profile.batches || [];
      const curPrice = currentStockStructure.currentPrice;
      const t1 = currentStockStructure.t1;
      const t2 = currentStockStructure.t2;
      const stop = currentStockStructure.localLow;

      let totalShares = 0;
      let totalCostSum = 0;

      batches.forEach(b => {
        const c = parseFloat(b.cost) || 0;
        const s = parseInt(b.shares) || 0;
        totalShares += s;
        totalCostSum += (c * s);

        const rowPnl = (curPrice - c) * s;
        const pnlLabel = document.getElementById(`batch-pnl-${b.id}`);
        if (pnlLabel) {
          pnlLabel.innerText = `${rowPnl >= 0 ? '+' : ''}${Math.round(rowPnl).toLocaleString()}`;
          pnlLabel.className = `font-mono text-xs sm:text-sm font-bold block ${rowPnl >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
        }
      });

      const avgCost = totalShares > 0 ? (totalCostSum / totalShares) : 0;
      const totalPnl = Math.round((curPrice - avgCost) * totalShares);
      const totalPnlPct = avgCost > 0 ? (((curPrice - avgCost) / avgCost) * 100).toFixed(1) : 0;

      const statCost = document.getElementById('stat-avg-cost');
      const statShares = document.getElementById('stat-total-shares');
      const pnlLabel = document.getElementById('port-pnl-label');
      const statusPill = document.getElementById('port-status-pill');

      if (statCost) statCost.innerText = `$${avgCost.toFixed(2)}`;
      if (statShares) statShares.innerText = `${totalShares.toLocaleString()} 股`;

      if (pnlLabel) {
        pnlLabel.innerText = `${totalPnl >= 0 ? '+' : ''}${totalPnl.toLocaleString()} 元 (${totalPnlPct}%)`;
        pnlLabel.className = `font-mono font-bold text-sm sm:text-base ${totalPnl >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
      }
      if (statusPill) {
        statusPill.innerText = totalPnl >= 0 ? '整體獲利中' : '回檔整理中';
        statusPill.className = `text-xs font-bold px-2.5 py-1 rounded-lg ${totalPnl >= 0 ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-red-950 text-red-300 border border-red-800'}`;
      }

      if (avgCost > 0) {
        if (!avgCostLine) {
          avgCostLine = addLine(avgCost, '#3b82f6', '【加權均價】', 1, 2);
        } else {
          avgCostLine.applyOptions({ price: avgCost });
        }
      }

      const t1Shares = Math.round(totalShares * 0.6);
      const t2Shares = totalShares - t1Shares;
      const t1Profit = Math.round((t1 - avgCost) * t1Shares);
      const t2Profit = Math.round((t2 - avgCost) * t2Shares);
      const t1Pct = avgCost > 0 ? (((t1 - avgCost) / avgCost) * 100).toFixed(1) : 0;
      const t2Pct = avgCost > 0 ? (((t2 - avgCost) / avgCost) * 100).toFixed(1) : 0;

      const t1Title = document.getElementById('port-t1-title');
      const t1Money = document.getElementById('port-t1-money');
      const t1PctElem = document.getElementById('port-t1-pct');

      const t2Title = document.getElementById('port-t2-title');
      const t2Money = document.getElementById('port-t2-money');
      const t2PctElem = document.getElementById('port-t2-pct');

      if (t1Title) t1Title.innerText = `🎯 T1 建議收割 60% (${t1Shares.toLocaleString()} 股)`;
      if (t1Money) t1Money.innerText = `+${t1Profit.toLocaleString()} 元`;
      if (t1PctElem) t1PctElem.innerText = `(+${t1Pct}%)`;

      if (t2Title) t2Title.innerText = `🏆 T2 奔跑 40% (${t2Shares.toLocaleString()} 股)`;
      if (t2Money) t2Money.innerText = `+${t2Profit.toLocaleString()} 元`;
      if (t2PctElem) t2PctElem.innerText = `(+${t2Pct}%)`;

      const risk = Math.max(0, (avgCost - stop) * totalShares);
      const totalReward = t1Profit + t2Profit;
      const hud = document.getElementById('hud-bottom-card');
      if (hud) {
        hud.innerHTML = `
          <div class="text-gray-400 font-bold text-xs border-b border-gray-700/60 pb-1 flex justify-between">
            <span>持倉極限風控 (${batches.length} 筆批次)</span>
            <span class="text-red-400 font-bold font-mono">底座防守: $${stop}</span>
          </div>
          <div class="flex justify-between text-gray-300 text-xs sm:text-sm">
            <span>若破底最大承擔風險：</span>
            <span class="text-red-400 font-mono font-bold">-$${Math.round(risk).toLocaleString()}</span>
          </div>
          <div class="flex justify-between text-emerald-400 font-bold pt-1.5 border-t border-gray-700/60 text-xs sm:text-sm">
            <span>全波段最優期望總盈餘：</span>
            <span class="font-mono text-sm sm:text-base">+$${totalReward.toLocaleString()}</span>
          </div>
        `;
      }
    }

    function saveProfiles() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stockProfiles));
    }

    function renderStockSelect() {
      const select = document.getElementById('stock-select');
      select.innerHTML = '';
      Object.keys(stockProfiles).forEach(code => {
        const opt = document.createElement('option');
        opt.value = code;
        opt.innerText = `${code} ${stockProfiles[code].name}`;
        if (code === currentCode) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchStock(code) {
      loadStock(code);
    }

    function setTimeframe(tf) {
      currentTimeframe = tf;
      ['D', 'W', 'M'].forEach(t => {
        document.getElementById(`tf-${t}`).className = (t === tf)
          ? 'px-2 py-1 rounded-lg bg-blue-600 text-white font-bold transition'
          : 'px-2 py-1 rounded-lg text-gray-400 hover:text-white font-bold transition';
      });
      renderActiveTimeframe();
    }

    function renderActiveTimeframe() {
      if (rawDailyKlines.length === 0) return;
      candleSeries.setData(aggregateKlines(rawDailyKlines, currentTimeframe));
      const map = { D: '日 K', W: '週 K', M: '月 K' };
      document.getElementById('chart-info').innerText = `${currentCode} ${stockProfiles[currentCode].name} 【${map[currentTimeframe]}】`;
    }

    function aggregateKlines(dailyData, type) {
      if (type === 'D') return dailyData;
      const groups = {};
      dailyData.forEach(bar => {
        let key = '';
        const d = new Date(bar.time);
        if (type === 'W') {
          const day = d.getDay() || 7;
          d.setDate(d.getDate() - day + 1);
          key = d.toISOString().split('T')[0];
        } else if (type === 'M') {
          key = `${bar.time.slice(0, 7)}-01`;
        }
        if (!groups[key]) {
          groups[key] = { time: key, open: bar.open, high: bar.high, low: bar.low, close: bar.close };
        } else {
          groups[key].high = Math.max(groups[key].high, bar.high);
          groups[key].low = Math.min(groups[key].low, bar.low);
          groups[key].close = bar.close;
        }
      });
      return Object.values(groups);
    }

    function openModal() { document.getElementById('modal-custom').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modal-custom').classList.add('hidden'); }

    function confirmCustomStock() {
      const code = document.getElementById('custom-code').value.trim();
      const name = document.getElementById('custom-name').value.trim();
      if (!code || !name) return alert('請填妥資訊');

      stockProfiles[code] = { name, batches: [] };
      saveProfiles();
      renderStockSelect();
      closeModal();
      switchStock(code);
      runFullAutoScanner();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initChart();
      renderStockSelect();
      switchStock('9945');
    });
  </script>
</body>
