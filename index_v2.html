<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>多批次波段決策終端 (動態定價完整修復版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body {
      background-color: #0b0e14;
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    /* 防止手機端點擊輸入框時畫面放大跳動 */
    @media screen and (max-width: 768px) {
      input, select { font-size: 16px !important; }
    }
    /* 平滑美化滾動條 */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen md:h-screen w-screen overflow-x-hidden md:overflow-hidden p-2.5 sm:p-3 md:p-4 flex flex-col justify-between gap-2.5 md:gap-3">

  <!-- 頂部操控列 -->
  <header class="w-full bg-gray-900/90 border border-gray-800 rounded-2xl px-3 py-2.5 flex flex-wrap items-center justify-between gap-2.5 shrink-0 shadow-lg">
    <div class="flex items-center gap-2">
      <span class="text-base sm:text-lg font-black text-white tracking-wide flex items-center gap-1.5">
        ⚡ 波段決策終端
      </span>
      
      <!-- 核心雙模式切換 -->
      <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 text-xs sm:text-sm font-bold gap-1">
        <button onclick="setDashboardMode('HUNTER')" id="tab-HUNTER" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white transition flex items-center gap-1 font-bold">
          <span>🎯</span> <span>自動選股</span>
        </button>
        <button onclick="setDashboardMode('PORTFOLIO')" id="tab-PORTFOLIO" class="px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition flex items-center gap-1 font-bold">
          <span>💼</span> <span>持倉簿記</span>
        </button>
      </div>
    </div>

    <!-- 股票選擇與時框 -->
    <div class="flex items-center gap-2">
      <select id="stock-select" onchange="switchStock(this.value)" class="bg-gray-800 border border-gray-700 text-white text-xs sm:text-sm rounded-xl px-2.5 py-1.5 font-bold focus:outline-none focus:border-blue-500">
      </select>

      <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800 text-xs font-bold gap-0.5">
        <button onclick="setTimeframe('D')" id="tf-D" class="px-2.5 py-1 rounded-lg bg-blue-600 text-white transition">日</button>
        <button onclick="setTimeframe('W')" id="tf-W" class="px-2.5 py-1 rounded-lg text-gray-400 hover:text-white transition">週</button>
        <button onclick="setTimeframe('M')" id="tf-M" class="px-2.5 py-1 rounded-lg text-gray-400 hover:text-white transition">月</button>
      </div>

      <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl transition shadow flex items-center gap-1">
        <span>＋</span> <span>自選</span>
      </button>
    </div>
  </header>

  <!-- 主工作區 -->
  <main class="w-full flex-1 grid grid-cols-1 md:grid-cols-12 gap-2.5 md:gap-3 min-h-0">
    
    <!-- 左側 K 線圖表 -->
    <section class="md:col-span-7 lg:col-span-8 xl:col-span-8 bg-gray-900 border border-gray-800 rounded-2xl p-3 flex flex-col justify-between min-h-[360px] md:min-h-0 shadow-md">
      <div class="flex flex-wrap justify-between items-center text-xs sm:text-sm pb-2 border-b border-gray-800/80 gap-2 shrink-0">
        <div class="flex items-center gap-2">
          <span id="chart-info" class="font-bold text-white tracking-wide">連線中...</span>
          <div class="flex bg-gray-950 p-0.5 rounded-xl border border-gray-800 text-[11px] font-bold">
            <button id="view-mode-FOCUS" onclick="setViewMode('FOCUS')" class="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold transition flex items-center gap-1 shadow-sm">
              <span>🔍</span> <span>聚焦K棒</span>
            </button>
            <button id="view-mode-T1" onclick="setViewMode('T1')" class="px-2 py-1 rounded-lg text-gray-400 hover:text-white font-bold transition flex items-center gap-1">
              <span>🎯</span> <span>T1視角</span>
            </button>
            <button id="view-mode-MACRO" onclick="setViewMode('MACRO')" class="px-2 py-1 rounded-lg text-gray-400 hover:text-white font-bold transition flex items-center gap-1">
              <span>🔭</span> <span>T2全景</span>
            </button>
          </div>
          <button id="btn-chart-toggle" onclick="toggleChartDisplay()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-lg text-xs font-semibold border border-gray-700">
            👁️ <span id="btn-chart-toggle-text">隱藏</span>
          </button>
          <div class="flex items-center gap-1.5 bg-gray-950 px-2 py-1 rounded-lg border border-gray-800 text-xs">
            <span class="text-gray-400">透明度</span>
            <input type="range" min="10" max="100" value="100" oninput="changeChartOpacity(this.value)" class="w-14 sm:w-16 h-1.5 accent-blue-500 cursor-pointer" />
            <span id="chart-opacity-val" class="text-gray-400 w-7 text-right">100%</span>
          </div>
        </div>

        <div id="dynamic-legend" class="flex flex-wrap gap-2 text-xs font-semibold"></div>
      </div>

      <div class="relative w-full flex-1 min-h-[300px] md:min-h-0 mt-1.5 rounded-xl overflow-hidden">
        <div id="chart-box" class="w-full h-full min-h-[300px] md:min-h-0 transition-opacity duration-150"></div>
        <!-- 畫面上方懸浮目標指引 (避開右側刻度 58px) -->
        <div id="floating-targets" class="absolute top-2 right-14 flex flex-col gap-1.5 z-10 pointer-events-auto"></div>
      </div>
      
      <div id="chart-hidden-placeholder" class="hidden w-full flex-1 flex flex-col items-center justify-center text-gray-500 gap-2 border border-dashed border-gray-800 py-12">
        <span class="text-3xl">👁️‍🗨️</span>
        <span class="text-sm">線圖已隱藏 · 專注水位決策</span>
      </div>
    </section>

    <!-- 右側 雙模動態操作面板 -->
    <section class="md:col-span-5 lg:col-span-4 xl:col-span-4 bg-gray-900 border border-gray-800 rounded-2xl p-3 sm:p-4 flex flex-col justify-between gap-3 overflow-y-auto shadow-md">
      <div id="panel-content-container" class="space-y-3"></div>
      <div id="hud-bottom-card" class="bg-gray-800/40 p-3 rounded-xl border border-gray-700/60 text-xs sm:text-sm space-y-1.5 mt-1"></div>
    </section>
  </main>

  <!-- 自訂股票彈窗 -->
  <div id="modal-custom" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-900 border border-gray-800 w-full max-w-xs p-5 rounded-2xl space-y-3.5 shadow-2xl">
      <h3 class="text-base font-black text-white">加入監控池</h3>
      <div class="space-y-2.5 text-xs sm:text-sm">
        <div>
          <label class="block text-gray-400 mb-1 font-semibold">台股代號</label>
          <input id="custom-code" type="text" placeholder="例: 2454" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-white uppercase outline-none focus:border-blue-500 font-bold" />
        </div>
        <div>
          <label class="block text-gray-400 mb-1 font-semibold">股票名稱</label>
          <input id="custom-name" type="text" placeholder="例: 聯發科" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-white outline-none focus:border-blue-500 font-bold" />
        </div>
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="closeModal()" class="flex-1 py-2 text-xs sm:text-sm text-gray-400 bg-gray-800 rounded-xl font-bold">取消</button>
        <button onclick="confirmCustomStock()" class="flex-1 py-2 text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold">加入</button>
      </div>
    </div>
  </div>

  <script>
    const defaultLedgerProfiles = {
      '9945': {
        name: '潤泰新',
        batches: [
          { id: 'b_1', cost: 26.1, shares: 63818, tag: '核心倉' }
        ]
      },
      '2330': {
        name: '台積電',
        batches: []
      },
      '2603': {
        name: '長榮',
        batches: []
      },
      '2317': {
        name: '鴻海',
        batches: []
      },
      '3231': {
        name: '緯創',
        batches: []
      }
    };

    const STORAGE_KEY = 'macro_trader_multi_batches_v4';
    let stockProfiles = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultLedgerProfiles;
    let currentCode = '9945';
    let currentDashboardMode = 'HUNTER';

    let rawDailyKlines = [];
    let currentTimeframe = 'D';
    let chart, candleSeries;
    let activePriceLines = [];
    let avgCostLine = null;
    let isChartHidden = false;

    let scannedOpportunities = [];
    let isScanning = false;
    let currentViewMode = 'FOCUS'; // 預設聚焦K棒模式，保證K棒飽滿清晰

    let currentStockStructure = {
      currentPrice: 0,
      macroLow: 0,
      macroHigh: 0,
      localLow: 0,
      boxH: 0,
      t1: 0,
      t2: 0,
      strategyType: '',
      suggestedEntry: 0,
      suggestedStop: 0,
      rrRatio: 0,
      rationale: ''
    };

    function initChart() {
      const box = document.getElementById('chart-box');
      chart = LightweightCharts.createChart(box, {
        width: box.clientWidth,
        height: box.clientHeight || 400,
        layout: { background: { color: '#0b0e14' }, textColor: '#64748b' },
        grid: { vertLines: { color: '#161e2e' }, horzLines: { color: '#161e2e' } },
        rightPriceScale: { borderColor: '#334155' },
        timeScale: { borderColor: '#334155' },
        handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
        handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#ef4444', downColor: '#22c55e', borderVisible: false,
        wickUpColor: '#ef4444', wickDownColor: '#22c55e',
        autoscaleInfoProvider: (original) => {
          const res = original();
          if (res !== null && res.priceRange !== null) {
            let minP = res.priceRange.minValue;
            let maxP = res.priceRange.maxValue;

            // 模式 1：【🔍 聚焦K棒】(預設) 僅以當前K棒與鄰近支撐防守定界，K棒巨大飽滿
            if (currentViewMode === 'FOCUS') {
              if (currentStockStructure.suggestedStop > 0 && currentStockStructure.suggestedStop < minP) {
                minP = Math.min(minP, currentStockStructure.suggestedStop * 0.995);
              }
              if (currentStockStructure.suggestedEntry > 0 && currentStockStructure.suggestedEntry > maxP) {
                maxP = Math.max(maxP, currentStockStructure.suggestedEntry * 1.005);
              }
              return {
                priceRange: {
                  minValue: minP * 0.99,
                  maxValue: maxP * 1.01
                },
                margins: res.margins
              };
            }
            // 模式 2：【🎯 望向 T1】適度將縱軸推升至包含 T1 目標線 ($38.8)，K線依然清晰
            else if (currentViewMode === 'T1') {
              if (currentStockStructure.suggestedStop > 0) {
                minP = Math.min(minP, currentStockStructure.suggestedStop * 0.99);
              }
              if (currentStockStructure.t1 > 0) {
                maxP = Math.max(maxP, currentStockStructure.t1 * 1.02);
              }
              return {
                priceRange: {
                  minValue: minP * 0.99,
                  maxValue: maxP
                },
                margins: res.margins
              };
            }
            // 模式 3：【🔭 T2 全景】涵蓋全部宏觀波段與二次亞當 ($54.7)
            else if (currentViewMode === 'MACRO') {
              if (currentStockStructure.suggestedStop > 0) {
                minP = Math.min(minP, currentStockStructure.suggestedStop * 0.98);
              }
              if (currentStockStructure.localLow > 0) {
                minP = Math.min(minP, currentStockStructure.localLow * 0.98);
              }
              if (currentStockStructure.t2 > 0) {
                maxP = Math.max(maxP, currentStockStructure.t2 * 1.03);
              }
              return {
                priceRange: {
                  minValue: minP,
                  maxValue: maxP
                },
                margins: res.margins
              };
            }
          }
          return res;
        }
      });

      window.addEventListener('resize', () => {
        if (chart && box && !isChartHidden) {
          chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
        }
      });
    }

    function changeChartOpacity(val) {
      document.getElementById('chart-box').style.opacity = val / 100;
      document.getElementById('chart-opacity-val').innerText = `${val}%`;
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      ['FOCUS', 'T1', 'MACRO'].forEach(m => {
        const btn = document.getElementById(`view-mode-${m}`);
        if (btn) {
          btn.className = (m === mode)
            ? 'px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold transition flex items-center gap-1 shadow-sm'
            : 'px-2.5 py-1 rounded-lg text-gray-400 hover:text-white font-bold transition flex items-center gap-1';
        }
      });

      updateFloatingBadges();

      if (candleSeries && chart) {
        candleSeries.applyOptions({});
        chart.priceScale('right').applyOptions({ autoScale: true });
      }
    }

    function updateFloatingBadges() {
      const container = document.getElementById('floating-targets');
      if (!container) return;

      const t1 = currentStockStructure.t1;
      const t2 = currentStockStructure.t2;

      if (currentViewMode === 'FOCUS') {
        container.classList.remove('hidden');
        container.innerHTML = `
          <button onclick="setViewMode('T1')" class="bg-emerald-950/90 hover:bg-emerald-900 border border-emerald-600/80 text-emerald-300 px-2.5 py-1 rounded-lg text-[11px] font-bold shadow-lg flex items-center gap-1.5 backdrop-blur-md transition active:scale-95">
            <span>🎯 望向 T1 ($${t1})</span> <span class="text-xs">↗</span>
          </button>
          <button onclick="setViewMode('MACRO')" class="bg-amber-950/90 hover:bg-amber-900 border border-amber-600/80 text-amber-300 px-2.5 py-1 rounded-lg text-[11px] font-bold shadow-lg flex items-center gap-1.5 backdrop-blur-md transition active:scale-95">
            <span>🏆 望向 T2 ($${t2})</span> <span class="text-xs">↗</span>
          </button>
        `;
      } else if (currentViewMode === 'T1') {
        container.classList.remove('hidden');
        container.innerHTML = `
          <button onclick="setViewMode('MACRO')" class="bg-amber-950/90 hover:bg-amber-900 border border-amber-600/80 text-amber-300 px-2.5 py-1 rounded-lg text-[11px] font-bold shadow-lg flex items-center gap-1.5 backdrop-blur-md transition active:scale-95">
            <span>🏆 望向 T2 ($${t2})</span> <span class="text-xs">↗</span>
          </button>
        `;
      } else {
        container.classList.add('hidden');
        container.innerHTML = '';
      }
    }

    function toggleChartDisplay() {
      isChartHidden = !isChartHidden;
      const box = document.getElementById('chart-box');
      const placeholder = document.getElementById('chart-hidden-placeholder');
      const btnText = document.getElementById('btn-chart-toggle-text');

      const floatBadges = document.getElementById('floating-targets');
      if (isChartHidden) {
        box.classList.add('hidden');
        if (floatBadges) floatBadges.classList.add('hidden');
        placeholder.classList.remove('hidden');
        btnText.innerText = '顯示';
      } else {
        box.classList.remove('hidden');
        if (floatBadges) updateFloatingBadges();
        placeholder.classList.add('hidden');
        btnText.innerText = '隱藏';
        if (chart && box) chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
      }
    }

    function setDashboardMode(mode) {
      currentDashboardMode = mode;
      document.getElementById('tab-HUNTER').className = (mode === 'HUNTER')
        ? 'px-3 py-1.5 rounded-lg bg-blue-600 text-white transition flex items-center gap-1 font-bold'
        : 'px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition flex items-center gap-1 font-bold';
      document.getElementById('tab-PORTFOLIO').className = (mode === 'PORTFOLIO')
        ? 'px-3 py-1.5 rounded-lg bg-blue-600 text-white transition flex items-center gap-1 font-bold'
        : 'px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition flex items-center gap-1 font-bold';
      
      renderModeUI();
    }

    async function loadStock(code) {
      currentCode = code;
      if (!stockProfiles[code]) {
        stockProfiles[code] = { name: code, batches: [] };
      }
      const profile = stockProfiles[code];
      document.getElementById('chart-info').innerText = `正在讀取 ${code} ${profile.name} ...`;

      const select = document.getElementById('stock-select');
      if (select && select.value !== code) select.value = code;

      const startDate = new Date();
      startDate.setDate(startDate.getDate() - 750);
      const startStr = startDate.toISOString().split('T')[0];
      const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startStr}`;

      try {
        const res = await fetch(url);
        const json = await res.json();
        if (!json.data || json.data.length === 0) throw new Error('無數據');

        // 正確過濾並映射 FinMind max/min 欄位
        rawDailyKlines = json.data
          .filter(d => d.date && d.close > 0 && d.max > 0 && d.min > 0)
          .map(d => ({
            time: d.date,
            open: d.open || d.close,
            high: d.max,
            low: d.min,
            close: d.close,
            volume: d.Trading_Volume || d.volume || 0
          }));

        currentStockStructure.currentPrice = rawDailyKlines[rawDailyKlines.length - 1].close;

        analyzeStockStructure(rawDailyKlines);
        renderActiveTimeframe();
        renderModeUI();

        updateFloatingBadges();
        if (candleSeries && chart) {
          candleSeries.applyOptions({});
          chart.priceScale('right').applyOptions({ autoScale: true });
        }

        if (scannedOpportunities.length === 0) {
          runFullAutoScanner();
        }

        setTimeout(() => {
          const box = document.getElementById('chart-box');
          if (!isChartHidden) chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
        }, 100);
      } catch (err) {
        document.getElementById('chart-info').innerText = `${code} 載入失敗`;
      }
    }

    // =========================================================================
    // 核心演算法：多因子動態定價引擎 (ATR + 均線 + 斐波那契 + 宏觀幾何)
    // 徹底解決「無腦把收盤價當買點」問題
    // =========================================================================
    function calculateDynamicPricing(klines, mLow, mHigh, lLow, t1) {
      const len = klines.length;
      const curPrice = klines[len - 1].close;

      // 1. 計算 14 日真實波幅 (ATR14)
      let trSum = 0;
      const atrPeriod = Math.min(14, len - 1);
      for (let i = len - atrPeriod; i < len; i++) {
        const h = klines[i].high;
        const l = klines[i].low;
        const prevC = klines[i - 1].close;
        const tr = Math.max(h - l, Math.abs(h - prevC), Math.abs(l - prevC));
        trSum += tr;
      }
      const atr14 = Math.max(0.1, trSum / atrPeriod);

      // 2. 計算 10MA 與 20MA
      const ma10 = klines.slice(-10).reduce((sum, k) => sum + k.close, 0) / 10;
      const ma20 = klines.slice(-20).reduce((sum, k) => sum + k.close, 0) / 20;

      // 3. 計算近 20 日微觀波段斐波那契回撤位
      const recentSlice = klines.slice(-20);
      const rHigh = Math.max(...recentSlice.map(k => k.high));
      const rLow = Math.min(...recentSlice.map(k => k.low));
      const fibDiff = rHigh - rLow;
      const fib382 = parseFloat((rHigh - 0.382 * fibDiff).toFixed(2));
      const fib500 = parseFloat((rHigh - 0.500 * fibDiff).toFixed(2));
      const fib618 = parseFloat((rHigh - 0.618 * fibDiff).toFixed(2));

      let entry = 0;
      let stop = 0;
      let type = '';
      let rationale = '';
      let priority = 1;

      // --- 情境 A：突破/回踩接力段 (現價位於宏觀頸線附近) ---
      if (curPrice >= mHigh * 0.985 && curPrice <= mHigh * 1.05) {
        type = '🚀 頸線動能突破/回踩';
        entry = parseFloat(mHigh.toFixed(2));
        stop = parseFloat((mHigh - 1.2 * atr14).toFixed(2));
        rationale = `站穩宏觀頸線 $${mHigh} 買進，設 1.2×ATR ($${(1.2*atr14).toFixed(2)}) 假突破防洗停損`;
        priority = 5;
      }
      // --- 情境 B：底座共振低吸段 (現價貼近近期底座) ---
      else if (curPrice <= lLow * 1.035) {
        type = '🛡️ 底座止跌低吸點';
        entry = parseFloat((lLow + 0.3 * atr14).toFixed(2)); // 底座上方微幅確認掛單
        stop = parseFloat((lLow - 0.5 * atr14).toFixed(2));
        rationale = `測試底座 $${lLow}，於底座上方 0.3×ATR ($${entry}) 掛單，停損守破底`;
        priority = 4;
      }
      // --- 情境 C：上升趨勢中的均線回踩段 (多頭排列) ---
      else if (curPrice >= ma20 && ma10 >= ma20) {
        type = '📈 多頭均線/0.382回踩';
        const sup = Math.max(ma20, fib382);
        if (sup < curPrice) {
          entry = parseFloat(sup.toFixed(2));
        } else {
          entry = parseFloat(Math.max(ma20, fib500).toFixed(2));
        }
        if (entry >= curPrice) {
          entry = parseFloat((curPrice - 0.3 * atr14).toFixed(2));
        }
        stop = parseFloat(Math.min(fib618, entry - 1.0 * atr14).toFixed(2));
        rationale = `多頭排列，預約於 20MA ($${ma20.toFixed(2)}) 或 0.382 費氏位 ($${fib382}) 支撐回踩掛單`;
        priority = 3;
      }
      // --- 情境 D：箱體中段整理 (絕不無腦追現價，等 0.500 黃金回撤) ---
      else {
        type = '⏳ 區間震盪·回踩掛單';
        if (fib500 < curPrice) {
          entry = fib500;
        } else if (fib618 < curPrice) {
          entry = fib618;
        } else {
          entry = parseFloat((curPrice - 0.5 * atr14).toFixed(2));
        }
        stop = parseFloat(Math.min(lLow, entry - 1.0 * atr14).toFixed(2));
        rationale = `股價處於區間半山腰，拒絕追現價；預約於 0.5 費氏位 $${entry} 限價接刀`;
        priority = 2;
      }

      // 風險與期望值
      const risk = Math.max(0.1, parseFloat((entry - stop).toFixed(2)));
      const reward = Math.max(0.1, parseFloat((t1 - entry).toFixed(2)));
      const rr = parseFloat((reward / risk).toFixed(1));

      return { entry, stop, type, rationale, priority, rr };
    }

    function analyzeStockStructure(klines) {
      if (klines.length < 30) return;

      const macroLookback = klines.slice(-150);
      const mLow = Math.min(...macroLookback.map(k => k.low));
      const mHigh = Math.max(...macroLookback.map(k => k.high));

      const localSlice = klines.slice(-25);
      const lLow = Math.min(...localSlice.map(k => k.low));

      const boxH = mHigh - mLow;
      const t1 = parseFloat((mHigh + boxH).toFixed(2));
      const t2 = parseFloat((t1 + (t1 - mLow)).toFixed(2));

      currentStockStructure.macroLow = parseFloat(mLow.toFixed(2));
      currentStockStructure.macroHigh = parseFloat(mHigh.toFixed(2));
      currentStockStructure.localLow = parseFloat(lLow.toFixed(2));
      currentStockStructure.boxH = parseFloat(boxH.toFixed(2));
      currentStockStructure.t1 = t1;
      currentStockStructure.t2 = t2;

      // 呼叫多因子動態定價引擎
      const plan = calculateDynamicPricing(klines, mLow, mHigh, lLow, t1);
      currentStockStructure.strategyType = plan.type;
      currentStockStructure.suggestedEntry = plan.entry;
      currentStockStructure.suggestedStop = plan.stop;
      currentStockStructure.rationale = plan.rationale;
      currentStockStructure.rrRatio = plan.rr;
    }

    async function runFullAutoScanner() {
      if (isScanning) return;
      isScanning = true;
      const btn = document.getElementById('btn-run-scan');
      if (btn) btn.innerText = '⚡ 掃描中...';

      const poolCodes = Object.keys(stockProfiles);
      const startDate = new Date();
      startDate.setDate(startDate.getDate() - 250);
      const startStr = startDate.toISOString().split('T')[0];

      const promises = poolCodes.map(code => {
        const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startStr}`;
        return fetch(url).then(r => r.json()).then(res => ({ code, data: res.data || [] })).catch(() => ({ code, data: [] }));
      });

      const results = await Promise.allSettled(promises);
      const opportunities = [];

      results.forEach(res => {
        const code = res.value ? res.value.code : null;
        if (!code) return;
        const rawData = res.value.data || [];

        // 核心修復：正確將 FinMind max/min 映射為 high/low
        const klines = rawData
          .filter(d => d.date && d.close > 0 && d.max > 0 && d.min > 0)
          .map(d => ({
            time: d.date,
            open: d.open || d.close,
            high: d.max,
            low: d.min,
            close: d.close,
            volume: d.Trading_Volume || d.volume || 0
          }));

        if (klines.length > 30) {
          const curClose = klines[klines.length - 1].close;
          const lookback = klines.slice(-120);
          const mLow = Math.min(...lookback.map(k => k.low));
          const mHigh = Math.max(...lookback.map(k => k.high));
          const lLow = Math.min(...klines.slice(-20).map(k => k.low));

          const boxH = mHigh - mLow;
          const t1 = parseFloat((mHigh + boxH).toFixed(2));
          const t2 = parseFloat((t1 + (t1 - mLow)).toFixed(2));

          const plan = calculateDynamicPricing(klines, mLow, mHigh, lLow, t1);

          opportunities.push({
            code,
            name: stockProfiles[code].name,
            currentPrice: curClose,
            entry: plan.entry,
            stop: plan.stop,
            t1,
            t2,
            rr: plan.rr,
            tag: plan.type,
            priority: plan.priority,
            score: plan.priority * 10 + plan.rr
          });
        } else {
          opportunities.push({
            code,
            name: stockProfiles[code].name,
            currentPrice: 0,
            entry: 0,
            stop: 0,
            t1: 0,
            t2: 0,
            rr: 0,
            tag: '⏳ 資料讀取中',
            priority: 0,
            score: 0
          });
        }
      });

      opportunities.sort((a, b) => b.score - a.score);
      scannedOpportunities = opportunities;
      isScanning = false;

      if (currentDashboardMode === 'HUNTER') {
        renderHunterMode();
      }
    }

      const profile = stockProfiles[currentCode];
      if (!profile || !profile.batches) return;

      const target = profile.batches.find(b => b.id === batchId);
      if (!target) return;

      const numVal = parseFloat(val);
      if (!isNaN(numVal)) {
        target[field] = numVal;
        saveProfiles();
        recalcPortfolioAggregates();
      }
    }

    function recalcPortfolioAggregates() {
      const profile = stockProfiles[currentCode];
      const batches = profile.batches || [];
      const curPrice = currentStockStructure.currentPrice;
      const t1 = currentStockStructure.t1;
      const t2 = currentStockStructure.t2;
      const stop = currentStockStructure.localLow;

      let totalShares = 0;
      let totalCostSum = 0;

      batches.forEach(b => {
        const c = parseFloat(b.cost) || 0;
        const s = parseInt(b.shares) || 0;
        totalShares += s;
        totalCostSum += (c * s);

        const rowPnl = (curPrice - c) * s;
        const pnlLabel = document.getElementById(`batch-pnl-${b.id}`);
        if (pnlLabel) {
          pnlLabel.innerText = `${rowPnl >= 0 ? '+' : ''}${Math.round(rowPnl).toLocaleString()}`;
          pnlLabel.className = `font-mono text-xs sm:text-sm font-bold block ${rowPnl >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
        }
      });

      const avgCost = totalShares > 0 ? (totalCostSum / totalShares) : 0;
      const totalPnl = Math.round((curPrice - avgCost) * totalShares);
      const totalPnlPct = avgCost > 0 ? (((curPrice - avgCost) / avgCost) * 100).toFixed(1) : 0;

      const statCost = document.getElementById('stat-avg-cost');
      const statShares = document.getElementById('stat-total-shares');
      const pnlLabel = document.getElementById('port-pnl-label');
      const statusPill = document.getElementById('port-status-pill');

      if (statCost) statCost.innerText = `$${avgCost.toFixed(2)}`;
      if (statShares) statShares.innerText = `${totalShares.toLocaleString()} 股`;

      if (pnlLabel) {
        pnlLabel.innerText = `${totalPnl >= 0 ? '+' : ''}${totalPnl.toLocaleString()} 元 (${totalPnlPct}%)`;
        pnlLabel.className = `font-mono font-bold text-sm sm:text-base ${totalPnl >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
      }
      if (statusPill) {
        statusPill.innerText = totalPnl >= 0 ? '整體獲利中' : '回檔整理中';
        statusPill.className = `text-xs font-bold px-2.5 py-1 rounded-lg ${totalPnl >= 0 ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-red-950 text-red-300 border border-red-800'}`;
      }

      if (avgCost > 0) {
        if (!avgCostLine) {
          avgCostLine = addLine(avgCost, '#3b82f6', '【加權均價】', 1, 2);
        } else {
          avgCostLine.applyOptions({ price: avgCost });
        }
      } else if (avgCostLine) {
        candleSeries.removePriceLine(avgCostLine);
        avgCostLine = null;
      }

      const t1Shares = Math.round(totalShares * 0.6);
      const t2Shares = totalShares - t1Shares;
      const t1Profit = Math.round((t1 - avgCost) * t1Shares);
      const t2Profit = Math.round((t2 - avgCost) * t2Shares);
      const t1Pct = avgCost > 0 ? (((t1 - avgCost) / avgCost) * 100).toFixed(1) : 0;
      const t2Pct = avgCost > 0 ? (((t2 - avgCost) / avgCost) * 100).toFixed(1) : 0;

      const t1Title = document.getElementById('port-t1-title');
      const t1Money = document.getElementById('port-t1-money');
      const t1PctElem = document.getElementById('port-t1-pct');

      const t2Title = document.getElementById('port-t2-title');
      const t2Money = document.getElementById('port-t2-money');
      const t2PctElem = document.getElementById('port-t2-pct');

      if (t1Title) t1Title.innerText = `🎯 T1 建議收割 60% (${t1Shares.toLocaleString()} 股)`;
      if (t1Money) t1Money.innerText = `+${t1Profit.toLocaleString()} 元`;
      if (t1PctElem) t1PctElem.innerText = `(+${t1Pct}%)`;

      if (t2Title) t2Title.innerText = `🏆 T2 奔跑 40% (${t2Shares.toLocaleString()} 股)`;
      if (t2Money) t2Money.innerText = `+${t2Profit.toLocaleString()} 元`;
      if (t2PctElem) t2PctElem.innerText = `(+${t2Pct}%)`;

      const risk = Math.max(0, (avgCost - stop) * totalShares);
      const totalReward = t1Profit + t2Profit;
      const hud = document.getElementById('hud-bottom-card');
      if (hud) {
        hud.innerHTML = `
          <div class="text-gray-400 font-bold text-xs border-b border-gray-700/60 pb-1 flex justify-between">
            <span>持倉極限風控 (${batches.length} 筆批次)</span>
            <span class="text-red-400 font-bold font-mono">底座防守: $${stop}</span>
          </div>
          <div class="flex justify-between text-gray-300 text-xs sm:text-sm">
            <span>若破底最大承擔風險：</span>
            <span class="text-red-400 font-mono font-bold">-$${Math.round(risk).toLocaleString()}</span>
          </div>
          <div class="flex justify-between text-emerald-400 font-bold pt-1.5 border-t border-gray-700/60 text-xs sm:text-sm">
            <span>全波段最優期望總盈餘：</span>
            <span class="font-mono text-sm sm:text-base">+$${totalReward.toLocaleString()}</span>
          </div>
        `;
      }
    }

    function saveProfiles() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stockProfiles));
    }

    function renderStockSelect() {
      const select = document.getElementById('stock-select');
      select.innerHTML = '';
      Object.keys(stockProfiles).forEach(code => {
        const opt = document.createElement('option');
        opt.value = code;
        opt.innerText = `${code} ${stockProfiles[code].name}`;
        if (code === currentCode) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchStock(code) {
      loadStock(code);
    }

    function setTimeframe(tf) {
      currentTimeframe = tf;
      ['D', 'W', 'M'].forEach(t => {
        document.getElementById(`tf-${t}`).className = (t === tf)
          ? 'px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold transition'
          : 'px-2.5 py-1 rounded-lg text-gray-400 hover:text-white font-bold transition';
      });
      renderActiveTimeframe();
    }

    function renderActiveTimeframe() {
      if (rawDailyKlines.length === 0) return;
      candleSeries.setData(aggregateKlines(rawDailyKlines, currentTimeframe));
      const map = { D: '日 K', W: '週 K', M: '月 K' };
      document.getElementById('chart-info').innerText = `${currentCode} ${stockProfiles[currentCode].name} 【${map[currentTimeframe]}】`;
    }

    function aggregateKlines(dailyData, type) {
      if (type === 'D') return dailyData;
      const groups = {};
      dailyData.forEach(bar => {
        let key = '';
        const d = new Date(bar.time);
        if (type === 'W') {
          const day = d.getDay() || 7;
          d.setDate(d.getDate() - day + 1);
          key = d.toISOString().split('T')[0];
        } else if (type === 'M') {
          key = `${bar.time.slice(0, 7)}-01`;
        }
        if (!groups[key]) {
          groups[key] = { time: key, open: bar.open, high: bar.high, low: bar.low, close: bar.close };
        } else {
          groups[key].high = Math.max(groups[key].high, bar.high);
          groups[key].low = Math.min(groups[key].low, bar.low);
          groups[key].close = bar.close;
        }
      });
      return Object.values(groups).sort((a, b) => a.time.localeCompare(b.time));
    }

    function openModal() { document.getElementById('modal-custom').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modal-custom').classList.add('hidden'); }

    function confirmCustomStock() {
      const code = document.getElementById('custom-code').value.trim();
      const name = document.getElementById('custom-name').value.trim();
      if (!code || !name) return alert('請填妥資訊');

      stockProfiles[code] = { name, batches: [] };
      saveProfiles();
      renderStockSelect();
      closeModal();
      switchStock(code);
      runFullAutoScanner();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initChart();
      renderStockSelect();
      switchStock('9945');
    });
  </script>
</body>
